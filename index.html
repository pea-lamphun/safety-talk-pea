    }

    // ============ REPORTS VIEW ============
    function ReportsView({ atts, setAtts, locs }) {
      const week = getWeekRange();
      const [selLoc,setSelLoc]     = useState("lampun");
      const [dateFrom,setDateFrom] = useState(week.start);
      const [dateTo,setDateTo]     = useState(week.end);
      const [modal,setModal]       = useState(null);
      const [delTarget,setDelTarget] = useState(null);  // record ที่จะลบ
      const [delErr,setDelErr]     = useState("");
      const [deleting,setDeleting] = useState(false);
      const [localAtts,setLocalAtts] = useState(atts);
      const [viewMode,setViewMode] = useState("grid");   // grid | faces
      const [lateOnly,setLateOnly] = useState(false);    // แสดงเฉพาะรายการที่ลงช้า
      const [faceSearch,setFaceSearch] = useState("");
      const [badImg,setBadImg]     = useState({});       // รูปที่โหลดไม่ได้ (หมดอายุ)
      const [passing,setPassing]   = useState(null);     // id ที่กำลังกดปล่อยผ่าน

      // sync localAtts เมื่อ atts เปลี่ยน
      useEffect(()=>{ setLocalAtts(atts); },[atts]);

      // อัปเดตทั้งในหน้านี้และข้อมูลกลางของแอป (สลับแท็บแล้วไม่เด้งกลับ)
      const updateAtts = fn => { setLocalAtts(fn); if(setAtts) setAtts(fn); };

      const confirmDelete = async () => {
        setDeleting(true); setDelErr("");
        try {
          await db.collection("attendances").doc(delTarget.id).delete();
          updateAtts(prev=>prev.filter(a=>a.id!==delTarget.id));
          if(modal?.id===delTarget.id) setModal(null);
          setDelTarget(null);
        } catch(e){ setDelErr("ลบไม่สำเร็จ: "+e.message); }
        finally { setDeleting(false); }
      };

      // ปล่อยผ่าน: บันทึกว่าแอดมินตรวจแล้ว รายการนี้ยังนับเป็นเข้าร่วม
      const approveLate = async (a) => {
        setPassing(a.id);
        try {
          const patch = { lateReviewed:true, lateReviewedBy:(auth.currentUser&&auth.currentUser.email)||"", lateReviewedAt:new Date().toISOString() };
          await db.collection("attendances").doc(a.id).update(patch);
          updateAtts(prev=>prev.map(x=>x.id===a.id?{...x,...patch}:x));
          if(modal?.id===a.id) setModal(m=>({...m,...patch}));
        } catch(e){ alert("บันทึกไม่สำเร็จ: "+e.message); }
        finally { setPassing(null); }
      };

      // วันที่ตามเวลาเครื่อง (ไทย) และเวลา HH:MM
      const localDay = bkkDate;
      const hm = ts => new Date(ts).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});

      // ตรวจการลงทะเบียนช้า: แบ่งแต่ละวันเป็นกลุ่มตามช่วงห่าง ≥ 30 นาที
      // กลุ่มที่คนมากที่สุด = กลุ่มหลัก (ช่วงทำกิจกรรม) คนที่ลงหลังกลุ่มหลักจะถูกทำเครื่องหมาย
      const LATE_GAP_MIN = 30;
      const lateInfo = useMemo(()=>{
        const byDay = {};
        localAtts.forEach(a=>{ if(a.locationId!==selLoc||!a.timestamp) return; const k=localDay(a.timestamp); (byDay[k]=byDay[k]||[]).push(a); });
        const info = {};
        Object.values(byDay).forEach(list=>{
          list.sort((x,y)=>new Date(x.timestamp)-new Date(y.timestamp));
          const groups=[]; let cur=[];
          list.forEach((a,i)=>{
            if(i>0 && (new Date(a.timestamp)-new Date(list[i-1].timestamp))/60000 >= LATE_GAP_MIN){ groups.push(cur); cur=[]; }
            cur.push(a);
          });
          groups.push(cur);
          let mi=0; groups.forEach((g,i)=>{ if(g.length>groups[mi].length) mi=i; });
          const mainEnd = groups[mi][groups[mi].length-1].timestamp;
          for(let i=mi+1;i<groups.length;i++) groups[i].forEach(a=>{
            info[a.id] = { gapMin: Math.round((new Date(a.timestamp)-new Date(mainEnd))/60000), mainEnd };
          });
        });
        return info;
      },[localAtts,selLoc]);
      const isLate = a => !!lateInfo[a.id] && !a.lateReviewed;

      const locAtts = useMemo(()=>{
        return localAtts.filter(a=>{
          if(a.locationId!==selLoc||!a.timestamp) return false;
          const d=bkkDate(a.timestamp);
          return d>=dateFrom && d<=dateTo;
        });
      },[localAtts,selLoc,dateFrom,dateTo]);
      const lateCount = locAtts.filter(isLate).length;

      // เทียบใบหน้ารายคน: 5 วันล่าสุดที่ลงทะเบียน (ไม่ขึ้นกับช่วงวันที่ที่เลือก)
      // จับกลุ่มเป็น "คนเดียวกัน" ถ้ารหัสตรงกัน (หลังล้างตัวอักษรล่องหน/เว้นวรรค/ขีด) หรือ ชื่อตรงกัน
      // — แบบเดียวกับที่ Dashboard ใช้นับการเข้าร่วม (เทียบรหัส หรือ ชื่อ) เดิมใช้รหัสตรงตัวอักษรอย่างเดียว ทำให้คนเดียวแตกเป็น 2 แถว
      const personGroups = useMemo(()=>groupPeople(localAtts.filter(a=>a.locationId===selLoc && a.timestamp)),[localAtts,selLoc]);
      const faceRows = useMemo(()=>{
        const rows = personGroups.map(g=>{
          const days = new Set(); const picks = [];
          g.forEach(a=>{ const k=localDay(a.timestamp); if(days.has(k)) return; days.add(k); if(picks.length<5) picks.push(a); });
          const latest = g[0];
          // รหัสที่แสดง = รหัสที่ใช้บ่อยที่สุดในกลุ่ม (ล้างตัวล่องหนแล้ว)
          const cnt={}; g.forEach(a=>{ const c=cleanEmpId(a.empId); if(c) cnt[c]=(cnt[c]||0)+1; });
          const empId = Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x])[0] || "";
          return { key:"g:"+g[g.length-1].id, fullName:latest.fullName||"-", position:latest.position||"", department:latest.department||"", empId, days:days.size, photos:picks.reverse() };
        });
        return sortPersonnel(rows);
      },[personGroups]);
      const faceRowsShown = faceSearch.trim()
        ? faceRows.filter(r=>(r.fullName+" "+r.empId+" "+r.position+" "+r.department).toLowerCase().includes(faceSearch.trim().toLowerCase()))
        : faceRows;

      // ── ตรวจเทียบใบหน้าอัตโนมัติ: รูปวันนั้น เทียบกับรูปวันก่อนๆ ของคนเดียวกัน (สูงสุด 4 วัน) ──
      const [faceRaw,setFaceRaw] = useState({});          // att.id → ผลดิบ (ค่าความต่าง)
      const [faceLevel,setFaceLevel] = useState(()=>{ try { const v=localStorage.getItem("st_face_level"); return FACE_LEVELS[v]?v:"normal"; } catch(e){ return "normal"; } });
      const lv = FACE_LEVELS[faceLevel];
      const changeFaceLevel = v => { setFaceLevel(v); try { localStorage.setItem("st_face_level",v); } catch(e){} };
      // แปลงค่าความต่าง → ✓ / 🟡 / 🔴 ตามระดับความเข้มงวดที่เลือก
      const faceRes = useMemo(()=>{
        const o={};
        Object.keys(faceRaw).forEach(id=>{ const r=faceRaw[id]; o[id] = r.dist!=null ? {...r, status: r.dist>=lv.alert?"alert":r.dist>=lv.warn?"warn":"ok"} : r; });
        return o;
      },[faceRaw, lv]);
      const [faceRun,setFaceRun] = useState(null);        // {running,done,total,label,err}
      const [faceOnly,setFaceOnly] = useState(false);     // แสดงเฉพาะรายการที่ใบหน้าต้องตรวจ
      const faceRunRef = useRef(0);
      // หา "รูปวันก่อนหน้า" ของแต่ละรายการ
      const faceRefsOf = useMemo(()=>{
        const m = {};
        personGroups.forEach(g=>{
          g.forEach(a=>{
            const day = localDay(a.timestamp), seen = new Set([day]), refs = [];
            for(const r of g){   // g เรียงใหม่→เก่า
              if(refs.length>=FACE_REFS) break;
              const d = localDay(r.timestamp);
              if(d>=day || seen.has(d) || !r.photoURL) continue;
              seen.add(d); refs.push(r);
            }
            m[a.id] = refs;
          });
        });
        return m;
      },[personGroups]);
      // วันล่าสุดที่มีคนลงทะเบียน (ของหน่วยงานที่เลือก)
      const latestDay = useMemo(()=>{
        let d=""; personGroups.forEach(g=>{ const x=localDay(g[0].timestamp); if(x>d) d=x; }); return d;
      },[personGroups]);
      const runFaceCheck = async (list, label) => {
        const targets = list.filter(a=>a.photoURL && (faceRefsOf[a.id]||[]).length>0);
        const token = ++faceRunRef.current;
        // ผลที่เคยตรวจแล้วในรอบนี้ของหน้าเว็บ ใช้ซ้ำได้ทันที
        const cached = {}; targets.forEach(a=>{ if(FACE_RESULT.has(a.id)) cached[a.id]=FACE_RESULT.get(a.id); });
        setFaceRaw(prev=>({...prev,...cached}));
        const todo = targets.filter(a=>!FACE_RESULT.has(a.id));
        setFaceRun({running:todo.length>0, done:targets.length-todo.length, total:targets.length, label, err:""});
        if(!todo.length) return;
        try { await loadFaceApi(); }
        catch(e){ if(token===faceRunRef.current) setFaceRun(s=>({...s,running:false,err:e.message})); return; }
        let done = targets.length-todo.length;
        for(let i=0;i<todo.length;i++){
          if(token!==faceRunRef.current) return;   // เปลี่ยนหน่วยงาน/สั่งตรวจใหม่ → หยุดรอบเดิม
          // โหลดรูปรายการถัดไปล่วงหน้า (ไม่ต้องรอทีละรูป)
          if(!FACE_CORS_BLOCKED) todo.slice(i+1,i+3).forEach(n=>[n,...(faceRefsOf[n.id]||[])].forEach(x=>{ const u=safeUrl(x.photoURL); if(u) fetch(u,{mode:"cors"}).catch(()=>{}); }));
          const a = todo[i];
          const r = await faceCompare(a, faceRefsOf[a.id]||[]);
          if(r.err!=="lib") FACE_RESULT.set(a.id, r);
          if(token!==faceRunRef.current) return;
          setFaceRaw(prev=>({...prev,[a.id]:r}));
          done++; setFaceRun(s=>({...s,done}));
        }
        setFaceRun(s=>({...s,running:false}));
      };
      // ตรวจรูปเดียว (จากหน้าต่างรายละเอียด) — ไม่รบกวนการตรวจอัตโนมัติที่กำลังทำอยู่
      const checkOne = async a => {
        setFaceRaw(p=>({...p,[a.id]:{status:"checking"}}));
        const r = await faceCompare(a, faceRefsOf[a.id]||[]);
        if(r.err!=="lib") FACE_RESULT.set(a.id, r);
        setFaceRaw(p=>({...p,[a.id]:r}));
      };
      // อัตโนมัติ: เปิดหน้าหลักฐานรายวัน → ตรวจเฉพาะคนที่ลงวันล่าสุด
      useEffect(()=>{
        if(viewMode!=="grid" || !latestDay) return;
        const list = localAtts.filter(a=>a.locationId===selLoc && a.timestamp && localDay(a.timestamp)===latestDay);
        runFaceCheck(list, "วันล่าสุด ("+thaiD(latestDay+"T00:00:00")+")");
        return ()=>{ faceRunRef.current++; };   // ออกจากหน้า/เปลี่ยนหน่วยงาน → หยุด
      },[viewMode, selLoc, latestDay]);
      const faceFlag = a => { const r=faceRes[a.id]; if(!r || a.faceReviewed) return null; return (r.status==="alert"||r.status==="warn"||r.status==="noface") ? r.status : null; };
      const faceCounts = useMemo(()=>{
        const c={alert:0,warn:0,noface:0,error:0,cors:0,checked:0,scored:0};
        locAtts.forEach(a=>{ const r=faceRes[a.id]; if(!r||r.status==="checking") return; c.checked++; if(r.err==="cors") c.cors++; if(r.dist!=null) c.scored++; const f=a.faceReviewed?null:r.status; if(c[f]!=null) c[f]++; });
        return c;
      },[faceRes, locAtts]);
      const approveFace = async (a) => {
        setPassing(a.id);
        try {
          const patch = { faceReviewed:true, faceReviewedBy:(auth.currentUser&&auth.currentUser.email)||"", faceReviewedAt:new Date().toISOString() };
          await db.collection("attendances").doc(a.id).update(patch);
          updateAtts(prev=>prev.map(x=>x.id===a.id?{...x,...patch}:x));
          if(modal?.id===a.id) setModal(m=>({...m,...patch}));
        } catch(e){ alert("บันทึกไม่สำเร็จ: "+e.message); }
        finally { setPassing(null); }
      };
      const FACE_LABEL = { alert:"👤 หน้าอาจไม่ตรง", warn:"👤 ไม่แน่ใจ", noface:"👤 หาใบหน้าไม่เจอ", error:"👤 ตรวจไม่ได้" };
      // การ์ดที่ต้องดู: หน้าไม่ตรง / ไม่แน่ใจ / หาใบหน้าไม่เจอ (กรณีอ่านรูปไม่ได้ เป็นข้อจำกัดของระบบ ไม่ติดป้ายที่ตัวบุคคล)
      const faceNeedsLook = a => { const r=faceRes[a.id]; return !!r && ["alert","warn","noface"].includes(r.status); };
      const shownAtts = lateOnly ? locAtts.filter(a=>lateInfo[a.id])
                      : faceOnly ? locAtts.filter(faceNeedsLook)
                      : locAtts;

      const loc = locs[selLoc]||Object.values(locs)[0];

      // Export Excel
      const exportExcel = () => {
        const rows = locAtts.map(a=>({
          "รหัสพนักงาน":    a.empId||"-",
          "ชื่อ-นามสกุล":   a.fullName,
          "ตำแหน่ง":        a.position,
          "สังกัด/แผนก":    a.department,
          "หน่วยงาน":       a.locationName,
          "วันที่":         thaiD(a.timestamp),
          "เวลา":           new Date(a.timestamp).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}),
          "ระยะห่าง (ม.)":  a.distance,
          "พิกัด Lat":      a.location?.lat?.toFixed(6)||"",
          "พิกัด Lng":      a.location?.lng?.toFixed(6)||"",
          "URL รูปภาพ":     a.photoURL||"",
          "หมายเหตุ":       [lateInfo[a.id] ? `ลงหลังกลุ่มหลัก ${lateInfo[a.id].gapMin} นาที${a.lateReviewed?" (ปล่อยผ่านแล้ว)":""}` : "",
                             faceNeedsLook(a) ? `${FACE_LABEL[faceRes[a.id].status].replace("👤 ","ใบหน้า: ")}${faceRes[a.id].dist!=null?` (ค่าต่าง ${faceRes[a.id].dist.toFixed(2)})`:""}${a.faceReviewed?" — แอดมินตรวจแล้ว":""}` : ""
                            ].filter(Boolean).join(" / "),
        }));
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, loc.name);
        XLSX.writeFile(wb, `safety-talk-${selLoc}-${dateFrom}-${dateTo}.xlsx`);
      };

      // ป้ายแจ้งลงช้า / ปล่อยผ่านแล้ว
      const LateTag = ({a, small}) => {
        const li = lateInfo[a.id]; if(!li) return null;
        return a.lateReviewed
          ? <p className={`text-slate-400 ${small?"text-[11px]":"text-xs"}`}>✓ ปล่อยผ่านแล้ว (ลงหลังกลุ่ม {li.gapMin} นาที)</p>
          : <p className={`text-red-400 font-bold ${small?"text-[11px]":"text-xs"}`}>⏰ ลงหลังกลุ่มหลัก {li.gapMin} นาที</p>;
      };
      // ป้ายผลเทียบใบหน้า
      const FACE_TXT = { alert:"text-fuchsia-400 font-bold", warn:"text-amber-300 font-bold", noface:"text-slate-400", error:"text-slate-400" };
      const FaceTag = ({a, small}) => {
        if(!faceNeedsLook(a)) return null;
        const r = faceRes[a.id];
        return a.faceReviewed
          ? <p className={`text-slate-400 ${small?"text-[11px]":"text-xs"}`}>✓ ตรวจใบหน้าแล้ว</p>
          : <p className={`${FACE_TXT[r.status]} ${small?"text-[11px]":"text-xs"}`}>{FACE_LABEL[r.status]}</p>;
      };

      return (
        <div className="space-y-5">
          {/* Delete Confirm Modal */}
          {delTarget&&(
            <div className="fixed inset-0 bg-black/85 z-[60] flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-red-500/40 rounded-2xl p-6 shadow-2xl w-full max-w-sm text-center">
                <div className="text-4xl mb-3">🗑️</div>
                <h3 className="text-white font-black text-lg mb-1">ยืนยันการลบรายการ</h3>
                <p className="text-slate-400 text-sm mb-1">{delTarget.fullName}</p>
                <p className="text-slate-500 text-xs mb-4">{thaiDT(delTarget.timestamp)}</p>
                <p className="text-red-400 text-sm font-semibold mb-4">⚠️ ข้อมูลจะถูกลบถาวร ไม่สามารถกู้คืนได้</p>
                {delErr&&<p className="text-red-400 text-sm mb-2">{delErr}</p>}
                <div className="flex gap-3 mt-3">
                  <button onClick={()=>{setDelTarget(null);setDelErr("");}}
                    className="flex-1 bg-slate-700 text-white font-bold py-2.5 rounded-lg hover:bg-slate-600">ยกเลิก</button>
                  <button onClick={confirmDelete} disabled={deleting}
                    className="flex-1 bg-red-500 text-white font-black py-2.5 rounded-lg hover:bg-red-600 disabled:opacity-60">
                    {deleting?"กำลังลบ...":"ยืนยันลบ"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Photo Modal */}
          {modal&&(
            <div className="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4" onClick={()=>setModal(null)}>
              <div className="relative max-w-md w-full max-h-full overflow-y-auto" onClick={e=>e.stopPropagation()}>
                {badImg[modal.id+":f"]
                  ? <div className="w-full h-48 rounded-2xl bg-slate-800 border-2 border-slate-600 flex items-center justify-center text-slate-400 text-sm text-center px-4">รูปหมดอายุหรือโหลดไม่ได้<br/>(รูปใน ImgBB เก็บไว้ 90 วัน)</div>
                  : <img src={modal.photoURL} alt="proof" className="w-full rounded-2xl shadow-2xl border-2 border-emerald-500/40"
                      onError={()=>setBadImg(p=>({...p,[modal.id+":f"]:true}))}/>}
                <div className="mt-3 bg-slate-900/95 rounded-xl p-4 text-sm space-y-1">
                  <p className="text-white font-black text-base">{modal.fullName}</p>
                  <p className="text-slate-300">{modal.position} • {modal.department}</p>
                  <p className="text-emerald-400 font-semibold">{thaiDT(modal.timestamp)}</p>
                  {lateInfo[modal.id]&&<p className={modal.lateReviewed?"text-slate-400 text-xs":"text-red-400 font-bold"}>{modal.lateReviewed?"✓ ปล่อยผ่านแล้ว — ":"⏰ "}ลงหลังกลุ่มหลัก {lateInfo[modal.id].gapMin} นาที (กลุ่มหลักลงถึง {hm(lateInfo[modal.id].mainEnd)} น.)</p>}
                  {/* ผลเทียบใบหน้า + รูปวันก่อนที่ใช้เทียบ */}
                  {(faceRefsOf[modal.id]||[]).length>0 && (()=>{
                    const r = faceRes[modal.id];
                    const refs = faceRefsOf[modal.id];
                    const dOf = id => { const x=r&&r.refs&&r.refs.find(z=>z.id===id); return x?x.d:null; };
                    const msg = !r ? null
                      : r.status==="checking" ? ["text-slate-400","👤 กำลังตรวจเทียบใบหน้า…"]
                      : r.status==="alert" ? ["text-fuchsia-400 font-bold","👤 ใบหน้าอาจไม่ตรงกับวันก่อนๆ"]
                      : r.status==="warn"  ? ["text-amber-300 font-bold","👤 ไม่แน่ใจว่าเป็นคนเดียวกัน"]
                      : r.status==="ok"    ? ["text-emerald-400","👤 ใบหน้าตรงกับวันก่อนๆ"]
                      : r.status==="noface"? ["text-slate-300","👤 หาใบหน้าในรูปนี้ไม่เจอ (ใส่แมสก์ / หันข้าง / มืด ?)"]
                      : ["text-slate-300", r.err==="cors"?"👤 อ่านรูปจากที่เก็บรูปไม่ได้ (ถูกบล็อก)":r.err==="ref"?"👤 อ่านรูปวันก่อนไม่ได้ (อาจหมดอายุ)":r.err==="lib"?"👤 โหลดตัวตรวจใบหน้าไม่ได้":"👤 รูปนี้โหลดไม่ได้"];
                    return (
                      <div className="mt-2 pt-2 border-t border-slate-700">
                        {msg
                          ? <p className={msg[0]}>{msg[1]}{r.dist!=null&&<span className="text-slate-400 font-normal text-xs"> (ค่าต่าง {r.dist.toFixed(2)} • ระดับ{lv.label}: 🟡 ≥ {lv.warn.toFixed(2)} 🔴 ≥ {lv.alert.toFixed(2)})</span>}</p>
                          : <button onClick={()=>checkOne(modal)} className="text-sky-400 text-xs underline">👤 ตรวจเทียบใบหน้ารูปนี้กับวันก่อนๆ</button>}
                        {modal.faceReviewed && <p className="text-slate-400 text-xs">✓ แอดมินตรวจแล้วว่าเป็นคนเดียวกัน{modal.faceReviewedBy?` (${modal.faceReviewedBy})`:""}</p>}
                        <p className="text-slate-500 text-[11px] mt-1">รูปวันก่อนที่ใช้เทียบ:</p>
                        <div className="flex gap-1.5 overflow-x-auto pb-1">
                          {refs.map(x=>(
                            <button key={x.id} onClick={()=>setModal(x)} className="shrink-0 text-center">
                              <div className="w-14 h-16 rounded-md overflow-hidden bg-slate-800 border border-slate-600">
                                {badImg[x.id+":t"] ? <div className="w-full h-full flex items-center justify-center text-[9px] text-slate-500">หมดอายุ</div>
                                  : <img src={x.photoThumb||x.photoURL} alt="" className="w-full h-full object-cover" onError={()=>setBadImg(p=>({...p,[x.id+":t"]:true}))}/>}
                              </div>
                              <p className="text-[10px] text-slate-400 leading-tight mt-0.5">{new Date(x.timestamp).toLocaleDateString("th-TH",{day:"numeric",month:"short"})}</p>
                              {dOf(x.id)!=null && <p className={`text-[10px] leading-tight ${dOf(x.id)>=lv.alert?"text-fuchsia-400":dOf(x.id)>=lv.warn?"text-amber-300":"text-emerald-400"}`}>{dOf(x.id).toFixed(2)}</p>}
                            </button>
                          ))}
                        </div>
                      </div>
                    );
                  })()}
                  <p className="text-slate-300">📍 ระยะห่าง <span className="text-white font-bold">{modal.distance} ม.</span></p>
                  <p className="text-slate-400 text-xs font-mono">พิกัด: {modal.location?.lat?.toFixed(6)}, {modal.location?.lng?.toFixed(6)}</p>
                  {modal.empId&&<p className="text-slate-400 text-xs">รหัสพนักงาน: {modal.empId}</p>}
                  {safeUrl(modal.photoURL)&&<a href={safeUrl(modal.photoURL)} target="_blank" rel="noreferrer" className="inline-block mt-1 text-sky-400 text-xs underline">เปิดรูปในแท็บใหม่ ↗</a>}
                  <div className="flex gap-2 pt-2 flex-wrap">
                    {isLate(modal)&&(
                      <button onClick={()=>approveLate(modal)} disabled={passing===modal.id}
                        className="flex-1 bg-emerald-500/15 text-emerald-400 text-xs font-bold py-2 rounded-lg border border-emerald-500/30 hover:bg-emerald-500/25 disabled:opacity-60">
                        {passing===modal.id?"กำลังบันทึก...":"✓ ปล่อยผ่าน"}
                      </button>
                    )}
                    {faceFlag(modal)&&(
                      <button onClick={()=>approveFace(modal)} disabled={passing===modal.id}
                        className="flex-1 bg-emerald-500/15 text-emerald-400 text-xs font-bold py-2 rounded-lg border border-emerald-500/30 hover:bg-emerald-500/25 disabled:opacity-60 whitespace-nowrap">
                        {passing===modal.id?"กำลังบันทึก...":"✓ เป็นคนเดียวกัน"}
                      </button>
                    )}
                    <button onClick={()=>{setDelTarget(modal);setDelErr("");}}
                      className="flex-1 bg-red-500/10 text-red-400 text-xs font-bold py-2 rounded-lg border border-red-500/20 hover:bg-red-500/20">
                      🗑️ ลบรายการ
                    </button>
                  </div>
                </div>
                <button onClick={()=>setModal(null)} className="absolute top-2 right-2 bg-slate-900/80 text-white w-9 h-9 rounded-full flex items-center justify-center font-black text-lg hover:bg-red-500 transition-colors">✕</button>
              </div>
            </div>
          )}

          {/* เลือกหน่วยงาน */}
          <div className="bg-slate-800/50 backdrop-blur-lg border border-emerald-500/30 rounded-2xl p-5 shadow-xl">
            <h2 className="text-xl font-black text-white mb-4 flex items-center"><IBar sz={22} cl="text-emerald-400 mr-2"/>เลือกหน่วยงาน</h2>
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2">
              {Object.values(locs).map(l=>(
                <button key={l.id} onClick={()=>{setSelLoc(l.id);setLateOnly(false);setFaceOnly(false);}}
                  className={`px-3 py-2.5 rounded-xl font-bold text-xs transition-all text-center ${selLoc===l.id?"bg-emerald-500 text-slate-900 shadow-lg shadow-emerald-500/50":"bg-slate-700/80 text-slate-300 hover:bg-slate-600"}`}>
                  {l.name}
                </button>
              ))}
            </div>
            <div className="mt-3 p-3 bg-slate-900/50 rounded-lg">
              <p className="text-emerald-400 font-bold">{loc.name}</p>
              <p className="text-slate-400 text-xs">{loc.fullName}</p>
            </div>
          </div>

          {/* เลือกมุมมอง */}
          <div className="grid grid-cols-2 gap-2">
            {[["grid","📷 หลักฐานรายวัน"],["faces","👤 เทียบใบหน้ารายคน"]].map(([v,lbl])=>(
              <button key={v} onClick={()=>setViewMode(v)}
                className={`py-3 rounded-xl font-bold text-sm transition-all ${viewMode===v?"bg-emerald-500 text-slate-900 shadow-lg shadow-emerald-500/40":"bg-slate-800/80 text-slate-300 border border-slate-700 hover:bg-slate-700"}`}>
                {lbl}
              </button>
            ))}
          </div>

          {viewMode==="grid" && (<>
          {/* กรองวันที่ + Export */}
          <div className="bg-slate-800/50 backdrop-blur-lg border border-emerald-500/30 rounded-2xl p-5 shadow-xl">
            <div className="flex flex-wrap gap-3 items-end justify-between">
              <div className="flex items-center gap-3 flex-wrap">
                <IFilter sz={18} cl="text-emerald-400"/>
                <div>
                  <label className="block text-slate-400 text-xs font-semibold mb-1">จากวันที่</label>
                  <input type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)}
                    className="bg-slate-900/80 border-2 border-slate-700 text-white px-3 py-2 rounded-lg focus:border-emerald-500 focus:outline-none text-sm"/>
                </div>
                <div>
                  <label className="block text-slate-400 text-xs font-semibold mb-1">ถึงวันที่</label>
                  <input type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)}
                    className="bg-slate-900/80 border-2 border-slate-700 text-white px-3 py-2 rounded-lg focus:border-emerald-500 focus:outline-none text-sm"/>
                </div>
                <div className="flex gap-2 mt-4">
                  <button onClick={()=>{const w=getWeekRange();setDateFrom(w.start);setDateTo(w.end);}}
                    className="bg-slate-700 text-slate-300 text-xs font-bold px-3 py-2 rounded-lg hover:bg-slate-600">สัปดาห์นี้</button>
                  <button onClick={()=>{const r=getMonthRange();setDateFrom(r.start);setDateTo(r.end);}}
                    className="bg-slate-700 text-slate-300 text-xs font-bold px-3 py-2 rounded-lg hover:bg-slate-600">เดือนนี้</button>
                </div>
              </div>
              <button onClick={exportExcel}
                className="bg-emerald-500 text-slate-900 font-bold px-5 py-2.5 rounded-lg hover:shadow-lg hover:shadow-emerald-500/50 flex items-center text-sm">
                <IDl sz={16} cl="mr-2"/>Export Excel
              </button>
            </div>
            <div className="mt-3 text-slate-400 text-sm">
              พบ <span className="text-white font-bold">{locAtts.length}</span> รายการ ระหว่าง {thaiD(dateFrom+"T00:00:00")} — {thaiD(dateTo+"T00:00:00")}
            </div>
          </div>

          {/* แจ้งเตือนลงทะเบียนช้า */}
          {(lateCount>0 || lateOnly) && (
            <div className={`rounded-2xl p-4 border-2 ${lateCount>0?"bg-red-500/10 border-red-500/50":"bg-slate-800/50 border-slate-700"}`}>
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  {lateCount>0
                    ? <p className="text-red-400 font-black">⚠️ พบ {lateCount} รายการ ลงทะเบียนห่างจากกลุ่มหลักเกิน {LATE_GAP_MIN} นาที</p>
                    : <p className="text-emerald-400 font-black">✓ ตรวจครบแล้ว ไม่มีรายการค้างตรวจ</p>}
                  <p className="text-slate-400 text-xs mt-1">ดูรูปและเวลา แล้วเลือก "ลบรายการ" หรือ "ปล่อยผ่าน" (เช่น ลืมลงทะเบียนแต่อยู่ร่วมกิจกรรมจริง)</p>
                </div>
                <button onClick={()=>{setLateOnly(v=>!v);setFaceOnly(false);}}
                  className={`text-xs font-bold px-4 py-2 rounded-lg border ${lateOnly?"bg-slate-700 text-white border-slate-600":"bg-red-500 text-white border-red-400"}`}>
                  {lateOnly?"แสดงทั้งหมด":"แสดงเฉพาะรายการที่ต้องตรวจ"}
                </button>
              </div>
            </div>
          )}

          {/* ตรวจเทียบใบหน้าอัตโนมัติ */}
          {faceRun && (
            <div className={`rounded-2xl p-4 border-2 ${faceCounts.alert>0?"bg-fuchsia-500/10 border-fuchsia-500/50":faceCounts.warn>0?"bg-amber-500/10 border-amber-500/40":"bg-slate-800/50 border-slate-700"}`}>
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div className="min-w-0 flex-1">
                  <p className="text-white font-black">👤 ตรวจเทียบใบหน้ากับวันก่อนๆ — {faceRun.label}</p>
                  {faceRun.err
                    ? <p className="text-red-300 text-sm mt-1">⚠️ {faceRun.err}</p>
                  : faceRun.running
                    ? <>
                        <p className="text-slate-300 text-sm mt-1">กำลังตรวจ {faceRun.done}/{faceRun.total} คน… <span className="text-slate-500 text-xs">(ครั้งแรกต้องโหลดตัวตรวจใบหน้าประมาณ 8 MB)</span></p>
                        <div className="w-full bg-slate-700 rounded-full h-1.5 mt-2 overflow-hidden"><div className="h-1.5 bg-fuchsia-400 transition-all" style={{width:(faceRun.total?Math.round(faceRun.done/faceRun.total*100):0)+"%"}}/></div>
                      </>
                  : faceRun.total===0
                    ? <p className="text-slate-400 text-sm mt-1">ยังไม่มีรูปวันก่อนให้เทียบ</p>
                    : <p className="text-sm mt-1">
                        {faceCounts.alert>0 && <span className="text-fuchsia-300 font-bold mr-3">🔴 หน้าอาจไม่ตรง {faceCounts.alert} รายการ</span>}
                        {faceCounts.warn>0 && <span className="text-amber-300 font-bold mr-3">🟡 ไม่แน่ใจ {faceCounts.warn}</span>}

    // ============ SETTINGS VIEW ============
    // ---- MAP COMPONENT ----
    function LocationMap({ lat, lng, name, onMapClick }) {
      const mapRef = useRef(null);
      const mapObjRef = useRef(null);
      const markerRef = useRef(null);
      const circleRef = useRef(null);

      useEffect(()=>{
        if(!mapRef.current) return;
        // init map ครั้งเดียว
        if(!mapObjRef.current) {
          mapObjRef.current = L.map(mapRef.current, { zoomControl:true }).setView([lat,lng], 17);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution:'© OpenStreetMap',
            maxZoom:19
          }).addTo(mapObjRef.current);
          // คลิกแผนที่เพื่อตั้งพิกัด
          mapObjRef.current.on('click', e=>{
            onMapClick(e.latlng.lat, e.latlng.lng);
          });
        }
        return ()=>{};
      },[]);

      // อัพเดทหมุดและวงกลมเมื่อพิกัดเปลี่ยน
      useEffect(()=>{
        if(!mapObjRef.current) return;
        const validLat = parseFloat(lat)||0, validLng = parseFloat(lng)||0;
        if(!validLat || !validLng) return;

        // ลบหมุดและวงกลมเก่า
        if(markerRef.current) mapObjRef.current.removeLayer(markerRef.current);
        if(circleRef.current) mapObjRef.current.removeLayer(circleRef.current);

        // วงกลมแสดงรัศมี 20 เมตร
        circleRef.current = L.circle([validLat,validLng], {
          radius: 20, color:'#10b981', fillColor:'#10b981', fillOpacity:0.15, weight:2
        }).addTo(mapObjRef.current);

        // หมุด custom
        const icon = L.divIcon({
          className:'',
          html:`<div style="width:36px;height:36px;background:#10b981;border:3px solid white;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.4);font-size:16px;">📍</div>`,
          iconSize:[36,36], iconAnchor:[18,36]
        });
        markerRef.current = L.marker([validLat,validLng], {icon, draggable:true})
          .bindPopup(`<b>${esc(name)}</b><br/>${validLat.toFixed(6)}, ${validLng.toFixed(6)}`)
          .addTo(mapObjRef.current)
          .openPopup();

        // ลากหมุดได้
        markerRef.current.on('dragend', e=>{
          const p = e.target.getLatLng();
          onMapClick(p.lat, p.lng);
        });

        // ย้ายแผนที่ไปที่หมุดใหม่
        mapObjRef.current.setView([validLat,validLng], mapObjRef.current.getZoom());
      },[lat,lng,name]);

      return (
        <div>
          <div ref={mapRef} style={{height:"320px",borderRadius:"12px",overflow:"hidden",border:"2px solid rgba(16,185,129,0.3)"}}/>
          <p className="text-slate-500 text-xs mt-2 text-center">
            💡 กดที่แผนที่เพื่อตั้งพิกัด หรือลากหมุดสีเขียวได้เลย • วงกลมสีเขียว = รัศมี 20 เมตร
          </p>
        </div>
      );
    }

    function SettingsView({ curLoc, setCurLoc, locs, setLocs }) {
      const [sel,setSel]   = useState(curLoc);
      const [saved,setSaved] = useState(false);
      const cur = locs[sel]||Object.values(locs)[0];

      const upd = (la,ln) => setLocs(prev=>({...prev,[sel]:{...prev[sel],lat:parseFloat(la)||0,lng:parseFloat(ln)||0}}));
      const gps = () => navigator.geolocation.getCurrentPosition(p=>upd(p.coords.latitude,p.coords.longitude),()=>alert("ไม่สามารถรับตำแหน่งได้"));
      const save = async () => {
        // ตรวจค่าก่อนบันทึก — ค่าผิด (พิกัด 0 / เวลาเริ่มหลังเวลาจบ) จะทำให้ทุกคนลงทะเบียนไม่ได้
        const bad = Object.values(locs).filter(l=>{
          const la=parseFloat(l.lat), ln=parseFloat(l.lng);
          return !la || !ln || Math.abs(la)>90 || Math.abs(ln)>180 || (l.timeStart||"08:00") >= (l.timeEnd||"09:30");
        });
        if(bad.length){ alert("กรุณาตรวจพิกัด/ช่วงเวลาของ: "+bad.map(l=>l.name).join(", ")+"\n(พิกัดต้องไม่เป็น 0 และเวลาเริ่มต้องก่อนเวลาสิ้นสุด)"); return; }
        setSaving(true);
        try {
          // บันทึกเฉพาะค่าที่แก้ไขได้ (ไม่เก็บ fullName เดิมซ้ำ เพราะอยู่ใน LOCATIONS แล้ว)

              timeEnd:     locs[id].timeEnd     || "09:30",

          });
          await db.collection("settings").doc("locations").set(toSave);
          setSaved(true);
          setTimeout(()=>setSaved(false), 3000);

          alert("บันทึกไม่สำเร็จ: " + e.message);

          setSaving(false);
        }
      };
      const apply = () => { setCurLoc(sel); alert(`เปลี่ยนสถานที่เป็น ${locs[sel].name} แล้ว`); };
      const copyUrl = url => navigator.clipboard.writeText(url).then(()=>alert("คัดลอกแล้ว!"));

      const base = `${window.location.origin}${window.location.pathname}`;

      return (
        <div className="max-w-4xl mx-auto space-y-5">

            <h2 className="text-xl font-black text-white mb-5 flex items-center"><ICog sz={22} cl="text-emerald-400 mr-2"/>ตั้งค่าพิกัดหน่วยงาน</h2>

            {/* เลือกหน่วยงาน */}
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2 mb-4">
              {Object.values(locs).map(l=>(
                <button key={l.id} onClick={()=>setSel(l.id)}
                  className={`px-3 py-2 rounded-xl font-bold text-xs transition-all ${sel===l.id?"bg-emerald-500 text-slate-900 shadow-lg shadow-emerald-500/50":"bg-slate-700 text-slate-300 hover:bg-slate-600"}`}>
                  {l.name}
                </button>
              ))}
            </div>
            <div className="p-3 bg-slate-900/50 rounded-lg mb-4">
              <p className="text-emerald-400 font-bold">{cur.name}</p>
              <p className="text-slate-400 text-sm">{cur.fullName}</p>
            </div>

            {/* แผนที่ */}
            <div className="mb-4">
              <LocationMap key={sel} lat={cur.lat} lng={cur.lng} name={cur.name} onMapClick={(la,ln)=>upd(la,ln)}/>
            </div>

            {/* input พิกัด */}
            <div className="grid grid-cols-2 gap-4 mb-3">
              <div>
                <label className="block text-slate-400 text-sm font-semibold mb-1">Latitude</label>
                <input type="number" step="0.000001" value={cur.lat} onChange={e=>upd(e.target.value,cur.lng)}
                  className="w-full bg-slate-800 border border-slate-700 text-white px-3 py-2 rounded-lg focus:border-emerald-500 focus:outline-none font-mono text-sm"/>
              </div>
              <div>
                <label className="block text-slate-400 text-sm font-semibold mb-1">Longitude</label>
                <input type="number" step="0.000001" value={cur.lng} onChange={e=>upd(cur.lat,e.target.value)}
                  className="w-full bg-slate-800 border border-slate-700 text-white px-3 py-2 rounded-lg focus:border-emerald-500 focus:outline-none font-mono text-sm"/>
              </div>
            </div>

            {/* ตั้งค่ารัศมี */}
            <div className="bg-slate-800/60 border border-slate-600 rounded-xl p-4 mb-3">
              <label className="block text-white font-bold text-sm mb-3">🎯 รัศมีที่อนุญาต (เมตร) — {cur.name}</label>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-400 text-xs font-semibold mb-1">รัศมีจริง (ระบบใช้)</label>
                  <input type="number" min="10" max="500" step="5"
                    value={cur.maxDist||50}
                    onChange={e=>setLocs(prev=>({...prev,[sel]:{...prev[sel],maxDist:parseInt(e.target.value)||50}}))}
                    className="w-full bg-slate-900 border border-slate-700 text-white px-3 py-2 rounded-lg focus:border-emerald-500 focus:outline-none font-mono text-sm"/>
                  <p className="text-slate-500 text-xs mt-1">ระยะจริงที่ระบบยอมรับ</p>
                </div>
                <div>
                  <label className="block text-slate-400 text-xs font-semibold mb-1">รัศมีที่แสดงผู้ใช้</label>
                  <input type="number" min="5" max="500" step="5"
                    value={cur.displayDist||20}
                    onChange={e=>setLocs(prev=>({...prev,[sel]:{...prev[sel],displayDist:parseInt(e.target.value)||20}}))}
                    className="w-full bg-slate-900 border border-slate-700 text-white px-3 py-2 rounded-lg focus:border-emerald-500 focus:outline-none font-mono text-sm"/>
                  <p className="text-slate-500 text-xs mt-1">ตัวเลขที่พนักงานจะเห็น</p>
                </div>
              </div>
              <div className="mt-2 text-xs text-slate-400 bg-slate-900/50 rounded-lg p-2">
                ระบบจะยอมรับระยะ <span className="text-emerald-400 font-bold">{cur.maxDist||50} ม.</span> แต่แสดงว่าต้องอยู่ใน <span className="text-amber-400 font-bold">{cur.displayDist||20} ม.</span>
              </div>
            </div>

            <button onClick={gps} className="w-full bg-slate-700 text-white font-bold py-2 rounded-lg hover:bg-slate-600 text-sm mb-4">
              <IMapPin sz={13} cl="inline mr-1"/>ใช้ตำแหน่ง GPS ปัจจุบัน (แนะนำ: ยืนที่จุดลงทะเบียนแล้วกด)
            </button>

            {/* ตั้งค่าเวลาลงทะเบียน */}
            <div className="bg-slate-800/60 border border-slate-600 rounded-xl p-4 mb-3">
              <label className="block text-white font-bold text-sm mb-3">⏰ ช่วงเวลาที่ลงทะเบียนได้ — {cur.name}</label>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-400 text-xs font-semibold mb-1">เวลาเริ่มต้น</label>
                  <input type="time"
                    value={cur.timeStart||"08:00"}
                    onChange={e=>setLocs(prev=>({...prev,[sel]:{...prev[sel],timeStart:e.target.value}}))}
                    className="w-full bg-slate-900 border border-slate-700 text-white px-3 py-2 rounded-lg focus:border-emerald-500 focus:outline-none font-mono text-sm"/>
                </div>
                <div>
                  <label className="block text-slate-400 text-xs font-semibold mb-1">เวลาสิ้นสุด</label>
                  <input type="time"
                    value={cur.timeEnd||"09:30"}
                    onChange={e=>setLocs(prev=>({...prev,[sel]:{...prev[sel],timeEnd:e.target.value}}))}
                    className="w-full bg-slate-900 border border-slate-700 text-white px-3 py-2 rounded-lg focus:border-emerald-500 focus:outline-none font-mono text-sm"/>
                </div>
              </div>
              <div className="mt-2 text-xs text-slate-400 bg-slate-900/50 rounded-lg p-2">
                พนักงานลงทะเบียนได้ <span className="text-emerald-400 font-bold">{cur.timeStart||"08:00"} — {cur.timeEnd||"09:30"} น.</span>
              </div>
            </div>
            <button onClick={save} disabled={saving} className="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-900 font-black py-3 rounded-lg hover:shadow-lg hover:shadow-emerald-500/50 disabled:opacity-70 flex items-center justify-center">
              {saving?<><ISpin sz={16} cl="mr-2"/>กำลังบันทึกไป Firestore...</>:saved?<><ICheck sz={16} cl="inline mr-2"/>บันทึกสำเร็จ! ☁️</>:"บันทึกการตั้งค่า (บันทึกออนไลน์)"}
            </button>
          </div>

          {/* QR Code URLs */}
          <div className="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-6 shadow-xl">
            <h3 className="text-white font-bold mb-1 flex items-center"><IQr sz={18} cl="text-amber-400 mr-2"/>URL สำหรับสร้าง QR Code (แต่ละหน่วยงาน)</h3>
            <p className="text-slate-400 text-xs mb-4">นำ URL ไปสร้าง QR Code ที่ qrcode.me หรือ qr-code-generator.com</p>
            <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
              {Object.values(locs).map(l=>(
                <div key={l.id} className="bg-slate-900/60 rounded-lg p-3 flex items-center justify-between gap-2">
                  <div className="min-w-0">
                    <p className="text-emerald-400 font-bold text-xs">{l.name}</p>
                    <p className="text-slate-400 font-mono text-xs truncate">{base}?location={l.id}</p>
                  </div>
                  <button onClick={()=>copyUrl(`${base}?location=${l.id}`)}
                    className="flex-shrink-0 bg-slate-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-slate-600">
                    คัดลอก
                  </button>
                </div>
              ))}
            </div>
            <div className="mt-4 p-3 bg-slate-800/50 rounded-lg">
              <p className="text-amber-400 font-bold text-xs mb-1">🔐 URL สำหรับ Admin</p>
              <p className="text-slate-400 font-mono text-xs truncate">{base}?admin=1</p>
              <button onClick={()=>copyUrl(`${base}?admin=1`)}
                className="mt-2 bg-slate-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-slate-600">
                คัดลอก URL Admin
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
