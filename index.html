    .leaflet-container { background:#1e293b; }

    @keyframes pulse-ring { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.15);opacity:0.7} }

    /* Dashboard table responsive */
    :root {
      --dash-name-w: 130px;
      --dash-pos-left: 130px;   /* = name */
      --dash-dept-left: 215px;  /* = name+pos = 130+85 */
    }
    .dash-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .dash-table { border-collapse:collapse; table-layout:fixed; width:100%; min-width:700px; }
    /* === DESKTOP (default) === */
    .dash-col-name { width:var(--dash-name-w); min-width:var(--dash-name-w); max-width:var(--dash-name-w); }
    .dash-col-pos  { width:85px;  min-width:85px;  max-width:85px; }

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback, useMemo } = React;

    // ============ CONFIG ============
    const IMGBB_API_KEY  = "906f6ec77af88f56409be021dac1625a";
    const IMGBB_EXPIRE   = 7776000; // 90 วัน
    const DEFAULT_MAX_DIST = 50;    // เมตรจริง default
    const getMaxDist = loc => loc.maxDist || DEFAULT_MAX_DIST;
    const TIME_START     = "08:00";
    const TIME_END       = "09:30";
    // Admin PIN — เปลี่ยนได้ตามต้องการ
    // PIN ไม่ฝังในโค้ดแล้ว — เก็บ hash ใน Firestore settings/auth
    // ฟังก์ชัน hash PIN ด้วย SHA-256

    const LOCATIONS = {
      lampun:        { id:"lampun",        name:"กฟจ.ลำพูน",         fullName:"การไฟฟ้าส่วนภูมิภาคจังหวัดลำพูน",         lat:18.5745, lng:99.0087 },
      pasang:        { id:"pasang",        name:"กฟส.ป่าซาง",        fullName:"การไฟฟ้าส่วนภูมิภาคสาขาป่าซาง",           lat:18.5235, lng:98.9394 },
      banhong:       { id:"banhong",       name:"กฟส.บ้านโฮ่ง",      fullName:"การไฟฟ้าส่วนภูมิภาคสาขาบ้านโฮ่ง",         lat:18.7367, lng:98.9436 },
      li:            { id:"li",            name:"กฟส.ลี้",            fullName:"การไฟฟ้าส่วนภูมิภาคสาขาลี้",              lat:18.2773, lng:99.0534 },
      banthi:        { id:"banthi",        name:"กฟส.บ้านธิ",        fullName:"การไฟฟ้าส่วนภูมิภาคสาขาบ้านธิ",           lat:18.4156, lng:99.1367 },
      maeta:         { id:"maeta",         name:"กฟส.แม่ทา",         fullName:"การไฟฟ้าส่วนภูมิภาคสาขาแม่ทา",            lat:18.1856, lng:99.2678 },
      nakornchadee:  { id:"nakornchadee",  name:"กฟส.นครเจดีย์",     fullName:"การไฟฟ้าส่วนภูมิภาคสาขานครเจดีย์",        lat:18.3456, lng:99.5134 },
      wiangnonglong: { id:"wiangnonglong", name:"กฟส.เวียงหนองล่อง", fullName:"การไฟฟ้าส่วนภูมิภาคสาขาเวียงหนองล่อง",    lat:18.6523, lng:99.2134 },
      thunghuachang: { id:"thunghuachang", name:"กฟส.ทุ่งหัวช้าง",   fullName:"การไฟฟ้าส่วนภูมิภาคสาขาทุ่งหัวช้าง",      lat:18.4012, lng:99.3245 },
      maetuen:       { id:"maetuen",       name:"กฟส.แม่ตืน",        fullName:"การไฟฟ้าส่วนภูมิภาคสาขาแม่ตืน",           lat:18.1234, lng:99.4567 },
    };

    // ============ HELPERS ============
    const calcDist = (la1,lo1,la2,lo2) => {
      const R=6371e3,p1=la1*Math.PI/180,p2=la2*Math.PI/180,
            dp=(la2-la1)*Math.PI/180,dl=(lo2-lo1)*Math.PI/180,
            a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
      return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    };
    // ---- วันที่/เวลาไทย (UTC+7) — ใช้ทั้งระบบให้ตรงกันทุกเครื่อง ----
    const BKK_OFFSET_MS = 7*60*60*1000;
    const bkkDate = t => { if(t==null||t==="") return ""; const ms = new Date(t).getTime(); return isNaN(ms) ? "" : new Date(ms+BKK_OFFSET_MS).toISOString().slice(0,10); };
    const bkkHM   = () => new Date(Date.now()+BKK_OFFSET_MS).toISOString().slice(11,16);
    const todayStr = () => bkkDate(Date.now());
    const isFuture = date => date > todayStr();
    const withinTime = (s,e) => { const t=bkkHM(); return t>=s && t<=e; };
    // escape ข้อความก่อนใส่ใน HTML ที่สร้างเอง (PDF / popup แผนที่)
    const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    // ลิงก์รูปต้องเป็น http(s) เท่านั้น (กันลิงก์ javascript: ที่ฝังมากับข้อมูลลงทะเบียน)
    const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : "";
    // ---- ทำความสะอาดรหัสพนักงาน ----
    // ตัวอักษรล่องหน (zero-width / ทิศทางข้อความ ฯลฯ ที่ติดมากับคีย์บอร์ดหรือการวาง) มองไม่เห็นแต่ทำให้รหัส "ไม่เท่ากัน"
    const INVISIBLE_RE = /[­᠎​-‏‪-‮⁠-⁤﻿]/g;
    const thaiDigits = s => s.replace(/[๐-๙]/g, d=>String("๐๑๒๓๔๕๖๗๘๙".indexOf(d)));
    // ใช้ตอนบันทึก: ลบตัวล่องหน แปลงเลขไทย/เลขเต็มความกว้างเป็นเลขอารบิก (ตัวที่มองเห็นคงไว้ตามที่พิมพ์)
    const cleanEmpId = v => { if(v==null) return ""; let s=String(v); try{ s=s.normalize("NFKC"); }catch(e){} return thaiDigits(s.replace(INVISIBLE_RE,"")).trim(); };
    // ใช้ตอนจับกลุ่ม/เทียบ: เหลือเฉพาะตัวเลขและตัวอักษรอังกฤษ (เช่น "505 649", "081-234-5678" ถือเป็นรหัสเดียวกับแบบไม่มีเว้นวรรค/ขีด)
    const normEmpId = v => cleanEmpId(v).toUpperCase().replace(/[^0-9A-Z]/g,"");
    const normName  = v => { let s=String(v||""); try{ s=s.normalize("NFKC"); }catch(e){} return s.replace(INVISIBLE_RE,"").replace(/\s+/g,"").replace(/^(นางสาว|น\.ส\.|นาง|นาย)/,""); };
    // จับกลุ่มการลงทะเบียนเป็น "คนเดียวกัน": รหัสตรงกัน (หลังล้าง) หรือ ชื่อตรงกัน → [[att,...] เรียงใหม่→เก่า, ...]
    const groupPeople = list => {
      const parent = list.map((_,i)=>i);
      const find = i => { while(parent[i]!==i){ parent[i]=parent[parent[i]]; i=parent[i]; } return i; };
      const join = (i,j) => { i=find(i); j=find(j); if(i!==j) parent[j]=i; };
      const byId={}, byName={};
      list.forEach((a,i)=>{
        const id=normEmpId(a.empId), nm=normName(a.fullName);
        if(id.length>=4){ if(byId[id]!=null) join(byId[id],i); else byId[id]=i; }
        if(nm){ if(byName[nm]!=null) join(byName[nm],i); else byName[nm]=i; }
      });
      const groups = {};
      list.forEach((a,i)=>{ const r=find(i); (groups[r]=groups[r]||[]).push(a); });
      return Object.values(groups).map(g=>g.sort((x,y)=>new Date(y.timestamp)-new Date(x.timestamp)));
    };

    // ============ ตรวจเทียบใบหน้าอัตโนมัติ (เฉพาะหน้าแอดมิน) ============
    // ใช้ face-api (โอเพนซอร์ส) ประมวลผลในเบราว์เซอร์ของแอดมินเท่านั้น — ไม่ส่งรูปไปที่อื่น และไม่เก็บข้อมูลใบหน้าลงฐานข้อมูล
    // เป็นการ "คัดกรองเบื้องต้น" ให้แอดมินดูรูปซ้ำ ไม่ใช่หลักฐานตัดสิน
    const FACE_LIB_URL    = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js";
    const FACE_LIB_SRI    = "sha384-M5nePoB6/w/a9JhtegEibSLGiJy/+QMZZMfvcxjWVCQW/HPwrQ7i21V/Px/8AyVA";
    const FACE_MODEL_URL  = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/";
    // ระดับความเข้มงวด (ค่าความต่างของใบหน้า: ยิ่งมาก = ยิ่งไม่เหมือน) — ปรับได้ในหน้ารายงาน
    const FACE_LEVELS = {
      loose:  { label:"ผ่อนปรน", warn:0.55, alert:0.65 },
      normal: { label:"ปกติ",    warn:0.50, alert:0.58 },
      strict: { label:"เข้มงวด", warn:0.45, alert:0.52 },
    };
    const FACE_REFS  = 4;      // เทียบกับรูปวันก่อนหน้าสูงสุด 4 วัน
    // ตัวไลบรารี (โหลดครั้งเดียว) + โมเดลแยกตามที่ต้องใช้
    let faceLibPromise = null;
    const loadFaceLib = () => faceLibPromise || (faceLibPromise = (async()=>{
      if(!window.faceapi){
        await new Promise((res,rej)=>{
          const s=document.createElement("script");
          s.src=FACE_LIB_URL; s.integrity=FACE_LIB_SRI; s.crossOrigin="anonymous"; s.async=true;
          s.onload=res; s.onerror=()=>rej(new Error("โหลดตัวตรวจใบหน้าไม่ได้ (ตรวจอินเทอร์เน็ต)"));
          document.head.appendChild(s);
        });
      }
      const fa=window.faceapi;
      try { await fa.tf.setBackend("webgl"); } catch(e){}
      if(fa.tf.getBackend()!=="webgl"){ try { await fa.tf.setBackend("cpu"); } catch(e){} }
      await fa.tf.ready();
      return fa;
    })().catch(e=>{ faceLibPromise=null; throw e; }));
    const faceNetPromises = {};
    const loadFaceNet = name => faceNetPromises[name] || (faceNetPromises[name] = loadFaceLib()
      .then(fa=>fa.nets[name].loadFromUri(FACE_MODEL_URL).then(()=>fa))
      .catch(e=>{ delete faceNetPromises[name]; throw e; }));
    // หน้าแอดมิน: ตรวจจับ + จุดบนใบหน้า + ลายใบหน้า (~8 MB)
    const loadFaceApi = () => Promise.all(["tinyFaceDetector","faceLandmark68Net","faceRecognitionNet"].map(loadFaceNet)).then(a=>a[0]);
    // มือถือคนลงทะเบียน: เฉพาะ "หาใบหน้าในรูป" (~1.5 MB ครั้งแรก, ครั้งต่อไปใช้จากแคช) — ไม่ได้จำ/เทียบใบหน้า
    const loadFaceDetector = () => loadFaceNet("tinyFaceDetector");
    // อุ่นเครื่องตัวตรวจไว้ระหว่างเปิดกล้อง (ครั้งแรกของการตรวจจะช้าเพราะต้องเตรียมการประมวลผล) → ตอนถ่ายเสร็จตรวจได้เร็ว
    let faceWarmPromise = null;
    const warmFaceDetector = () => faceWarmPromise || (faceWarmPromise = loadFaceDetector().then(async fa=>{
      const c=document.createElement("canvas"); c.width=64; c.height=64;
      for(const size of [416,608]) await fa.detectSingleFace(c,new fa.TinyFaceDetectorOptions({inputSize:size,scoreThreshold:0.9}));
      return fa;
    }).catch(e=>{ faceWarmPromise=null; throw e; }));
    // ตรวจว่ารูป (dataURL จากกล้อง) เห็นใบหน้าหรือไม่ → "ok" | "noface" | "skip" (ตรวจไม่ได้/ช้าเกิน → ไม่ขวางการลงทะเบียน)
    const detectFaceInPhoto = (dataUrl, timeoutMs=10000) => Promise.race([
      (async()=>{
        const fa = await loadFaceDetector();
        const img = await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error("img")); im.src=dataUrl; });
        let d = await fa.detectSingleFace(img,new fa.TinyFaceDetectorOptions({inputSize:416,scoreThreshold:0.4}));
        if(!d) d = await fa.detectSingleFace(img,new fa.TinyFaceDetectorOptions({inputSize:608,scoreThreshold:0.2}));
        return d ? "ok" : "noface";
      })().catch(()=>"skip"),
      new Promise(r=>setTimeout(()=>r("skip"),timeoutMs)),
    ]);
    // โหลดรูปแบบอ่านพิกเซลได้ (ต้องให้ที่เก็บรูปอนุญาต CORS) — ถ้าไม่ได้ แยกว่า "หมดอายุ" หรือ "ถูกบล็อก"
    const loadFaceImg = url => new Promise((res,rej)=>{
      const im=new Image(); im.crossOrigin="anonymous";
      im.onload=()=>res(im);
      im.onerror=()=>{ const t=new Image(); t.onload=()=>{ FACE_CORS_BLOCKED=true; rej(new Error("cors")); }; t.onerror=()=>rej(new Error("load")); t.src=url; };
      im.src=url;
    });
    let FACE_CORS_BLOCKED = false;   // ที่เก็บรูปไม่อนุญาตให้อ่านพิกเซล → ไม่ต้องโหลดรูปล่วงหน้า
    const FACE_DESC = new Map();     // att.id → Promise<{desc}|{err}>  (อยู่ในหน่วยความจำ หายเมื่อปิด/รีเฟรชหน้า)
    const faceDesc = att => {
      if(FACE_DESC.has(att.id)) return FACE_DESC.get(att.id);
      const p = (async()=>{
        const url = safeUrl(att.photoURL); if(!url) return {err:"load"};
        const fa = await loadFaceApi();
        let img; try { img = await loadFaceImg(url); } catch(e){ return {err:e.message==="cors"?"cors":"load"}; }
        let d = await fa.detectSingleFace(img,new fa.TinyFaceDetectorOptions({inputSize:416,scoreThreshold:0.4})).withFaceLandmarks().withFaceDescriptor();
        if(!d) d = await fa.detectSingleFace(img,new fa.TinyFaceDetectorOptions({inputSize:608,scoreThreshold:0.25})).withFaceLandmarks().withFaceDescriptor();
        return d ? {desc:d.descriptor} : {err:"noface"};
      })().catch(e=>{ FACE_DESC.delete(att.id); return {err:"lib", msg:e.message}; });   // โหลดไลบรารีไม่ได้ → ไม่จำผล ให้ลองใหม่ได้
      FACE_DESC.set(att.id,p); return p;
    };
    const faceDist = (a,b) => { let s=0; for(let i=0;i<a.length;i++){ const v=a[i]-b[i]; s+=v*v; } return Math.sqrt(s); };
    const FACE_RESULT = new Map();   // att.id → ผลตรวจ (หน่วยความจำเท่านั้น)
    // เทียบรูปของ att กับรูปวันก่อนหน้า (refs) → {status: ok|warn|alert|noface|noref|error, dist, refs:[{id,d}], err}
    const faceCompare = async (att, refs) => {
      if(!refs.length) return {status:"noref", refs:[]};
      const t = await faceDesc(att);
      if(!t.desc) return {status: t.err==="noface"?"noface":"error", err:t.err, msg:t.msg, refs:[]};
      const ds=[];
      for(const r of refs){ const x=await faceDesc(r); if(x.desc) ds.push({id:r.id, d:faceDist(t.desc,x.desc)}); }
      if(!ds.length) return {status:"error", err:"ref", refs:[]};
      // ใช้ค่ากลาง (median) ของทุกรูปวันก่อน — ทนต่อรูปเก่าที่ไม่ชัด 1 รูป และไม่ปล่อยผ่านง่ายเกินไปเมื่อหน้าคล้ายรูปใดรูปหนึ่ง
      const v=ds.map(x=>x.d).sort((a,b)=>a-b), mid=v.length>>1;
      const dist = v.length%2 ? v[mid] : (v[mid-1]+v[mid])/2;
      return {status:"scored", dist, refs:ds};
    };
    // index การลงทะเบียน: "locId|YYYY-MM-DD" → {ids, names, list} — ค้นหาเร็ว ไม่ต้องวนทุกรายการทุกช่อง
    const buildAttIndex = list => {
      const idx = new Map();
      (list||[]).forEach(a=>{
        if(!a || !a.timestamp) return;
        const k = a.locationId+"|"+bkkDate(a.timestamp);
        let e = idx.get(k); if(!e){ e={ids:new Set(),names:new Set(),list:[]}; idx.set(k,e); }
        if(a.empId) e.ids.add(a.empId.toString().trim());
        if(a.fullName) e.names.add(a.fullName.trim());
        e.list.push(a);
      });
      return idx;
    };
    const attHit = (idx, locId, date, m) => {
      const e = idx.get(locId+"|"+date); if(!e) return false;

    const thaiD   = d => new Date(d).toLocaleDateString("th-TH",{year:"numeric",month:"short",day:"numeric"});
    const compress = (b64,maxW=800,q=0.75) => new Promise((res,rej)=>{
      const img=new Image();
      img.onload=()=>{ const c=document.createElement("canvas"); let w=img.width,h=img.height; if(w>maxW){h=Math.round(h*maxW/w);w=maxW;} c.width=w;c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); res(c.toDataURL("image/jpeg",q)); };
      img.onerror=()=>rej(new Error("img")); img.src=b64;
    });
    // --- Photo upload: ImgBB (primary, 15 s) → Cloudinary (fallback, 25 s) ---
    const CLOUDINARY_CLOUD  = "gj8tuny1";
    const CLOUDINARY_PRESET = "pea_upload";
    const CLOUDINARY_FOLDER = "safety-talk";

    const uploadImgBB = async b64 => {
      const data=b64.includes(",")?b64.split(",")[1]:b64;
      const f=new FormData(); f.append("key",IMGBB_API_KEY); f.append("image",data); f.append("expiration",IMGBB_EXPIRE);
      const ac=new AbortController(); const tid=setTimeout(()=>ac.abort(),15000);
      try {
        const r=await fetch("https://api.imgbb.com/1/upload",{method:"POST",body:f,signal:ac.signal});
        const j=await r.json();
        if(!j.success) throw new Error("ImgBB: "+JSON.stringify(j));
        return { url:j.data.url, thumb:j.data.thumb?.url||j.data.url, del:j.data.delete_url };
      } finally { clearTimeout(tid); }
    };

    const uploadCloudinary = async (b64, withFolder=true) => {
      const f=new FormData();
      f.append("file", b64);
      f.append("upload_preset", CLOUDINARY_PRESET);
      if(withFolder) f.append("asset_folder", CLOUDINARY_FOLDER);
      const ac=new AbortController(); const tid=setTimeout(()=>ac.abort(),25000);
      try {
        const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,{method:"POST",body:f,signal:ac.signal});
        const j=await r.json();
        if(j.error) throw new Error("Cloudinary: "+j.error.message);
        const url=j.secure_url;
        const thumb=url.replace("/upload/","/upload/c_limit,w_400/");
        return { url, thumb, del:null };
      } finally { clearTimeout(tid); }
    };

      // ลอง ImgBB ก่อน (timeout 15 วิ)
      try { return await uploadImgBB(b64); }

        // สลับไป Cloudinary
        onFallback && onFallback();
        const isNetwork = imgbbErr.name==="AbortError" || imgbbErr.message==="Failed to fetch";
        let cloudErr;
        // attempt 1: พร้อม asset_folder
        try { return await uploadCloudinary(b64, true); }
        catch(e1) {
          cloudErr = e1;
          // ถ้า 400 + folder → ลองใหม่โดยไม่ส่ง folder
          const isFolder = /folder/i.test(e1.message);
          if(isFolder) {
            try { return await uploadCloudinary(b64, false); }
            catch(e2) { cloudErr = e2; }
          } else if(isNetwork) {
            // retry 1 ครั้งกรณีเน็ตหลุด
            try { return await uploadCloudinary(b64, true); }
            catch(e2) { cloudErr = e2; }
          }

        throw new Error(`อัปโหลดรูปล้มเหลวทั้งสองช่องทาง\n• ImgBB: ${imgbbErr.message}\n• ที่เก็บสำรอง: ${cloudErr?.message||"?"}`);

    const getWeekRange = () => {
      const t=new Date(todayStr()+"T00:00:00Z"), day=t.getUTCDay(), diff=day===0?-6:1-day;
      const mon=new Date(t.getTime()+diff*864e5), sun=new Date(mon.getTime()+6*864e5);

    (function autoRedirect() {
      const ua = navigator.userAgent || "";
      const url = window.location.href;
      const isLine = /Line\//i.test(ua);
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPad|iPhone|iPod/.test(ua);
      const alreadyRedirected = url.includes("openExternalBrowser=1");

      if (!isLine || alreadyRedirected) return;

      // LINE รองรับ parameter นี้ทั้ง iOS และ Android
      // เมื่อเจอ openExternalBrowser=1 จะเปิด Safari/Chrome อัตโนมัติ
      const sep = url.includes("?") ? "&" : "?";
      window.location.replace(url + sep + "openExternalBrowser=1");
    })();

    function detectBrowser() {
      const ua = navigator.userAgent || "";
      // ถ้ามี openExternalBrowser=1 แสดงว่า redirect แล้ว = normal browser
      if (window.location.href.includes("openExternalBrowser=1")) return "normal";
      if (/Line\//i.test(ua))                                    return "line";
      if (/FBAN|FBAV/i.test(ua))                                 return "facebook";
      if (/Instagram/i.test(ua))                                 return "instagram";
      if (/wv\)|; wv\)/i.test(ua) && /Android/i.test(ua))       return "webview";
      return "normal";
    }

    // ============ ADMIN LOGIN ============
    function AdminLogin({ onAuth }) {
      const { useState } = React;
      const [err,setErr]=useState("");
      const [checking,setChecking]=useState(false);

      const [failCount, setFailCount] = useState(0);
      const [lockUntil, setLockUntil] = useState(null);
      const MAX_FAIL = 5;
      const LOCK_SEC = 5 * 60;

      const signInWithGoogle = async () => {
        // ตรวจ lockout
        if(lockUntil && Date.now() < lockUntil){
          const left = Math.ceil((lockUntil - Date.now()) / 1000);
          setErr(`ถูกล็อค กรุณารอ ${left} วินาที`); return;
        }
        setChecking(true); setErr("");
        try {
          const result = await auth.signInWithPopup(googleProvider);
          const user   = result.user;
          const email  = user.email || "";
          // ตรวจ whitelist จาก Firestore admins/allowed
          const doc = await db.collection("admins").doc("allowed").get();
          const allowed = doc.exists ? (doc.data()?.emails || []) : [];
          if(allowed.includes(email)){
            onAuth(user);
          } else {
            await auth.signOut();
            const next = failCount + 1;
            setFailCount(next);
            if(next >= MAX_FAIL){
              setLockUntil(Date.now() + LOCK_SEC * 1000);
              setErr(`พยายามเข้าระบบมากเกินไป — ถูกล็อค 5 นาที`);
            } else {
              setErr(`"${email}" ไม่มีสิทธิ์เข้าถึงระบบแอดมิน (${next}/${MAX_FAIL})`);
            }
          }
        } catch(e){
          if(e.code==="auth/popup-closed-by-user") setErr("ยกเลิกการล็อกอิน");
          else setErr("เกิดข้อผิดพลาด: "+e.message);
        }
        finally { setChecking(false); }
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center p-4">
          <div className="bg-slate-800/50 backdrop-blur-lg border border-emerald-500/30 rounded-2xl p-8 shadow-2xl w-full max-w-sm text-center">
            <div className="inline-block bg-emerald-500/20 p-4 rounded-full mb-4"><ILock sz={40} cl="text-emerald-400"/></div>
            <h2 className="text-2xl font-black text-white mb-2">Admin Login</h2>
            <p className="text-slate-400 text-sm mb-6">เข้าสู่ระบบด้วย Google Account ที่มีสิทธิ์แอดมิน</p>
            {err&&<div className="bg-red-500/10 border border-red-500/30 rounded-xl p-3 mb-4"><p className="text-red-400 text-sm">{err}</p></div>}
            <button onClick={signInWithGoogle} disabled={checking}
              className="w-full flex items-center justify-center gap-3 bg-white text-slate-800 font-black py-3.5 px-6 rounded-xl hover:bg-slate-100 disabled:opacity-60 transition-all shadow-lg">
              {checking
                ? <ISpin sz={22} cl="text-slate-600"/>
                : <svg width="22" height="22" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.5 30.2 0 24 0 14.7 0 6.7 5.4 2.7 13.3l7.8 6.1C12.4 13.2 17.7 9.5 24 9.5z"/><path fill="#4A90D9" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.6-4.8 7.3l7.5 5.8c4.4-4 6.9-9.9 6.9-17.1z"/><path fill="#34A853" d="M10.5 28.6A14.8 14.8 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.8-6.1A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.5 10.7l8-6.1z"/><path fill="#FBBC05" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.2-13.5-9.9l-8 6.1C6.7 42.6 14.7 48 24 48z"/></svg>
              }
              {checking ? "กำลังเข้าสู่ระบบ..." : "เข้าสู่ระบบด้วย Google"}
            </button>
            <p className="text-slate-600 text-xs mt-4">เฉพาะ Google Account ที่ได้รับสิทธิ์เท่านั้น</p>
          </div>
        </div>
      );
    }

    // ============ POSITION SORT (อ้างอิงระบบ PEA Lamphun เดิม) ============

    // กลุ่มหลัก: พนักงาน=0, ลูกจ้าง=1, คนงาน=2, พขร.(บ)=3
    function getGroup(pos) {
      if (!pos) return 0;
      const p = pos.trim();
      if (p.includes("พขร."))                          return 3;
      if (p.startsWith("คนงาน"))                       return 2;
      if (p.startsWith("ผู้ปฏิบัติงาน"))               return 2; // คนงาน กฟส.
      if (p.includes("ชชง") || p.includes("ชบช.") ||
          p.includes("ชบค.") || p.includes("ชพด."))   return 1;
      return 0; // พนักงาน
    }

    // ลำดับย่อยภายในกลุ่มคนงาน
    const WORKER_RANK_TABLE = [
      {match:"ก่อสร้าง 1",     rank:0},
      {match:"ก่อสร้าง 2",     rank:1},
      {match:"ก่อสร้าง",       rank:2},
      {match:"ตัดกิ่งไม้",     rank:3},
      {match:"ปรับปรุงระบบฯ",  rank:4},
      {match:"ซ่อมย่อย (C5)",  rank:6},
      {match:"ซ่อมย่อย",       rank:5},
      {match:"เวรแก้ฯ",        rank:7},
      {match:"หม้อแปลง",       rank:8},
      {match:"มิเตอร์ฯ",       rank:9},
      {match:"มิเตอร์",        rank:10},
      {match:"คลังพัสดุ",      rank:11},
      // ผู้ปฏิบัติงานระบบไฟฟ้า กฟภ. (คนงาน กฟส.)
      {match:"ก่อสร้าง",       rank:2},
      {match:"เวรแก้",         rank:7},
      {match:"ซ่อมย่อย",       rank:5},
      {match:"หม้อแปลง",       rank:8},
      {match:"มิเตอร์",        rank:10},
    ];

    function extractNum(str) {
      const m = str.match(/(\d+)/);
      return m ? parseInt(m[1]) : 0;
    }

    // ลำดับตำแหน่งภายในกลุ่ม (rank ต่ำ = อยู่ก่อน, num ใช้เรียงระดับ)
    function getPosRank(pos) {
      if (!pos) return {rank:99, num:0};
      const p = pos.trim();
      // ---- บริหาร ----
      if (p.includes("ผจก."))       return {rank:0,  num: extractNum(p)};
      if (p.includes("รจก."))       return {rank:1,  num: extractNum(p)};
      if (p.includes("หผ.(ฉ)"))     return {rank:2,  num: 0};
      // ---- ตำแหน่งเฉพาะ กฟจ. ----
      if (p.includes("นกต."))       return {rank:3,  num: extractNum(p)};
      if (p.includes("นทน."))       return {rank:4,  num: extractNum(p)};
      if (p.includes("ผชน."))       return {rank:5,  num: extractNum(p)};
      if (p.includes("จป.ว."))      return {rank:6,  num: extractNum(p)};
      // ---- หัวหน้า/ช่างแผนก ----
      if (p.includes("หผ."))        return {rank:7,  num: 0};
      if (p.includes("ชผ."))        return {rank:8,  num: 0};
      if (p.includes("นพด."))       return {rank:9,  num: extractNum(p)};
      if (p.includes("วศก."))       return {rank:10, num: extractNum(p)};
      if (p.includes("นบช."))       return {rank:11, num: extractNum(p)};
      if (p.includes("นบท"))        return {rank:12, num: extractNum(p)};
      // ---- พชง./พบช. suffix พิเศษ ----
      if (p.includes("(สข)"))       return {rank:13, num: extractNum(p)};
      if (p.includes("(ฮล)"))       return {rank:14, num: extractNum(p)};
      if (p.includes("(ปฟ)") && (p.includes("พชง") || p.includes("พบช")))
                                     return {rank:15, num: extractNum(p)};
      // ---- พชง./พบช. ทั่วไป ----
      if (p.includes("พชง.") || p.includes("พบช."))
                                     return {rank:16, num: extractNum(p)};
      // ---- ลูกจ้าง ----
      if (p.includes("ชชง.(ปฟ)"))   return {rank:20, num: 0};
      if (p.includes("ชชง"))         return {rank:19, num: 0};
      if (p.includes("ชบช."))        return {rank:21, num: 0};
      if (p.includes("ชบค."))        return {rank:22, num: 0};
      if (p.includes("ชพด."))        return {rank:23, num: 0};
      // ---- คนงาน ----
      if (p.startsWith("คนงาน")) {
        let sub = 99;
        for (const c of WORKER_RANK_TABLE) { if (p.includes(c.match)) { sub = c.rank; break; } }
        return {rank:30, num: sub};
      }
      // ---- ผู้ปฏิบัติงานระบบไฟฟ้า กฟภ. (คนงาน กฟส.) ----
      if (p.startsWith("ผู้ปฏิบัติงาน")) {
        let sub = 50; // default
        for (const c of WORKER_RANK_TABLE) { if (p.includes(c.match)) { sub = c.rank; break; } }
        return {rank:30, num: sub};
      }
      // ---- พขร.(บ) ----
      if (p.includes("พขร."))        return {rank:40, num: 0};
      return {rank:98, num: extractNum(p)};
    }

    // ลำดับสังกัดหลัก กฟจ.ลำพูน
    const DEPT_ORDER = [
      "กฟจ.ลำพูน","ผกส.","ผปบ.","ผมต.","ผบร.","ผบส.","ผสน.","ผคพ.","ผบง.",
      "กฟส.ป่าซาง","กฟส.บ้านโฮ่ง","กฟส.ลี้","กฟส.บ้านธิ","กฟส.แม่ทา",
      "กฟส.นครเจดีย์","กฟส.เวียงหนองล่อง","กฟส.ทุ่งหัวช้าง","กฟส.แม่ตืน",
      "ผปร.","ผบค.",
    ];

    function deptOrder(dept) {
      const i = DEPT_ORDER.indexOf((dept||"").trim());
      return i >= 0 ? i : 500;
    }

    function sortPersonnel(list) {
      return [...list].sort((a,b)=>{
        // 1. กลุ่มหลัก: พนักงาน → ลูกจ้าง → คนงาน → พขร.(บ)
        const gA = getGroup(a.position), gB = getGroup(b.position);
        if (gA !== gB) return gA - gB;
        // 2. สังกัด/แผนก
        const dA = deptOrder(a.department), dB = deptOrder(b.department);
        if (dA !== dB) return dA - dB;
        // 3. ลำดับตำแหน่งภายในสังกัด
        const pA = getPosRank(a.position), pB = getPosRank(b.position);
        if (pA.rank !== pB.rank) return pA.rank - pB.rank;
        // 4. ระดับตัวเลข: ส่วนใหญ่สูงก่อน ยกเว้น คนงาน (ascending)
        if (pA.num !== pB.num) {
          if (pA.rank === 30) return pA.num - pB.num;
          return pB.num - pA.num;
        }
        // 5. ชื่อ
        return (a.fullName||"").localeCompare(b.fullName||"", "th");
      });
    }

    // ============ PIN DIALOG ============
    function MembersView({ locs }) {
      const [selLoc,setSelLoc]   = useState("lampun");
      const [members,setMembers] = useState([]);
      const [loadingM,setLoadingM] = useState(false);
      const [showForm,setShowForm] = useState(false);
      const [editing,setEditing] = useState(null);
      const [form,setForm]       = useState({empId:"",fullName:"",position:"",department:""});
      const [pinFor,setPinFor]   = useState(null);
      const [importMsg,setImportMsg] = useState("");
      const fileRef = useRef(null);

      const loadReq = useRef(0); // กันข้อมูลหน่วยงานเก่าทับ ถ้ากดสลับหน่วยงานเร็วๆ
      const loadMembers = async (locId) => {
        const my = ++loadReq.current;
        setLoadingM(true);
        try {
          const snap=await db.collection("personnel").where("locationId","==",locId).get();
          if(my!==loadReq.current) return;
          setMembers(sortPersonnel(snap.docs.map(d=>({id:d.id,...d.data()}))));
        } catch(e){ if(my===loadReq.current) alert("โหลดข้อมูลไม่ได้: "+e.message); }
        finally { if(my===loadReq.current) setLoadingM(false); }
      };

      const resetForm=()=>{ setForm({empId:"",fullName:"",position:"",department:""}); setEditing(null); setShowForm(false); };

      // สลับหน่วยงาน → ปิดฟอร์มแก้ไขที่ค้างอยู่ (กันบันทึกแล้วคนย้ายไปหน่วยงานอื่นโดยไม่ตั้งใจ)
      useEffect(()=>{ if(editing) resetForm(); loadMembers(selLoc); },[selLoc]);

      const handleSave=async()=>{
        if(!form.fullName.trim()||!form.position.trim()||!form.department.trim()){ alert("กรุณากรอกข้อมูลที่จำเป็นให้ครบ"); return; }
        try {
          const data={empId:form.empId.trim()||null,fullName:form.fullName.trim(),position:form.position.trim(),department:form.department.trim(),locationId:editing?(editing.locationId||selLoc):selLoc};
          if(editing){
            await db.collection("personnel").doc(editing.id).update(data);
            setMembers(prev=>sortPersonnel(prev.map(m=>m.id===editing.id?{...m,...data}:m)));
          } else {
            const ref=await db.collection("personnel").add(data);
            setMembers(prev=>sortPersonnel([...prev,{id:ref.id,...data}]));
          }
          resetForm();
        } catch(e){ alert("บันทึกไม่สำเร็จ: "+e.message); }
      };

      const handleDelete=async(member)=>{
        try {
          await db.collection("personnel").doc(member.id).delete();
          setMembers(prev=>prev.filter(m=>m.id!==member.id));
          setPinFor(null);
        } catch(e){ alert("ลบไม่สำเร็จ: "+e.message); }
      };

      const formRef = useRef(null);
      const handleEdit=(member)=>{
        setEditing(member);
        setForm({empId:member.empId||"",fullName:member.fullName,position:member.position,department:member.department});
        setShowForm(true); setPinFor(null);
        // scroll ไปที่ form หลัง render
        setTimeout(()=>{ formRef.current?.scrollIntoView({behavior:"smooth",block:"start"}); },80);
      };

      const handleImport=(e)=>{
        const file=e.target.files[0]; if(!file) return;
        const reader=new FileReader();
        reader.onload=async(ev)=>{
          const saved=[]; let total=0;
          try {
            setImportMsg("กำลังอ่านไฟล์...");
            const wb=XLSX.read(ev.target.result,{type:"array"});
            const ws=wb.Sheets[wb.SheetNames[0]];
            const rows=XLSX.utils.sheet_to_json(ws,{header:1});
            if(rows.length<2){ setImportMsg("ไม่พบข้อมูลในไฟล์"); return; }
            const headers=rows[0].map(h=>(h||"").toString().toLowerCase().trim());
            const findCol=(...keys)=>{ for(const k of keys){ const i=headers.findIndex(h=>h.includes(k)); if(i>=0) return i; } return -1; };
            const colId=findCol("รหัส","id","emp");
            const colName=findCol("ชื่อ","name","fullname");
            const colPos=findCol("ตำแหน่ง","position","pos");
            const colDept=findCol("สังกัด","แผนก","dept","department");
            if(colName<0){ setImportMsg("ไม่พบคอลัมน์ชื่อในไฟล์"); return; }
            const toImport=[];
            for(let i=1;i<rows.length;i++){
              const row=rows[i];
              const name=(row[colName]||"").toString().trim();
              if(!name) continue;
              toImport.push({ empId:colId>=0?(row[colId]||"").toString().trim()||null:null, fullName:name, position:colPos>=0?(row[colPos]||"").toString().trim():"", department:colDept>=0?(row[colDept]||"").toString().trim():"", locationId:selLoc });
            }
            if(toImport.length===0){ setImportMsg("ไม่พบข้อมูลรายชื่อในไฟล์"); return; }
            setImportMsg("กำลังนำเข้า "+toImport.length+" รายชื่อ...");
            // Firestore จำกัด 500 รายการต่อ batch → แบ่งส่งทีละ 400
            total=toImport.length;
            for(let s=0;s<toImport.length;s+=400){
              const batch=db.batch(); const part=[];
              for(const item of toImport.slice(s,s+400)){ const ref=db.collection("personnel").doc(); batch.set(ref,item); part.push({id:ref.id,...item}); }
              await batch.commit();
              saved.push(...part);
            }
            setMembers(prev=>sortPersonnel([...prev,...saved]));
            setImportMsg("นำเข้าสำเร็จ "+toImport.length+" รายชื่อ ✅");
            setTimeout(()=>setImportMsg(""),4000);
          } catch(err){
            // ถ้าบันทึกไปได้บางส่วนแล้ว ให้แสดงในตารางด้วย (กันกดนำเข้าซ้ำแล้วได้รายชื่อซ้ำ)
            if(saved.length) setMembers(prev=>sortPersonnel([...prev,...saved]));
            setImportMsg((saved.length?`นำเข้าได้ ${saved.length} จาก ${total} รายชื่อ — `:"")+"เกิดข้อผิดพลาด: "+err.message);
          }
        };
        reader.readAsArrayBuffer(file);
        e.target.value="";
      };

      const loc=locs[selLoc]||Object.values(locs)[0];

      const exportMembers = () => {

        const ws2 = XLSX.utils.json_to_sheet(sheetFull);
        ws2["!cols"] = [{wch:8},{wch:14},{wch:30},{wch:20},{wch:18},{wch:18},{wch:16}];
        XLSX.utils.book_append_sheet(wb, ws2, "WeSafe & PPE");

        const date = todayStr();
        XLSX.writeFile(wb, `รายชื่อ_${loc.name||selLoc}_${date}.xlsx`);
      };

      return (
        <div className="max-w-5xl mx-auto space-y-5">

          <div className="bg-slate-800/50 backdrop-blur-lg border border-emerald-500/30 rounded-2xl p-5 shadow-xl">
            <h2 className="text-xl font-black text-white mb-4 flex items-center"><IUsers sz={22} cl="text-emerald-400 mr-2"/>จัดการรายชื่อบุคลากร</h2>
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2 mb-3">
              {Object.values(locs).map(l=>(
                <button key={l.id} onClick={()=>setSelLoc(l.id)}
                  className={`px-3 py-2 rounded-xl font-bold text-xs transition-all text-center ${selLoc===l.id?"bg-emerald-500 text-slate-900 shadow-lg shadow-emerald-500/50":"bg-slate-700 text-slate-300 hover:bg-slate-600"}`}>
                  {l.name}
                </button>
              ))}
            </div>
            <div className="p-3 bg-slate-900/50 rounded-lg flex items-center justify-between">
              <div><p className="text-emerald-400 font-bold text-sm">{loc.name}</p><p className="text-slate-400 text-xs">{loc.fullName} — {members.length} คน</p></div>
            </div>
          </div>
          <div className="flex gap-3 flex-wrap">
            <button onClick={()=>{ resetForm(); setShowForm(true); }} className="flex items-center gap-2 bg-emerald-500 text-slate-900 font-bold px-5 py-2.5 rounded-xl hover:shadow-lg hover:shadow-emerald-500/50">
              <IPlus sz={16}/>เพิ่มรายชื่อ
            </button>
            <button onClick={()=>fileRef.current?.click()} className="flex items-center gap-2 bg-blue-500/20 text-blue-400 font-bold px-5 py-2.5 rounded-xl hover:bg-blue-500/30 border border-blue-500/30">
              <IUpload sz={16}/>นำเข้าจาก Excel
            </button>
            <button onClick={exportMembers} className="flex items-center gap-2 bg-amber-500/20 text-amber-400 font-bold px-5 py-2.5 rounded-xl hover:bg-amber-500/30 border border-amber-500/30">
              <IDl sz={16}/>ส่งออกรายชื่อ
            </button>
            <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={handleImport}/>
            {importMsg&&<p className="text-sm text-emerald-400 font-semibold flex items-center">{importMsg}</p>}
          </div>
          <div className="bg-blue-500/10 border border-blue-500/20 rounded-xl p-3 text-xs text-slate-400">
            <p className="text-blue-400 font-bold mb-1">📋 รูปแบบไฟล์ Excel ที่รองรับ</p>
            <p>แถวแรก = Header: <span className="text-white font-mono">รหัส | ชื่อ-นามสกุล | ตำแหน่ง | สังกัด</span> (ระบบจะหาคอลัมน์อัตโนมัติ)</p>

          <div className="bg-slate-800/50 backdrop-blur-lg border border-emerald-500/30 rounded-2xl shadow-xl overflow-hidden">
            {loadingM
              ?<div className="flex justify-center py-16"><ISpin sz={36} cl="text-emerald-400"/></div>
              :members.length===0
                ?<div className="text-center py-16 text-slate-500"><IUsers sz={40} cl="mx-auto mb-3 opacity-40"/><p>ยังไม่มีรายชื่อ</p><p className="text-xs mt-1">กดเพิ่มรายชื่อ หรือนำเข้าจาก Excel</p></div>
                :<div className="overflow-x-auto">
                  <table className="w-full text-sm">

                      <tr>{["#","รหัส","ชื่อ-นามสกุล","ตำแหน่ง","สังกัด",""].map(h=>(
                        <th key={h} className="px-4 py-3 text-left text-emerald-400 font-bold whitespace-nowrap">{h}</th>
                      ))}</tr>
                    </thead>
                    <tbody className="divide-y divide-slate-700/50">
                      {members.map((m,i)=>(
                        <tr key={m.id} className="hover:bg-slate-700/30 transition-colors">
                          <td className="px-4 py-3 text-slate-500">{i+1}</td>

                              <button onClick={()=>{if(confirm("ลบ "+m.fullName+"?")) handleDelete(m);}} className="bg-red-500/20 text-red-400 p-1.5 rounded-lg hover:bg-red-500/30"><ITrash sz={13}/></button>

    // ============ REGISTER FORM ============
    function RegisterForm({ onDone, curLoc, loc, onOpenDash }) {
      const [step,setStep]       = useState("form"); // form | photo | submitting | success | error
      const [form,setForm]       = useState({ empId:"", fullName:"", position:"", department:"" });
      const [autoFilled,setAutoFilled] = useState(false);
      const [searching,setSearching]   = useState(false);
      const [photo,setPhoto]     = useState(null);
      const [camMode,setCamMode] = useState("user");
      const [camOpen,setCamOpen] = useState(false);
      const [camErr,setCamErr]   = useState(null); // null | "permission" | "notfound" | "other"
      const [err,setErr]         = useState("");
      const [saveMsg,setSaveMsg] = useState("");
      const [savedAtt,setSavedAtt] = useState(null);
      const [locData,setLocData] = useState(null);
      const vidRef=useRef(null); const canRef=useRef(null); const stRef=useRef(null);
      const pendingStreamRef=useRef(null); // เก็บ stream รอ video mount
      const personnelCacheRef=useRef(null); // cache รายชื่อบุคลากร
      const faceDetRef=useRef(null); // FaceDetector interval
      const flipTriggerRef=useRef(0); // trigger applyStream เมื่อ flip
      const [faceInFrame,setFaceInFrame] = useState(false); // หน้าอยู่ในกรอบ
      const [autoCountdown,setAutoCountdown] = useState(null); // นับถอยหลัง 0-3
      const countdownRef=useRef(null); // countdown timeout
      const autoRef=useRef(false); // ป้องกันถ่ายซ้ำ

      const setF = (k,v) => { setForm(prev=>({...prev,[k]:v})); if(k==="empId") setAutoFilled(false); };

      // โหลด personnel ไว้ใน cache ทันทีที่เปิดหน้า (เก็บใน state ด้วย เพื่อให้รายการค้นหาแสดงทันทีเมื่อโหลดเสร็จ)
      const [people,setPeople] = useState(null);       // null = กำลังโหลด
      const [peopleErr,setPeopleErr] = useState(false);
      useEffect(()=>{
        personnelCacheRef.current = null; // reset เมื่อ curLoc เปลี่ยน
        setPeople(null); setPeopleErr(false);
        let alive = true;
        db.collection("personnel").where("locationId","==",curLoc).get()
          .then(snap=>{ if(!alive) return; const list=snap.docs.map(d=>d.data()); personnelCacheRef.current = list; setPeople(list); })
          .catch(()=>{ if(alive) setPeopleErr(true); });
        return ()=>{ alive=false; };
      },[curLoc]);

      // ── ค้นหารายชื่อขณะพิมพ์รหัส (3 ตัวขึ้นไป) แล้วแตะเลือก — แบบเดียวกับระบบ PPE ──
      const SUG_MIN = 3;
      const [sugOpen,setSugOpen] = useState(false);
      const [sugHi,setSugHi]     = useState(0);
      const [phoneMode,setPhoneMode] = useState(false); // เลือกคนที่ไม่มีรหัสในระบบ → ให้กรอกเบอร์โทรแทน (ไม่ต้องแสดงรายการซ้ำ)
      const empInputRef = useRef(null);
      const empBoxRef   = useRef(null);
      const skipBlurLookup = useRef(false);
      const empQ = cleanEmpId(form.empId);
      const suggestions = useMemo(()=>{
        if(!people || empQ.length<SUG_MIN) return [];
        const q=empQ.toLowerCase(), qd=empQ.replace(/\D/g,"");
        const stripTitle = s => s.replace(/^(นางสาว|น\.ส\.|นาง|นาย|ว่าที่\s*ร\.?\s*ต\.?|ว่าที่ร้อยตรี|ดร\.)\s*/,"");
        const hits=[];
        people.forEach(p=>{
          const id=(p.empId==null?"":String(p.empId)).trim(), idl=id.toLowerCase(), idd=id.replace(/\D/g,"");
          const nml=String(p.fullName||"").trim().toLowerCase();
          let s=-1;
          if(id && idl===q) s=0;                                                   // รหัสตรงทุกตัว
          else if(id && idl.startsWith(q)) s=1;                                    // รหัสขึ้นต้นด้วย
          else if(id && (idl.includes(q) || (qd.length>=SUG_MIN && idd.includes(qd)))) s=2; // มีเลขนี้อยู่ในรหัส/เบอร์
          else if(nml && stripTitle(nml).startsWith(q)) s=3;                       // ชื่อขึ้นต้นด้วย
          else if(nml && nml.includes(q)) s=4;                                     // มีคำนี้ในชื่อ
          if(s>=0) hits.push({p,s,id});
        });
        // ตรงรหัส → เรียงตามรหัส, ตรงชื่อ → เรียงตามชื่อ
        hits.sort((a,b)=>a.s-b.s || (a.s<=2 ? a.id.localeCompare(b.id) : String(a.p.fullName||"").localeCompare(String(b.p.fullName||""),"th")));
        return hits.slice(0,30).map(h=>h.p);
      },[people,empQ]);
      // เบอร์โทรที่ใช้แทนรหัส แสดงแบบซ่อนบางหลักในรายการ
      const showId = id => { const d=String(id||"").replace(/\D/g,""); return /^0\d{8,9}$/.test(d) ? d.slice(0,3)+"•••"+d.slice(-3) : String(id||""); };
      const pickPerson = p => {
        const id = p.empId==null ? "" : String(p.empId).trim();
        const typed = form.empId.trim();
        const typedIsNumber = /^[\d\s-]+$/.test(typed);
        setForm({ empId: id || (typedIsNumber ? typed : ""), fullName:p.fullName||"", position:p.position||"", department:p.department||"" });
        setAutoFilled(true); setSugOpen(false); setPhoneMode(!id && !typedIsNumber);
        // ปิดคีย์บอร์ด ให้เห็นข้อมูลและปุ่มถัดไป (ข้ามการค้นหาแบบเดิมตอน blur เพราะเลือกแล้ว)
        if(empInputRef.current && document.activeElement===empInputRef.current){ skipBlurLookup.current = true; empInputRef.current.blur(); }
      };
      // แตะนอกช่อง → ปิดรายการ
      useEffect(()=>{
        if(!sugOpen) return;
        const h = e => { if(empBoxRef.current && !empBoxRef.current.contains(e.target)) setSugOpen(false); };
        document.addEventListener("mousedown",h); document.addEventListener("touchstart",h,{passive:true});
        return ()=>{ document.removeEventListener("mousedown",h); document.removeEventListener("touchstart",h); };
      },[sugOpen]);

      const lookupEmpId = useCallback(async (val) => {
        const q=cleanEmpId(val);
        if(!q||q.length<2) return;
        setSearching(true);
        try {
          // ใช้ cache ถ้ามี — ไม่ต้อง query Firestore ซ้ำ
          let list = personnelCacheRef.current;
          if(!list){
            const snap=await db.collection("personnel").where("locationId","==",curLoc).get();
            list = snap.docs.map(d=>d.data());
            personnelCacheRef.current = list;
            setPeople(list); setPeopleErr(false);
          }
          const qd=q.replace(/\D/g,""); // เทียบเฉพาะตัวเลข (เช่น เบอร์โทรที่มีขีด) — ต้องมีตัวเลขอย่างน้อย 2 หลัก
          const found=list.find(d=>
            (d.empId&&d.empId.toString().trim()===q) ||
            (qd.length>=2 && d.empId&&d.empId.toString().replace(/\D/g,"")===qd)
          );
          if(found){
            // ใช้รหัสจากทะเบียนรายชื่อ (ไม่ใช้ที่พิมพ์) → รหัสเดียวกันทุกครั้ง ไม่แตกเป็นหลายคนในหน้าเทียบใบหน้า
            const canon = found.empId!=null ? String(found.empId).trim() : "";
            setForm(prev=>({...prev,empId:canon||prev.empId,fullName:found.fullName||"",position:found.position||"",department:found.department||""}));
            setAutoFilled(true);
          }
        } catch(e){ /* lookup failed silently */ }
        finally { setSearching(false); }
      },[curLoc]);

      const startCam = useCallback(async mode=>{
        if(stRef.current) stRef.current.getTracks().forEach(t=>t.stop());
        setCamErr(null); // เคลียร์ error เก่า
        const fm = mode||camMode;

        const tryOpen = async(constraints) => {
          const st = await navigator.mediaDevices.getUserMedia(constraints);
          stRef.current = st;
          pendingStreamRef.current = st; // รอ video element mount
          setCamOpen(true); // trigger render <video>
          // การ assign srcObject ทำใน useEffect ด้านล่าง
        };

        // ลอง 3 ระดับ: exact → normal → ไม่ระบุ facingMode
        try {
          await tryOpen({ video:{ facingMode:{ exact: fm } }, audio:false });
        } catch(e1){
          try {
            await tryOpen({ video:{ facingMode: fm }, audio:false });
          } catch(e2){
            try {
              await tryOpen({ video:true, audio:false });
            } catch(e3){
              // จำแนกประเภท error เพื่อแสดงคำแนะนำที่ตรงจุด
              const msg = (e3.name||"") + (e3.message||"");
              if(e3.name==="NotAllowedError" || msg.includes("Permission") || msg.includes("denied")){
                setCamErr("permission");
              } else if(e3.name==="NotFoundError" || msg.includes("not found") || msg.includes("Requested device")){
                setCamErr("notfound");
              } else {
                setCamErr("other");
              }
            }
          }
        }
      },[camMode]);

      // ตรวจจับใบหน้าด้วย canvas skin-color detection (ทำงานทุก browser รวม iOS Safari/LINE)
      const detectFaceCanvas = () => {
        const vid = vidRef.current;
        if(!vid || vid.readyState < 2 || vid.videoWidth === 0) return false;
        // สร้าง canvas ชั่วคราว สุ่ม sample pixel ในกรอบวงรีตรงกลาง
        const W = vid.videoWidth, H = vid.videoHeight;
        const tmpCanvas = document.createElement("canvas");
        const scale = 0.25; // ย่อขนาดเพื่อประหยัด CPU
        tmpCanvas.width  = Math.floor(W * scale);
        tmpCanvas.height = Math.floor(H * scale);
        const ctx = tmpCanvas.getContext("2d");
        ctx.drawImage(vid, 0, 0, tmpCanvas.width, tmpCanvas.height);
        // วิเคราะห์เฉพาะบริเวณกลางภาพ (60% ตรงกลาง = ตำแหน่งกรอบใบหน้า)
        const cw = tmpCanvas.width, ch = tmpCanvas.height;
        const x0 = Math.floor(cw*0.20), x1 = Math.floor(cw*0.80);
        const y0 = Math.floor(ch*0.10), y1 = Math.floor(ch*0.85);
        let skinPx = 0, totalPx = 0;
        const data = ctx.getImageData(x0, y0, x1-x0, y1-y0).data;
        for(let i=0; i<data.length; i+=4){
          const r=data[i], g=data[i+1], b=data[i+2];
          totalPx++;
          // skin color range (ครอบคลุมหลายโทนผิว)
          const isSkin = (
            r > 60 && g > 40 && b > 20 &&
            r > b &&
            Math.abs(r-g) > 8 &&
            r > 100 &&
            r < 250 && g < 220 && b < 200 &&
            (r-Math.min(g,b)) > 15
          );
          if(isSkin) skinPx++;
        }
        const ratio = skinPx / totalPx;
        return ratio > 0.10; // ถ้ามี skin pixel มากกว่า 10% → มีใบหน้าในกรอบ
      };

      const startFaceDetection = useCallback(()=>{
        if(faceDetRef.current) clearInterval(faceDetRef.current);
        autoRef.current = false;
        setFaceInFrame(false);
        setAutoCountdown(null);
        // ใช้ canvas skin detection — ทำงานทุก browser ไม่ต้อง FaceDetector API
        faceDetRef.current = setInterval(()=>{
          if(autoRef.current) return;
          const hasface = detectFaceCanvas();
          setFaceInFrame(hasface);
          if(hasface && !countdownRef.current && !autoRef.current){
            let cnt = 2;
            setAutoCountdown(cnt);
            const tick = () => {
              cnt--;
              if(cnt > 0){ setAutoCountdown(cnt); countdownRef.current=setTimeout(tick,1000); }
              else {
                setAutoCountdown(0);
                countdownRef.current=null;
                autoRef.current=true;
                const v=vidRef.current, c=canRef.current;
                if(v&&c){
                  c.width=v.videoWidth; c.height=v.videoHeight;
                  c.getContext("2d").drawImage(v,0,0);
                  clearInterval(faceDetRef.current);
                  // เก็บกล้องไว้ (ไม่ปิด) เพื่อให้ "ถ่ายใหม่" ไม่ต้องขออนุญาตกล้องซ้ำ
                  compress(c.toDataURL("image/jpeg",0.92),800,0.78).then(img=>setPhoto(img));
                }
              }
            };
            countdownRef.current = setTimeout(tick,1000);
          } else if(!hasface && countdownRef.current){
            clearTimeout(countdownRef.current);
            countdownRef.current=null;
            setAutoCountdown(null);
          }
        }, 500);
      },[]);

      // ฟังก์ชัน assign stream ให้ video element (ใช้ได้ทั้งกรณี mount และ flip)
      const applyStreamToVideo = useCallback(async (st)=>{
        let attempts = 0;
        while(!vidRef.current && attempts < 30){
          await new Promise(r=>setTimeout(r,50));
          attempts++;
        }
        const vid = vidRef.current;
        if(!vid || !st) return;
        try {
          // reset video ก่อนเพื่อให้ browser รับ stream ใหม่
          vid.pause();
          vid.srcObject = null;
          await new Promise(r=>setTimeout(r,50));
          vid.srcObject = st;
          vid.muted = true;
          vid.playsInline = true;
          await new Promise((res)=>{
            const t = setTimeout(res, 3000);
            vid.onloadedmetadata = ()=>{ clearTimeout(t); res(); };
          });
          await vid.play().catch(()=>{});
          pendingStreamRef.current = null;
          setTimeout(()=>startFaceDetection(), 300);
        } catch(e){ /* ignore */ }
      },[startFaceDetection]);

      // useEffect: ตอน camOpen ครั้งแรก
      useEffect(()=>{
        if(!camOpen || !pendingStreamRef.current) return;
        applyStreamToVideo(pendingStreamRef.current);
      },[camOpen]);

      const stopFaceDetection = () => {
        if(faceDetRef.current){ clearInterval(faceDetRef.current); faceDetRef.current=null; }
        if(countdownRef.current){ clearTimeout(countdownRef.current); countdownRef.current=null; }
        autoRef.current=false; setFaceInFrame(false); setAutoCountdown(null);
      };

      const stopCamOnly = () => { if(stRef.current){stRef.current.getTracks().forEach(t=>t.stop());stRef.current=null;} pendingStreamRef.current=null; setCamOpen(false); };
      const stopCam = () => { stopFaceDetection(); stopCamOnly(); };

      const capture = async () => {
        const v=vidRef.current,c=canRef.current; if(!v||!c) return;
        c.width=v.videoWidth; c.height=v.videoHeight; c.getContext("2d").drawImage(v,0,0);
        // ไม่ปิดกล้อง — เก็บ stream ไว้ใช้ตอน "ถ่ายใหม่" จะได้ไม่ต้องขออนุญาตกล้องซ้ำ
        stopFaceDetection();
        setPhoto(await compress(c.toDataURL("image/jpeg",0.92),800,0.78));
      };

      // ถ่ายใหม่: ใช้กล้องเดิมที่ยังเปิดอยู่ ถ้ากล้องถูกปิดไปแล้วค่อยเปิดใหม่
      const retake = () => {
        const st = stRef.current;
        const live = !!st && st.getVideoTracks().some(t=>t.readyState==="live");
        setPhoto(null);
        if(live && camOpen){ applyStreamToVideo(st); }
        else { stopCamOnly(); startCam(); }
      };

      const flip = async () => {
        stopFaceDetection();
        const m = camMode==="environment"?"user":"environment";
        setCamMode(m);
        // หยุด stream เก่าก่อน
        if(stRef.current){ stRef.current.getTracks().forEach(t=>t.stop()); stRef.current=null; }
        pendingStreamRef.current=null;
        // เปิด stream ใหม่แล้ว assign ตรงๆ (ไม่ผ่าน setCamOpen เพราะ camOpen=true อยู่แล้ว)
        const tryFlip = async(constraints)=>{
          const st = await navigator.mediaDevices.getUserMedia(constraints);
          stRef.current = st;
          pendingStreamRef.current = st;
          await applyStreamToVideo(st);
        };
        try { await tryFlip({video:{facingMode:{exact:m}},audio:false}); }
        catch(e1){ try { await tryFlip({video:{facingMode:m},audio:false}); }
        catch(e2){ try { await tryFlip({video:true,audio:false}); }
        catch(e3){ setCamErr("other"); } } }
      };

      const handleSubmit = async () => {
        stopCam(); // ปิดกล้องเมื่อกดยืนยัน
        setStep("submitting"); setErr("");
        setSaveMsg("กำลังตรวจสอบเวลา...");
        const tStart = loc.timeStart||TIME_START;
        const tEnd   = loc.timeEnd||TIME_END;
        if(!withinTime(tStart,tEnd)){
          setErr(`ลงทะเบียนได้เฉพาะเวลา ${tStart} - ${tEnd} น.`); setStep("error"); return;
        }
        setSaveMsg("กำลังตรวจสอบตำแหน่ง GPS...");
        if(!navigator.geolocation){ setErr("เบราว์เซอร์ไม่รองรับ GPS"); setStep("error"); return; }
        navigator.geolocation.getCurrentPosition(async pos=>{
          const dist=calcDist(pos.coords.latitude,pos.coords.longitude,loc.lat,loc.lng);
          const maxDist = getMaxDist(loc);
          const displayDist = loc.displayDist || 20;
          if(dist>maxDist){
            setErr(`คุณอยู่ห่างจากจุดกิจกรรม ${dist.toFixed(0)} เมตร (อนุญาตไม่เกิน ${displayDist} เมตร)`);
            setStep("error"); return;
          }
          const ld={lat:pos.coords.latitude,lng:pos.coords.longitude,distance:dist.toFixed(1)};
          try {
            setSaveMsg("กำลังอัปโหลดรูป...");
            const img=await uploadPhoto(photo, ()=>setSaveMsg("ImgBB ไม่ตอบสนอง กำลังใช้ที่เก็บสำรอง..."));
            setSaveMsg("กำลังบันทึกข้อมูล...");
            const att={
              empId:      cleanEmpId(form.empId)||null,   // ลบตัวอักษรล่องหน/แปลงเลขไทย ก่อนบันทึก
              fullName:   form.fullName.trim(),
              position:   form.position.trim(),
              department: form.department.trim(),
              timestamp:  new Date().toISOString(),
              location:   ld,
              locationId: curLoc,
              locationName:loc.name,
              photoURL:   img.url,
              photoThumb: img.thumb,
              distance:   ld.distance,
            };
            const ref=await db.collection("attendances").add(att);
            const full={id:ref.id,...att};
            onDone(full); setLocData(ld); setSavedAtt(full); setStep("success");
          } catch(e){ setErr("เกิดข้อผิดพลาด: "+e.message); setStep("error"); }
        }, err=>{
          // แยก error code เพื่อแสดง popup แนะนำวิธีแก้ที่ตรงจุด
          if(err.code===1) {
            // PERMISSION_DENIED — ผู้ใช้กด "ไม่อนุญาต"
            setErr("PERMISSION_DENIED");
          } else if(err.code===2) {
            // POSITION_UNAVAILABLE — GPS ปิดหรือหาตำแหน่งไม่ได้
            setErr("POSITION_UNAVAILABLE");
          } else {
            // TIMEOUT
            setErr("TIMEOUT");
          }
          setStep("gps_error");
        }, {enableHighAccuracy:true,timeout:15000});
      };

      const reset = () => {
        setStep("form"); setForm({empId:"",fullName:"",position:"",department:""});
        setAutoFilled(false); setPhoto(null); setErr(""); setSavedAtt(null); setLocData(null); stopCam();
        setSugOpen(false); setPhoneMode(false); setNoFaceCount(0);
      };

      // ปิดกล้องเมื่อออกจากหน้านี้ (เช่น กดไปหน้า Dashboard ระหว่างกล้องเปิด)
      useEffect(()=>()=>{ if(stRef.current){ stRef.current.getTracks().forEach(t=>t.stop()); stRef.current=null; } },[]);

      // ถ่ายรูปแล้ว → เลื่อนจอให้เห็นปุ่ม "ยืนยันลงทะเบียน" อัตโนมัติ
      const confirmRef = useRef(null);
      useEffect(()=>{
        if(!photo) return;
        const t = setTimeout(()=>{ try { confirmRef.current && confirmRef.current.scrollIntoView({behavior:"smooth",block:"center"}); } catch(e){} }, 150);
        return ()=>clearTimeout(t);
      },[photo]);

      // ── ตรวจว่า "เห็นใบหน้า" ในรูปหรือไม่ ก่อนยืนยัน (ตรวจบนเครื่องผู้ลงทะเบียน ไม่ส่งรูปไปไหน) ──
      const FACE_BYPASS_AFTER = 2;                       // ไม่เจอหน้าครบ 2 รูป → ให้ลงทะเบียนต่อได้ (แอดมินตรวจภายหลัง)
      const [faceChk,setFaceChk] = useState(null);       // null | checking | ok | noface | skip
      const [noFaceCount,setNoFaceCount] = useState(0);
      const [confirmWait,setConfirmWait] = useState(false);
      const faceChkRef = useRef(null);
      useEffect(()=>{ if(step==="photo") warmFaceDetector().catch(()=>{}); },[step]);   // โหลด+อุ่นตัวตรวจไว้ก่อน ระหว่างเปิดกล้อง
      useEffect(()=>{
        if(!photo){ setFaceChk(null); faceChkRef.current=null; return; }
        let alive = true;
        setFaceChk("checking");
        const p = detectFaceInPhoto(photo).then(r=>{
          if(alive){ setFaceChk(r); if(r==="noface") setNoFaceCount(c=>c+1); }
          return r;
        });
        faceChkRef.current = p;
        return ()=>{ alive=false; };
      },[photo]);
      const confirmSubmit = async () => {
        let r = faceChk;
        if(r==="checking" && faceChkRef.current){
          setConfirmWait(true);
          r = await Promise.race([faceChkRef.current, new Promise(res=>setTimeout(()=>res("skip"),6000))]);
          setConfirmWait(false);
        }
        if(r==="noface") return;   // ข้อความแนะนำให้ถ่ายใหม่แสดงอยู่แล้ว
        handleSubmit();
      };

      // คำแนะนำตั้งค่า "อนุญาตตลอด" (กล้อง/ตำแหน่ง) — แสดงหลังลงทะเบียนสำเร็จ
      const isIOSDevice = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
      const [permTip,setPermTip] = useState(false);
      useEffect(()=>{
        if(step!=="success") return;
        let hidden=false;
        try { hidden = localStorage.getItem("st_perm_tip_hidden")==="1"; } catch(e){}
        if(hidden) return;
        if(isIOSDevice){ setPermTip(true); return; }
        if(!navigator.permissions || !navigator.permissions.query) return;
        const q = n => navigator.permissions.query({name:n}).then(r=>r.state).catch(()=>"granted");
        Promise.all([q("camera"),q("geolocation")]).then(([c,g])=>{ if(c!=="granted"||g!=="granted") setPermTip(true); }).catch(()=>{});
      },[step]);
      const hidePermTip = () => { try { localStorage.setItem("st_perm_tip_hidden","1"); } catch(e){} setPermTip(false); };

      // ── FORM STEP ──
      if(step==="form") return (<>
        <div className="bg-slate-800/50 backdrop-blur-lg border border-emerald-500/30 rounded-2xl p-6 shadow-2xl">
          <div className="text-center mb-6">
            <div className="inline-flex items-center space-x-2 bg-emerald-500/20 border border-emerald-500/40 px-5 py-2.5 rounded-xl">
              <IMapPin sz={18} cl="text-emerald-400"/>
              <div className="text-left">
                <div className="text-emerald-400 font-black leading-tight">{loc.name}</div>
                <div className="text-slate-400 text-xs">{loc.fullName}</div>
              </div>
            </div>
          </div>
          <div className="space-y-3">
            {/* รหัสพนักงาน — auto-fill */}
            <div>
              <label className="block text-slate-400 text-sm font-semibold mb-1">รหัสพนักงาน / ลูกจ้าง<span className="text-red-400 ml-1">*</span></label>
              <div className="relative" ref={empBoxRef}>
                <input ref={empInputRef} value={form.empId} autoComplete="off" autoCorrect="off" spellCheck={false}
                  onChange={e=>{ setF("empId",e.target.value); setSugOpen(true); setSugHi(0); if(!e.target.value.trim()) setPhoneMode(false); }}
                  onFocus={()=>{
                    setSugOpen(true);
                    // มือถือ: เลื่อนช่องขึ้นไปด้านบน ให้รายการรายชื่อไม่ถูกคีย์บอร์ดบัง
                    try { if(window.matchMedia && window.matchMedia("(pointer:coarse)").matches)
                      setTimeout(()=>{ try { empInputRef.current && empInputRef.current.scrollIntoView({behavior:"smooth",block:"start"}); } catch(e){} },350);
                    } catch(e){}
                  }}
                  onBlur={e=>{ if(skipBlurLookup.current){ skipBlurLookup.current=false; return; } lookupEmpId(e.target.value); }}
                  onKeyDown={e=>{
                    const open = sugOpen && !autoFilled && !phoneMode && suggestions.length>0;
                    if(e.key==="ArrowDown" && open){ e.preventDefault(); setSugHi(h=>Math.min(h+1,suggestions.length-1)); }
                    else if(e.key==="ArrowUp" && open){ e.preventDefault(); setSugHi(h=>Math.max(h-1,0)); }
                    else if(e.key==="Enter"){ e.preventDefault(); if(open && suggestions[sugHi]) pickPerson(suggestions[sugHi]); else { setSugOpen(false); lookupEmpId(e.target.value); } }
                    else if(e.key==="Escape") setSugOpen(false);
                  }}
                  placeholder="พิมพ์รหัส 3 ตัวขึ้นไป หรือชื่อ"
                  style={{scrollMarginTop:"40px"}}
                  className={`w-full bg-slate-900/80 border-2 text-white pl-10 pr-4 py-2.5 rounded-lg focus:outline-none transition-colors ${autoFilled?"border-emerald-500":"border-slate-700 focus:border-emerald-500"}`}/>
                <svg className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                {searching&&<ISpin sz={16} cl="absolute right-3 top-3 text-emerald-400"/>}
                {autoFilled&&<span className="absolute right-3 top-3 text-emerald-400 text-xs font-bold">✓ ดึงข้อมูลแล้ว</span>}

                {/* รายการรายชื่อที่ตรงกับที่พิมพ์ — แตะเพื่อเลือก */}
                {sugOpen && !autoFilled && !phoneMode && empQ.length>0 && (
                  <div className="absolute left-0 right-0 top-full mt-1 z-30 bg-slate-800 border border-emerald-500/40 rounded-xl shadow-2xl shadow-black/60 overflow-y-auto p-1.5"
                    style={{maxHeight:"min(300px, 45vh)"}} onMouseDown={e=>e.preventDefault()}>
                    {empQ.length<SUG_MIN
                      ? <div className="px-3 py-4 text-center text-slate-400 text-xs">พิมพ์อย่างน้อย {SUG_MIN} ตัว เพื่อค้นหา</div>
                    : !people && peopleErr
                      ? <div className="px-3 py-4 text-center text-amber-300 text-xs">โหลดรายชื่อไม่สำเร็จ — กรอกชื่อ ตำแหน่ง สังกัด เองด้านล่างได้เลย</div>
                    : !people
                      ? <div className="px-3 py-4 flex items-center justify-center gap-2 text-slate-400 text-xs"><ISpin sz={14} cl="text-emerald-400"/>กำลังโหลดรายชื่อ…</div>
                    : suggestions.length===0
                      ? <div className="px-3 py-4 text-center text-xs">
                          <p className="text-slate-300 font-semibold">ไม่พบรหัส/ชื่อนี้ในรายชื่อ {loc.name}</p>
                          <p className="text-slate-500 mt-1">ตรวจสอบรหัสอีกครั้ง หรือกรอกชื่อ ตำแหน่ง สังกัด เองด้านล่าง</p>
                        </div>
                    : <>
                        <p className="px-2 pt-1 pb-1.5 text-[11px] text-slate-500">แตะชื่อของท่านเพื่อเลือก • พบ {suggestions.length}{suggestions.length>=30?"+":""} รายการ</p>
                        {suggestions.map((p,i)=>(
                          <button type="button" key={(p.empId||"")+"|"+(p.fullName||"")+"|"+i}
                            onMouseDown={e=>e.preventDefault()} onMouseEnter={()=>setSugHi(i)} onClick={()=>pickPerson(p)}
                            className={`w-full text-left flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors ${i===sugHi?"bg-emerald-500/15":"hover:bg-slate-700/60 active:bg-emerald-500/20"}`}>
                            <span className="font-mono text-xs text-emerald-400 shrink-0" style={{minWidth:"64px"}}>{showId(p.empId)||"—"}</span>
                            <span className="min-w-0 flex-1">
                              <span className="block text-white font-bold text-sm truncate">{p.fullName||"-"}</span>
                              <span className="block text-slate-400 text-xs truncate">{[p.position,p.department].filter(Boolean).join(" • ")}</span>
                            </span>
                          </button>
                        ))}
                      </>}
                  </div>
                )}
              </div>
              {phoneMode && !form.empId.trim()
                ? <p className="text-amber-300 text-xs mt-1 font-semibold">รายชื่อนี้ยังไม่มีรหัสในระบบ — กรุณากรอกเบอร์โทรศัพท์ในช่องด้านบนแทน</p>
                : !autoFilled && <p className="text-slate-500 text-xs mt-1">พิมพ์รหัส (หรือชื่อ) อย่างน้อย 3 ตัว แล้วแตะเลือกชื่อของท่านจากรายการ</p>}
            </div>
            {/* ชื่อ-นามสกุล */}
            <div>
              <label className="block text-slate-400 text-sm font-semibold mb-1">ชื่อ-นามสกุล<span className="text-red-400 ml-1">*</span></label>
              <input value={form.fullName} onChange={e=>setF("fullName",e.target.value)}
                readOnly={autoFilled} placeholder="เช่น นาย ชื่อ-นามสกุล"
                className={`w-full border-2 text-white px-4 py-2.5 rounded-lg focus:outline-none transition-colors ${autoFilled?"bg-slate-800/50 border-emerald-500/40 text-slate-300 cursor-not-allowed":"bg-slate-900/80 border-slate-700 focus:border-emerald-500"}`}/>
            </div>
            {/* ตำแหน่ง */}
            <div>
              <label className="block text-slate-400 text-sm font-semibold mb-1">ตำแหน่ง<span className="text-red-400 ml-1">*</span></label>
              <input value={form.position} onChange={e=>setF("position",e.target.value)}
                readOnly={autoFilled} placeholder="เช่น พชง.3, ชชง, คนงาน"
                className={`w-full border-2 text-white px-4 py-2.5 rounded-lg focus:outline-none transition-colors ${autoFilled?"bg-slate-800/50 border-emerald-500/40 text-slate-300 cursor-not-allowed":"bg-slate-900/80 border-slate-700 focus:border-emerald-500"}`}/>
            </div>
            {/* สังกัด */}
            <div>
              <label className="block text-slate-400 text-sm font-semibold mb-1">สังกัด / แผนก<span className="text-red-400 ml-1">*</span></label>
              <input value={form.department} onChange={e=>setF("department",e.target.value)}
                readOnly={autoFilled} placeholder="เช่น ผกส., ผปบ., ผมต."
                className={`w-full border-2 text-white px-4 py-2.5 rounded-lg focus:outline-none transition-colors ${autoFilled?"bg-slate-800/50 border-emerald-500/40 text-slate-300 cursor-not-allowed":"bg-slate-900/80 border-slate-700 focus:border-emerald-500"}`}/>
            </div>
            {/* ปุ่มปลดล็อก */}
            {autoFilled&&(
              <button type="button" onClick={()=>setAutoFilled(false)}
                className="w-full bg-slate-700/60 border border-slate-600 text-slate-400 text-xs font-semibold py-2 rounded-lg hover:bg-slate-700 hover:text-white transition-colors flex items-center justify-center gap-1.5">
                <ILock sz={12}/>ข้อมูลถูกล็อกอัตโนมัติ — กดที่นี่เพื่อแก้ไข
              </button>
            )}
          </div>
          <div className="mt-4 bg-slate-900/50 border border-slate-700 rounded-lg p-3 text-xs text-slate-400 space-y-1">
            <p className="text-slate-300 font-semibold flex items-center"><IAlert sz={13} cl="text-yellow-400 mr-1.5"/>เงื่อนไขการลงทะเบียน</p>
            <p className="flex items-center"><IClock sz={12} cl="text-emerald-400 mr-1.5"/>เวลา {loc.timeStart||TIME_START} - {loc.timeEnd||TIME_END} น.</p>
            <p className="flex items-center"><IMapPin sz={12} cl="text-emerald-400 mr-1.5"/>ต้องอยู่ภายในรัศมี {loc.displayDist||20} เมตร จากจุดลงทะเบียน</p>
            <p className="flex items-center"><ICamera sz={12} cl="text-emerald-400 mr-1.5"/>ต้องถ่ายรูปยืนยันตัวตน</p>
          </div>
          <button
            onClick={()=>{
              if(!cleanEmpId(form.empId)||!form.fullName.trim()||!form.position.trim()||!form.department.trim()){
                alert("กรุณากรอกข้อมูลให้ครบทุกช่องครับ"); return;
              }
              setStep("photo");

                  {camErr==="permission" ? "ยังไม่ได้อนุญาตให้เข้าถึงกล้อง"

                </p>

                {camErr==="permission" && (
                  <div className="space-y-2 text-sm">
                    <p className="text-white font-bold">วิธีเปิดอนุญาตกล้อง:</p>
                    <div className="bg-slate-900/60 rounded-lg p-3 space-y-1.5 text-slate-300">
                      <p className="text-emerald-400 font-bold">🤖 Android (Samsung / ทั่วไป)</p>
                      <p>1. กดปุ่ม <span className="text-white font-bold">⋮ (สามจุด)</span> มุมขวาบนของเบราว์เซอร์</p>
                      <p>2. เลือก <span className="text-white font-bold">การตั้งค่า → การอนุญาตไซต์</span></p>
                      <p>3. กด <span className="text-white font-bold">กล้อง → อนุญาต</span></p>
                      <p>4. กลับมาที่หน้านี้แล้วกด <span className="text-white font-bold">"ลองใหม่"</span></p>
                    </div>
                    <div className="bg-slate-900/60 rounded-lg p-3 space-y-1.5 text-slate-300 mt-2">
                      <p className="text-emerald-400 font-bold">🔒 วิธีเร็วกว่า (Android Chrome)</p>
                      <p>1. กดไอคอน <span className="text-white font-bold">🔒 หรือ ⓘ</span> ซ้ายของ address bar</p>
                      <p>2. กด <span className="text-white font-bold">สิทธิ์ → กล้อง → อนุญาต</span></p>
                      <p>3. กด <span className="text-white font-bold">"ลองใหม่"</span> ด้านล่าง</p>
                    </div>
                    <div className="bg-slate-900/60 rounded-lg p-3 space-y-1.5 text-slate-300 mt-2">
                      <p className="text-sky-400 font-bold">📱 iPhone (Safari)</p>

                      <p>3. กลับมา Refresh หน้านี้ แล้วลองใหม่</p>

                {camErr==="other" && (
                  <div className="text-sm text-slate-300 space-y-2">

                    <div className="bg-slate-900/60 rounded-lg p-3 space-y-1.5">
                      <p className="text-white font-bold">วิธีที่ 1 (ง่ายที่สุด)</p>

                    </div>
                    <div className="bg-slate-900/60 rounded-lg p-3 space-y-1.5">
                      <p className="text-white font-bold">วิธีที่ 2 (ถ้ายังไม่ได้)</p>
                      <p>กด Home แล้วกลับมาที่หน้านี้ใหม่ โดยไม่ต้องปิดแอพใดๆ</p>

                    <div className="bg-slate-900/60 rounded-lg p-3 space-y-1.5">

                      <path d="M23 20v-6h-6"/>
                      <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10"/>
                      <path d="M3.51 15a9 9 0 0 0 14.85 3.36L23 14"/>
                    </svg>
                  </button>
                </div>

                <div className="flex space-x-3">
                  <button onClick={()=>{stopCam();setStep("form");}} className="flex-1 bg-slate-700 text-white font-bold py-3 rounded-lg hover:bg-slate-600">← กลับ</button>

                    <ICamera sz={18} cl="inline mr-2"/>ถ่ายรูป
                  </button>
                </div>
                <p className="text-center text-slate-500 text-xs">ระบบตรวจจับใบหน้าอัตโนมัติ • หรือกดปุ่ม "ถ่ายรูป" เพื่อถ่ายเอง</p>

                  <div className="absolute top-2 right-2 bg-emerald-500/90 text-slate-900 px-2.5 py-0.5 rounded-full text-xs font-bold">✓ ถ่ายแล้ว</div>
                </div>
                {/* ผลตรวจใบหน้า */}
                {faceChk==="checking" && <p className="text-center text-slate-400 text-xs -mt-1">🔍 กำลังตรวจว่าเห็นใบหน้าชัดเจน…</p>}
                {faceChk==="ok" && <p className="text-center text-emerald-400 text-xs font-semibold -mt-1">✓ พบใบหน้าในรูป</p>}
                {faceChk==="noface" && (
                  <div className="bg-red-500/10 border-2 border-red-500/50 rounded-xl p-3 text-sm">

                  </div>
                )}
                <div ref={confirmRef} className="flex space-x-3">
                  {faceChk==="noface"

                        <button onClick={retake} className="flex-1 bg-slate-700 text-white font-bold py-4 rounded-lg">ถ่ายใหม่</button>
                        <button onClick={confirmSubmit} disabled={confirmWait} style={{flex:2}} className="bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-900 font-black py-4 rounded-lg text-lg shadow-lg shadow-emerald-500/30 disabled:opacity-80">
                          {confirmWait ? "กำลังตรวจใบหน้า…" : "ยืนยันลงทะเบียน →"}
                        </button>
                      </>}
                </div>
                {faceChk==="noface" && noFaceCount>=FACE_BYPASS_AFTER && (
                  <button onClick={handleSubmit} className="w-full text-slate-400 text-xs underline py-1">
                    ถ่ายแล้วยังไม่ผ่าน? กดที่นี่เพื่อลงทะเบียนต่อ (แอดมินจะตรวจรูปภายหลัง)
                  </button>
                )}
                {/* พื้นที่ว่างด้านล่าง ให้เลื่อนปุ่มยืนยันขึ้นมากลางจอได้ (ไม่ถูกแถบเบราว์เซอร์บัง) */}
                <div aria-hidden="true" style={{height:"20vh"}}/>
              </div>
            )}
            <canvas ref={canRef} className="hidden"/>
          </div>
        </div>
      );

      // ── SUBMITTING ──
      if(step==="submitting") return (
        <div className="bg-slate-800/50 backdrop-blur-lg border border-emerald-500/30 rounded-2xl p-10 shadow-2xl text-center">
          <ISpin sz={56} cl="text-emerald-400 mx-auto mb-5"/>
          <p className="text-white font-bold text-lg mb-1">กำลังดำเนินการ...</p>
          <p className="text-emerald-400 text-sm">{saveMsg}</p>

            <p><span className="text-slate-500">ตำแหน่ง:</span> <span className="text-white">{savedAtt?.position}</span></p>
            <p><span className="text-slate-500">สังกัด:</span> <span className="text-white">{savedAtt?.department}</span></p>
            <p><span className="text-slate-500">หน่วยงาน:</span> <span className="text-emerald-400 font-bold">{loc.name}</span></p>

            <p><span className="text-slate-500">เวลา:</span> <span className="text-white">{thaiDT(new Date())}</span></p>
            {savedAtt?.photoURL&&<img src={savedAtt.photoURL} alt="saved" className="w-full max-h-48 object-cover rounded-lg mt-2 border border-emerald-500/30"/>}
          </div>
          <button onClick={reset} className="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-900 font-black py-4 rounded-lg text-lg mb-3">
            ลงทะเบียนคนถัดไป
          </button>
          <button onClick={onOpenDash}
            className="w-full bg-slate-700/80 border border-emerald-500/30 text-emerald-400 font-bold py-3 rounded-lg flex items-center justify-center gap-2 hover:bg-slate-700 hover:border-emerald-500/60 transition-all active:scale-95">
            <span className="text-lg">📊</span>
            <span>ดูสถานะการเข้าร่วมของฉัน</span>
            <span className="text-xs font-black ml-1">→</span>
          </button>
          {permTip && (
            <details className="mt-4 bg-sky-500/10 border border-sky-500/30 rounded-xl p-3 text-left text-sm">
              <summary className="text-sky-300 font-bold cursor-pointer">💡 ไม่อยากให้ถาม "อนุญาตกล้อง / ตำแหน่ง" ทุกครั้ง?</summary>
              <div className="mt-2 space-y-2 text-slate-300 text-xs leading-relaxed">
                {isIOSDevice ? (<>
                  <p className="text-white font-bold">📱 iPhone (Safari) — ตั้งค่าครั้งเดียว</p>
                  <ol className="list-decimal pl-5 space-y-1">
                    <li>แตะปุ่มเมนู <b>≡</b> หรือ <b>aA</b> ที่ช่องที่อยู่เว็บ</li>
                    <li>เลือก <b>การตั้งค่าเว็บไซต์</b> (Website Settings)</li>
                    <li><b>กล้อง</b> → เลือก <b>อนุญาต</b></li>
                    <li><b>ตำแหน่งที่ตั้ง</b> → เลือก <b>อนุญาต</b></li>

                  <p className="text-white font-bold">📱 Android (Chrome)</p>
                  <ol className="list-decimal pl-5 space-y-1">

                <div className="bg-slate-800/60 rounded-lg p-3">
                  <p className="text-emerald-400 font-bold mb-1">📱 iPhone (iOS)</p>

                </div>
                <div className="bg-slate-800/60 rounded-lg p-3">
                  <p className="text-amber-400 font-bold mb-1">🌐 หรือทำในเบราว์เซอร์</p>

                </div>
              </div>
            </>}

            {err==="POSITION_UNAVAILABLE" && <>
              <p className="text-white font-bold text-sm mb-3">วิธีแก้ไข:</p>
              <div className="space-y-2 text-sm text-slate-300">
                <div className="bg-slate-800/60 rounded-lg p-3">
                  <p className="text-emerald-400 font-bold mb-1">📱 iPhone</p>
                  <p>การตั้งค่า → Privacy & Security → Location Services → <span className="text-white font-bold">เปิดสวิตช์</span></p>
                </div>
                <div className="bg-slate-800/60 rounded-lg p-3">
                  <p className="text-emerald-400 font-bold mb-1">🤖 Android</p>

                </div>

                </div>
              </div>

            className="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-slate-900 font-black py-4 rounded-lg hover:shadow-lg hover:shadow-amber-500/50 text-lg mb-3">

        const groups=[]; let cur=null;

          const mo=d.slice(0,7);
          if(!cur||cur.mo!==mo){cur={mo,count:1,label:MONTHS[parseInt(mo.slice(5))-1]};groups.push(cur);}

        // cell — ขนาดพอดี สไตล์ Dashboard

        const monHdr = groups.map(g=>

        ).join("");

        const dateHdr = dateList.map(d=>{

        const memberRows = memberList.map((m,i)=>{

          return `<td style="text-align:center;border-left:1px solid #0f172a;font-size:7px;font-weight:900;color:${c}">${pct}%</td>`;
        }).join("");
        const totalPct = (()=>{let tp=0,tt=0;memberList.forEach(m=>{const p=getPct(m);if(p!==null){tp+=p;tt++;}});return tt>0?Math.round(tp/tt)+"%":"—";})();
        const sumRow = `<tr style="background:#0f172a;border-top:2px solid #334155"><td style="padding:2px 5px;font-size:10px;font-weight:900;color:#34d399">รวม</td><td></td><td></td>${sumCells}<td style="text-align:center;border-left:2px solid #f59e0b60;font-size:11px;font-weight:900;color:#f59e0b">${totalPct}</td></tr>`;

        let outsiderHtml="";

          outsiderHtml=`<tr style="background:#1c1240"><td colspan="${3+dateList.length+1}" style="padding:3px 6px;font-weight:bold;color:#f59e0b;font-size:10px">⚠️ พบ ${outsiders.length} คน ที่ลงทะเบียนแต่ยังไม่อยู่ในฐานข้อมูล</td></tr>`;
          outsiderHtml+=outsiders.map((a,i)=>{
            const cells=dateList.map(d=>{const hit=getOutsiderHit(a,d);const s=hit?"P":"F";return `<td style="text-align:center;padding:0;border-left:1px solid #0f172a;border-bottom:1px solid #0f172a;background:${cellBg(s)};color:${cellFg(s)};font-size:8px;font-weight:900;width:14px;line-height:14px">${cellCh(s)}</td>`;}).join("");
            return `<tr style="background:#150d2e"><td style="padding:2px 5px;font-size:11px;color:#fcd34d;white-space:nowrap">${esc(a.fullName||"—")}</td><td style="padding:2px 4px;font-size:10px;color:#e2e8f0">${esc(a.position||"—")}</td><td style="padding:2px 4px;font-size:10px;color:#94a3b8">${esc(a.department||"—")}</td>${cells}<td style="text-align:center;color:#64748b;border-left:2px solid #f59e0b60;font-size:11px">—</td></tr>`;

        }

        locName = esc(locName); locFull = esc(locFull);
        return `<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><title>Safety Talk — ${locName}</title>
<style>
