  .an-sub{color:#64748b;font-size:9px;margin:0 0 6px}
  .an-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .an-lbl{font-size:9px;font-weight:600;color:#94a3b8;text-align:right;width:90px;min-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .an-bar-wrap{flex:1;display:flex;align-items:center;gap:6px;height:14px}
  .an-track{flex:1;background:#1e293b;border-radius:0 3px 3px 0;height:14px;position:relative;overflow:hidden}
  .an-fill{height:14px;border-radius:0 3px 3px 0;transition:width .5s}
  .an-val{font-size:9px;font-weight:900;white-space:nowrap;min-width:50px}
  .an-gauge-wrap{margin-top:6px}
  .an-gauge-label{display:flex;justify-content:space-between;font-size:9px;color:#64748b;margin-bottom:2px}
  .an-gauge-label .mid{color:#e2e8f0;font-weight:bold}
  .an-gauge{background:#1e293b;border-radius:4px;height:8px;overflow:hidden}
  .an-gauge-fill{height:8px;border-radius:4px}
  @media print{html,body{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;background:#0f172a!important}}
</style>
</head><body>
<h1>รายงานผลการเข้าร่วมกิจกรรม Safety Talk</h1>
<h2>${locName} — ${locFull}</h2>
<div class="meta">พิมพ์เมื่อ ${thaiDate} • ${memberList.length} คน • ${dateList.length} วันกิจกรรม</div>
${analyticsHtml}
<table>
<thead>
<tr>
  <th style="width:160px;font-size:10px;color:#94a3b8;padding:3px 5px;text-align:left;background:#1e293b;border-right:1px solid #0f172a" rowspan="2">ชื่อ-นามสกุล</th>
  <th style="width:70px;font-size:10px;color:#94a3b8;padding:3px 4px;background:#1e293b;border-right:1px solid #0f172a" rowspan="2">ตำแหน่ง</th>

  ${monHdr}

    // ============ PUBLIC ANALYTICS (embed ใน PublicDashboard) ============
    function PublicAnalytics({ atts, attsLoading, locs, selLoc, onStatsReady }) {
      const { useState, useMemo, useEffect } = React;
      const [members, setMembers] = useState({});
      const [safeDates, setSafeDates] = useState({});
      const [overrides, setOverrides] = useState({});
      const [loading, setLoading] = useState(true);

      useEffect(()=>{
        const locIds = Object.keys(locs);
        Promise.all([
          db.collection("settings").doc("safetydates").get(),
          ...locIds.map(id=>db.collection("personnel").where("locationId","==",id).get()),
          ...locIds.map(id=>db.collection("overrides").doc(id).get()),
        ]).then(results=>{
          const [sdDoc,...rest] = results;
          const sdData = sdDoc.exists ? sdDoc.data()||{} : {};
          const membSnaps = rest.slice(0,locIds.length);
          const ovSnaps   = rest.slice(locIds.length);
          const memMap={}, ovMap={};
          locIds.forEach((id,i)=>{ memMap[id]=membSnaps[i].docs.map(d=>({id:d.id,...d.data()})); ovMap[id]=ovSnaps[i].exists?ovSnaps[i].data()||{}:{}; });
          setMembers(memMap); setSafeDates(sdData); setOverrides(ovMap); setLoading(false);
        }).catch(()=>setLoading(false));
      },[]);

      const attIdx = useMemo(()=>buildAttIndex(atts),[atts]);

      const calcPct = (m, locId) => {
        const ov = overrides[locId]||{};
        const today = todayStr();
        const dates = (safeDates[locId]||[]).filter(d=>d<=today);
        if(dates.length===0) return null;
        let p=0,total=0;
        dates.forEach(d=>{
          const key=(m.empId?m.empId:m.id)+"_"+d; let s;
          if(ov[key]==="P") s="P"; else if(ov[key]==="O") s="O"; else if(ov[key]==="E") s="E";
          else { s=attHit(attIdx,locId,d,m)?"P":"O"; }
          if(s!=="E"){total++;if(s==="P")p++;}
        });
        return total>0?Math.round(p/total*100):null;
      };

      const locStats = useMemo(()=>Object.keys(locs).map(locId=>{
        const mems=members[locId]||[];
        const pcts=mems.map(m=>calcPct(m,locId)).filter(p=>p!==null);
        const avg=pcts.length>0?Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length):null;
        return {locId, name:locs[locId]?.name||locId, avg, count:mems.length};
      }),[members,safeDates,overrides,atts]);

      const MULTI_DEPT_LOCS = [
        {locId:"lampun",label:"กฟจ.ลำพูน"},{locId:"pasang",label:"กฟส.ป่าซาง"},
        {locId:"banhong",label:"กฟส.บ้านโฮ่ง"},{locId:"li",label:"กฟส.ลี้"},{locId:"banthi",label:"กฟส.บ้านธิ"},
      ];
      const deptStatsFor = (locId) => {
        const mems=members[locId]||[]; if(mems.length===0) return [];
        const dm={};
        mems.forEach(m=>{ const d=m.department||"ไม่ระบุ"; if(!dm[d])dm[d]=[]; dm[d].push(m); });
        const res=Object.entries(dm).map(([dept,list])=>{ const pcts=list.map(m=>calcPct(m,locId)).filter(p=>p!==null); const avg=pcts.length>0?Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length):null; return {dept,avg,count:list.length}; }).filter(d=>d.avg!==null).sort((a,b)=>(b.avg||0)-(a.avg||0));
        return res.length>=2?res:[];
      };
      const deptAll = useMemo(()=>{ const m={}; MULTI_DEPT_LOCS.forEach(({locId})=>{m[locId]=deptStatsFor(locId);}); return m; },[members,safeDates,overrides,atts]);

      const barColor = pct => pct===null?"#475569":pct>=80?"#22c55e":pct>=50?"#f59e0b":"#ef4444";
      const barLabel = pct => pct===null?"—":pct+"%";
      // useMemo สำคัญ: ถ้าสร้าง array ใหม่ทุก render → useEffect ด้านล่างจะเรียก onStatsReady → parent render → วนไม่จบ
      const sorted = useMemo(()=>[...locStats].sort((a,b)=>(b.avg||0)-(a.avg||0)),[locStats]);
      const overall = useMemo(()=>{ const all=locStats.map(l=>l.avg).filter(p=>p!==null); return all.length>0?Math.round(all.reduce((a,b)=>a+b,0)/all.length):null; },[locStats]);

      // แจ้ง parent เมื่อ stats พร้อม
      const { useEffect: ue } = React;
      ue(()=>{
        if(!loading && !attsLoading && locStats.length>0 && onStatsReady) {
          onStatsReady({ sorted, overall, deptAll, selLoc, barColor, barLabel });
        }
      },[loading, attsLoading, sorted, overall, deptAll, selLoc]);

      const HBar = ({data,labelKey,valueKey}) => (
        <div className="space-y-2">
          {data.map((d,i)=>{
            const pct=d[valueKey]; const col=barColor(pct);
            const isActive = d.locId===selLoc || !d.locId;
            return (
              <div key={i} className="flex items-center gap-2">
                <div className="text-xs font-semibold truncate" style={{width:"100px",minWidth:"100px",textAlign:"right",color:isActive?"#34d399":"#94a3b8"}}>{d[labelKey]}</div>
                <div className="flex-1 flex items-center gap-2" style={{height:"22px"}}>
                  <div className="relative flex-1 h-full">
                    <div className="absolute inset-0 bg-slate-800/50 rounded-r-md"></div>
                    <div className="absolute inset-y-0 left-0 rounded-r-md transition-all duration-700" style={{width:pct!==null?(pct===100?"calc(100% - 2px)":pct+"%"):"0%",background:col,opacity:isActive?1:0.6,maxWidth:"100%"}}></div>
                  </div>
                  <div className="text-xs font-black whitespace-nowrap" style={{minWidth:"55px",color:col}}>
                    {d.count&&<span className="text-slate-500 font-normal mr-1">{d.count} คน</span>}
                    {barLabel(pct)}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      );

      if(loading || attsLoading || (members && Object.keys(members).length===0)) return <div className="py-8 text-center"><ISpin sz={28} cl="text-emerald-400"/></div>;

      return (
        <div className="mt-8 space-y-5">
          <div className="bg-slate-800/50 border border-emerald-500/20 rounded-2xl p-4">
            <h3 className="text-emerald-400 font-black text-sm mb-0.5 flex items-center gap-2">📈 วิเคราะห์ภาพรวม Safety Talk</h3>
            <p className="text-slate-500 text-xs mb-3">ภาพรวมทั้ง 10 หน่วยงาน สะสมถึงวันนี้</p>

            {/* summary badges */}
            <div className="flex flex-wrap gap-2 mb-4">
              {[
                {label:"% เฉลี่ยรวม", val:overall!==null?overall+"%":"—", col:barColor(overall)},
                {label:"บุคลากร", val:locStats.reduce((s,l)=>s+l.count,0)+" คน", col:"#a78bfa"},
              ].map((c,i)=>(
                <div key={i} className="bg-slate-900/60 rounded-xl px-3 py-2 text-center">
                  <div className="font-black text-lg" style={{color:c.col}}>{c.val}</div>
                  <div className="text-slate-500 text-xs">{c.label}</div>
                </div>
              ))}
            </div>

            {/* chart ทุกหน่วยงาน */}
            <h4 className="text-slate-300 font-bold text-xs mb-2">🏢 เปรียบเทียบทั้ง 10 หน่วยงาน</h4>
            <HBar data={sorted} labelKey="name" valueKey="avg" />

            {/* gauge */}
            <div className="mt-3 pt-3 border-t border-slate-700">
              <div className="flex justify-between text-xs text-slate-500 mb-1">
                <span>0%</span><span className="font-bold text-slate-300">ภาพรวม {overall!==null?overall+"%":"—"}</span><span>100%</span>
              </div>
              <div className="w-full bg-slate-700 rounded-full h-2.5 overflow-hidden">
                <div className="h-2.5 rounded-full" style={{width:overall!==null?overall+"%":"0%",background:barColor(overall)}}></div>
              </div>
            </div>
          </div>

          {/* กราฟแยกแผนก เฉพาะหน่วยงานที่กำลังดู (ถ้ามีหลายแผนก) */}
          {MULTI_DEPT_LOCS.filter(l=>l.locId===selLoc).map(({locId,label})=>{
            const data = deptAll[locId]||[];
            if(data.length===0) return null;
            return (
              <div key={locId} className="bg-slate-800/50 border border-slate-700 rounded-2xl p-4">
                <h4 className="text-slate-300 font-bold text-xs mb-2">🏛️ {label} — แยกแผนก/สังกัด</h4>
                <HBar data={data} labelKey="dept" valueKey="avg" />
              </div>
            );
          })}
        </div>
      );
    }

    // ============ PUBLIC DASHBOARD (read-only, ไม่ต้อง login) ============
    function PublicDashboard({ locs, atts, attsLoading, attsErr, curLoc, onBack }) {
      const [selLoc,setSelLoc]       = useState(curLoc);
      const [analyticsStats,setAnalyticsStats] = useState(null);
      const [members,setMembers]     = useState([]);
      const [safeDates,setSafeDates] = useState([]);
      const [overrides,setOverrides] = useState({});
      const [loadingD,setLoadingD]   = useState(false);
      const loadReq = useRef(0); // กันข้อมูลหน่วยงานเก่าทับ ถ้ากดสลับหน่วยงานเร็วๆ

      const loadAll = async (locId) => {
        const my = ++loadReq.current;
        setLoadingD(true);
        try {
          const [snapP, docSD, docOV] = await Promise.all([
            db.collection("personnel").where("locationId","==",locId).get(),
            db.collection("settings").doc("safetydates").get(),
            db.collection("overrides").doc(locId).get(),
          ]);
          if(my!==loadReq.current) return;
          setMembers(sortPersonnel(snapP.docs.map(d=>({id:d.id,...d.data()}))));
          const sd = docSD.exists ? (docSD.data()[locId]||[]) : [];
          setSafeDates(sd.sort());
          const ov = docOV.exists ? docOV.data() : {};
          setOverrides(ov);
        } catch(e){ console.error(e); }
        finally { if(my===loadReq.current) setLoadingD(false); }
      };

      useEffect(()=>{ loadAll(selLoc); },[selLoc]);

      const memberKey = m => m.empId ? m.empId : m.id;

      const attIdx = useMemo(()=>buildAttIndex(atts),[atts]);
      const attOnDate = (m, date) => attHit(attIdx, selLoc, date, m);

      const getCellStatus = (m, date) => {
        const key = memberKey(m)+"_"+date;
        const v = overrides[key];
        if(v==="P"||v==="O"||v==="E") return v;
        if(isFuture(date)) return "F";
        return attOnDate(m,date)?"P":"O";
      };

      const calcPct = (m) => {
        let p=0,total=0;
        safeDates.forEach(d=>{ const s=getCellStatus(m,d); if(s!=="E"&&s!=="F"){total++;if(s==="P")p++;} });
        return total===0?null:Math.round(p/total*100);
      };

      const fmtDate = (iso) => {
        const d=new Date(iso+"T00:00:00");
        const mo=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
        return d.getDate()+"\n"+mo[d.getMonth()];
      };

      const cellBg  = s => s==="P"?"bg-emerald-500":s==="E"?"bg-slate-600":s==="F"?"bg-slate-700/50":"bg-red-500/80";
      const cellTxt = s => s==="P"?"✓":s==="E"?"–":s==="F"?"·":"✗";

      // คนนอกฐานข้อมูล
      const pubOutsiderDates = useMemo(()=>{
        const isMember = memberMatcher(members);
        const result={};
        safeDates.forEach(d=>{ result[d]=attsOn(attIdx,selLoc,d).filter(a=>!isMember(a)); });
        return result;
      },[attIdx,members,safeDates,selLoc]);

      const pubOutsiders = useMemo(()=>{
        const seen=new Set(), list=[];
        safeDates.forEach(d=>{
          (pubOutsiderDates[d]||[]).forEach(a=>{ const key=(a.empId||"")+"__"+(a.fullName||""); if(!seen.has(key)){seen.add(key);list.push(a);} });
        });
        return list;
      },[pubOutsiderDates,safeDates]);

      // Export PDF (PublicDashboard)
      const exportPDF = () => {
        // สร้าง analytics HTML สำหรับ PDF
        const buildAnalyticsPDF = () => {
          if(!analyticsStats) return "";
          const { sorted, overall, deptAll, barColor, barLabel } = analyticsStats;
          const bc = pct => pct===null?"#475569":pct>=80?"#22c55e":pct>=50?"#f59e0b":"#ef4444";
          const bl = pct => pct===null?"—":pct+"%";
          const rows10 = (sorted||[]).map(d=>{
            const pct=d.avg; const col=bc(pct);
            const isMe = d.locId===selLoc;
            return `<div class="an-row"><div class="an-lbl" style="color:${isMe?"#34d399":"#94a3b8"}">${esc(d.name)}</div><div class="an-bar-wrap"><div class="an-track"><div class="an-fill" style="width:${pct!==null?pct:0}%;background:${col}"></div></div><div class="an-val" style="color:${col}">${d.count} คน ${bl(pct)}</div></div></div>`;
          }).join("");
          const g = overall!==null?`<div class="an-gauge-wrap"><div class="an-gauge-label"><span>0%</span><span class="mid">ภาพรวมทุกหน่วยงาน ${overall}%</span><span>100%</span></div><div class="an-gauge"><div class="an-gauge-fill" style="width:${overall}%;background:${bc(overall)}"></div></div></div>`:"";
          const deptLocName = (locs[selLoc]||{}).name||selLoc;
          const deptData = deptAll&&deptAll[selLoc]||[];
          const deptRows = deptData.length>=2 ? deptData.map(d=>{
            const pct=d.avg; const col=bc(pct);
            return `<div class="an-row"><div class="an-lbl">${esc(d.dept)}</div><div class="an-bar-wrap"><div class="an-track"><div class="an-fill" style="width:${pct!==null?pct:0}%;background:${col}"></div></div><div class="an-val" style="color:${col}">${d.count} คน ${bl(pct)}</div></div></div>`;
          }).join("") : "";
          const deptSection = deptRows ? `<div class="an-wrap"><p class="an-title">🏛️ ${esc(deptLocName)} — แยกแผนก/สังกัด</p>${deptRows}</div>` : "";
          return `<div class="an-wrap"><p class="an-title">📈 วิเคราะห์ภาพรวม Safety Talk — เปรียบเทียบทั้ง 10 หน่วยงาน</p><p class="an-sub">เรียงจากมากไปน้อย • สะสมถึงวันนี้ • ภาพรวม: ${overall!==null?overall+"%":"—"}</p>${rows10}${g}</div>${deptSection}`;
        };

        const html = buildDashboardPDF({
          locName:  locs[selLoc]?.name || selLoc,
          locFull:  locs[selLoc]?.fullName || "",
          memberList: members,
          dateList: safeDates,
          getStatus: (m,d) => getCellStatus(m,d),
          getPct: (m) => calcPct(m),
          getSummaryPct: (d) => {
            if(isFuture(d)) return null;
            let p=0,total=0;
            members.forEach(m=>{ const s=getCellStatus(m,d); if(s!=="E"&&s!=="F"){total++;if(s==="P")p++;} });
            return total>0?Math.round(p/total*100):null;
          },
          outsiders: pubOutsiders,
          getOutsiderHit: (a,d) => (pubOutsiderDates[d]||[]).some(x=>{
            if(a.empId&&x.empId&&a.empId.toString().trim()===x.empId.toString().trim()) return true;
            if(a.fullName&&x.fullName&&a.fullName.trim()===x.fullName.trim()) return true;
            return false;
          }),
          analyticsHtml: buildAnalyticsPDF(),
        });
        const w=window.open("","_blank","width=1000,height=700");
        if(!w){alert("กรุณาอนุญาต Pop-up สำหรับเว็บนี้ก่อนครับ");return;}
        try { w.opener = null; } catch(e){} // หน้า PDF ไม่ต้องเข้าถึงหน้าหลัก
        w.document.write(html); w.document.close();
        w.onload=()=>{w.focus();w.print();};
      };

      const loc = locs[selLoc]||Object.values(locs)[0];
      const dataLoading = loadingD || attsLoading;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
          <div className="max-w-7xl mx-auto px-3 py-4">

            {/* Header bar */}
            <div className="flex items-center justify-between mb-4">
              <div className="flex items-center gap-3">
                <button onClick={onBack}
                  className="bg-slate-700 text-white font-bold px-4 py-2 rounded-xl hover:bg-slate-600 text-sm flex items-center gap-2 active:scale-95">

                </button>
                <div>
                  <h1 className="text-lg font-black text-emerald-400">📊 Dashboard ข้อมูลการเข้าร่วม Safety Talk</h1>

                📄 Export PDF
              </button>
            </div>

            {attsErr && (
              <div className="bg-red-500/10 border border-red-500/40 rounded-xl p-3 mb-4 text-sm text-red-300">
                ⚠️ โหลดข้อมูลการลงทะเบียนไม่สำเร็จ — ตัวเลขด้านล่างอาจไม่ถูกต้อง กรุณากด "← กลับ" แล้วเข้าใหม่อีกครั้ง
              </div>

            {/* เลือกหน่วยงาน */}
            <div className="bg-slate-800/50 border border-emerald-500/20 rounded-2xl p-4 mb-4">
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2 mb-3">
                {Object.values(locs).map(l=>(

                    className={`px-3 py-2 rounded-xl font-bold text-xs transition-all text-center ${selLoc===l.id?"bg-emerald-500 text-slate-900 shadow-lg shadow-emerald-500/50":"bg-slate-700 text-slate-300 hover:bg-slate-600"}`}>
                    {l.name}
                  </button>
                ))}
              </div>
              <div className="p-2 bg-slate-900/50 rounded-lg flex items-center justify-between">
                <div>
                  <p className="text-emerald-400 font-bold text-sm">{loc.name}</p>
                  <p className="text-slate-400 text-xs">{loc.fullName} — {members.length} คน • {safeDates.length} วันกิจกรรม</p>
                </div>
              </div>
            </div>

            {/* Analytics section — อยู่ระหว่างแท็บและตาราง */}
            <PublicAnalytics atts={atts} attsLoading={attsLoading} locs={locs} selLoc={selLoc} onStatsReady={setAnalyticsStats} />

            {/* คำอธิบาย */}
            <div className="bg-slate-800/30 border border-slate-700 rounded-xl p-3 mb-4 flex flex-wrap gap-4 text-xs text-slate-400">
              <span className="flex items-center gap-1"><span className="bg-emerald-500 text-white font-black w-6 h-6 rounded flex items-center justify-center text-xs">✓</span> เข้าร่วม</span>
              <span className="flex items-center gap-1"><span className="bg-red-500/80 text-white font-black w-6 h-6 rounded flex items-center justify-center text-xs">✗</span> ไม่เข้าร่วม</span>
              <span className="flex items-center gap-1"><span className="bg-slate-600 text-slate-400 font-black w-6 h-6 rounded flex items-center justify-center text-xs">–</span> ยกเว้น</span>
              <span className="text-emerald-400 font-semibold">%</span><span>= เปอร์เซ็นต์การเข้าร่วมสะสมทั้งปี</span>
            </div>

            {/* ตาราง — รอโหลดการลงทะเบียนให้เสร็จก่อน ไม่งั้นจะเห็นทุกคนเป็น ✗ ชั่วขณะ */}
            {dataLoading
              ?<div className="flex justify-center py-24"><ISpin sz={40} cl="text-emerald-400"/></div>
              :members.length===0||safeDates.length===0
                ?<div className="text-center py-20 text-slate-500 bg-slate-800/30 rounded-2xl">
                  <p className="text-3xl mb-3">📋</p>
                  <p className="text-lg font-bold">{members.length===0?"ยังไม่มีรายชื่อบุคลากร":"ยังไม่มีวันกิจกรรม"}</p>
                  <p className="text-sm mt-1 text-slate-600">ติดต่อแอดมินเพื่อตั้งค่าข้อมูล</p>
                </div>
                :(
                <div className="bg-slate-800/50 border border-emerald-500/30 rounded-2xl shadow-2xl overflow-hidden">
                  <div className="dash-table-wrap">
                    <table className="text-xs dash-table">
                      <thead>
                        <tr className="bg-slate-900/80">
                          <th className="px-1 py-2 text-center text-slate-300 font-bold sticky left-0 bg-slate-900 z-10 border-r border-slate-700 dash-col-name" rowSpan="2">ชื่อ</th>
                          <th className="px-1 py-2 text-center text-slate-300 font-bold sticky bg-slate-900 z-10 border-r border-slate-700 dash-col-pos dash-sticky-pos" rowSpan="2">ตำแหน่ง</th>
                          <th className="px-1 py-2 text-center text-slate-300 font-bold sticky bg-slate-900 z-10 border-r border-slate-700 dash-col-dept dash-sticky-dept" rowSpan="2">แผนก</th>
                          {(()=>{
                            const groups=[];
                            let cur=null;
                            safeDates.forEach(d=>{ const mo=d.slice(0,7); if(!cur||cur.mo!==mo){cur={mo,count:1};groups.push(cur);}else cur.count++; });
                            const MN=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
                            return groups.map(g=>(
                              <th key={g.mo} colSpan={g.count} className="dash-th-month text-center text-emerald-400 font-bold border-l border-slate-700 bg-slate-900/60" style={{fontSize:"9px",padding:"2px 1px"}}>
                                {MN[parseInt(g.mo.slice(5))-1]}<span className="dash-yr-full"> {parseInt(g.mo.slice(0,4))+543}</span><span className="dash-yr-short"> {String(parseInt(g.mo.slice(0,4))+543).slice(-2)}</span>
                              </th>
                            ));
                          })()}
                          <th className="px-1 py-2 text-center text-amber-400 font-bold border-l-2 border-amber-500/40 sticky right-0 bg-slate-900 z-10 dash-col-pct" rowSpan="2">%</th>
                        </tr>
                        <tr className="bg-slate-900/60">
                          {safeDates.map(d=>(
                            <th key={d} className="text-center border-l border-slate-700 text-slate-400 font-semibold" style={{padding:"1px 0",lineHeight:"1",fontSize:"9px"}}>
                              {new Date(d+"T00:00:00").getDate()}
                            </th>
                          ))}
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-700/30">
                        {members.map((m,i)=>{
                          const pct=calcPct(m);
                          return (
                            <tr key={m.id} className={`${i%2===0?"bg-slate-800/20":"bg-slate-900/20"}`}>
                              <td className="px-1 py-1 text-white font-medium sticky left-0 bg-[#1e293b] z-10 border-r border-slate-700/50 overflow-hidden dash-col-name dash-td-text">
                                <div className="truncate dash-td-text">{m.fullName}</div>
                              </td>
                              <td className="px-1 py-1 text-white whitespace-nowrap sticky bg-[#1e293b] z-10 border-r border-slate-700/50 overflow-hidden dash-col-pos dash-td-text dash-sticky-pos">
                                {m.position}
                              </td>
                              <td className="px-1 py-1 text-white whitespace-nowrap sticky bg-[#1e293b] z-10 border-r border-slate-700/50 overflow-hidden dash-col-dept dash-td-text dash-sticky-dept">
                                {m.department}
                              </td>
                              {safeDates.map(d=>{
                                const s=getCellStatus(m,d);
                                return (
                                  <td key={d} className="text-center border-l border-slate-700/30" style={{padding:"1px 0"}}>
                                    <div className={`dash-cell ${cellBg(s)} ${s==="E"||s==="F"?"text-slate-400":"text-white"}`}>
                                      {cellTxt(s)}
                                    </div>
                                  </td>
                                );
                              })}
                              <td className="px-1 py-1 text-center font-black border-l-2 border-amber-500/40 sticky right-0 bg-[#1e293b] z-10 text-xs dash-col-pct"
                                style={{color:pct===null?"#64748b":pct>=80?"#10b981":pct>=50?"#f59e0b":"#ef4444"}}>
                                {pct===null
                                  ? "—"
                                  : <><span style={{display:"block",lineHeight:"1.1",fontSize:"8px",fontWeight:"900"}}>{pct}</span><span style={{display:"block",lineHeight:"1",fontSize:"6px",fontWeight:"700"}}>%</span></>
                                }
                              </td>
                            </tr>
                          );
                        })}
                        {/* แถวสรุปรวมรายวัน */}
                        {members.length>0 && (
                          <tr className="bg-slate-700/40 font-bold border-t-2 border-slate-500">
                            <td className="px-1 py-1.5 text-emerald-400 font-black sticky left-0 bg-slate-700/60 z-10 border-r border-slate-600 dash-col-name" style={{fontSize:"10px"}}>รวม</td>
                            <td className="px-1 py-1 sticky bg-slate-700/60 z-10 border-r border-slate-600 dash-col-pos dash-sticky-pos"></td>
                            <td className="px-1 py-1 sticky bg-slate-700/60 z-10 border-r border-slate-600 dash-col-dept dash-sticky-dept"></td>
                            {safeDates.map(d=>{
                              const isFut = isFuture(d);
                              if(isFut) return <td key={d} className="text-center border-l border-slate-600" style={{padding:"1px 0"}}><span style={{fontSize:"8px",color:"#334155",fontWeight:"900"}}>·</span></td>;
                              let p=0,total=0;
                              members.forEach(m=>{ const s=getCellStatus(m,d); if(s!=="E"&&s!=="F"){total++;if(s==="P")p++;} });
                              const pct=total>0?Math.round(p/total*100):null;
                              return (
                                <td key={d} className="text-center border-l border-slate-600" style={{padding:"1px 0"}}>
                                  {pct===null
                                    ? <span style={{fontSize:"8px",color:"#64748b",display:"block",lineHeight:"1.2"}}>—</span>
                                    : <><span style={{fontSize:"8px",fontWeight:"900",color:pct>=80?"#10b981":pct>=50?"#f59e0b":"#ef4444",display:"block",lineHeight:"1.1"}}>{pct}</span><span style={{fontSize:"6px",fontWeight:"700",color:pct>=80?"#10b981":pct>=50?"#f59e0b":"#ef4444",display:"block",lineHeight:"1"}}>%</span></>
                                  }
                                </td>
                              );
                            })}
                            <td className="px-1 py-1 text-center sticky right-0 bg-slate-700/60 z-10 border-l-2 border-amber-500/40 dash-col-pct">
                              {(()=>{
                                let tp=0,tt=0;
                                members.forEach(m=>{ const pct=calcPct(m); if(pct!==null){tp+=pct;tt++;} });
                                return tt>0?<span style={{fontSize:"10px",fontWeight:"900",color:"#f59e0b"}}>{Math.round(tp/tt)}%</span>:<span style={{color:"#64748b"}}>—</span>;
                              })()}
                            </td>
                          </tr>
                        )}
                        {/* แถวคนนอกฐานข้อมูล */}
                        {pubOutsiders.length>0 && (
                          <>
                            <tr className="bg-amber-500/10 border-t-2 border-amber-500/30">
                              <td colSpan={3+safeDates.length+1} className="px-3 py-2 text-amber-400 font-bold text-xs">
                                ⚠️ พบ {pubOutsiders.length} คน ที่ลงทะเบียนแต่ยังไม่อยู่ในฐานข้อมูล
                              </td>
                            </tr>
                            {pubOutsiders.map((a,i)=>(
                              <tr key={a.id||i} className="bg-amber-500/5">
                                <td className="px-1 py-1 text-amber-300 font-medium sticky left-0 bg-amber-500/5 z-10 border-r border-amber-500/20 overflow-hidden dash-col-name dash-td-text">
                                  {a.fullName||"—"}
                                  {a.empId&&<span className="text-slate-500 text-xs ml-1">({a.empId})</span>}
                                </td>
                                <td className="px-1 py-1 text-white whitespace-nowrap sticky bg-amber-500/5 z-10 border-r border-amber-500/20 overflow-hidden dash-col-pos dash-td-text dash-sticky-pos">

                                </td>
                                <td className="px-1 py-1 text-white whitespace-nowrap sticky bg-amber-500/5 z-10 border-r border-amber-500/20 overflow-hidden dash-col-dept dash-td-text dash-sticky-dept">

                ← กลับหน้าลงทะเบียน
              </button>
            </div>


          </div>
        </div>
      );
    }

    // (isFuture / todayStr ย้ายไปอยู่ส่วน HELPERS ด้านบน — คำนวณวันที่ไทยใหม่ทุกครั้ง)


    // ============ ANALYTICS VIEW ============
    function AnalyticsView({ atts, locs }) {
      const { useState, useMemo, useEffect, useRef } = React;
      const [members, setMembers] = useState({}); // {locId: [{...}]}
      const [safeDates, setSafeDates] = useState({}); // {locId: [...]}
      const [overrides, setOverrides] = useState({}); // {locId: {...}}
      const [loading, setLoading] = useState(true);
      const [selYear, setSelYear] = useState(new Date().getFullYear());

      // โหลด personnel + safedates + overrides ทั้ง 10 หน่วยงาน
      useEffect(()=>{
        const locIds = Object.keys(locs);
        setLoading(true);
        Promise.all([
          db.collection("settings").doc("safetydates").get(),
          ...locIds.map(id=>db.collection("personnel").where("locationId","==",id).get()),
          ...locIds.map(id=>db.collection("overrides").doc(id).get()),
        ]).then(results=>{
          const [sdDoc, ...rest] = results;
          const sdData = sdDoc.exists ? sdDoc.data()||{} : {};
          const membSnaps = rest.slice(0, locIds.length);
          const ovSnaps   = rest.slice(locIds.length);
          const memMap = {}, ovMap = {};
          locIds.forEach((id,i)=>{
            memMap[id] = membSnaps[i].docs.map(d=>({id:d.id,...d.data()}));
            ovMap[id]  = ovSnaps[i].exists ? ovSnaps[i].data()||{} : {};
          });
          setMembers(memMap);
          setSafeDates(sdData);
          setOverrides(ovMap);
          setLoading(false);
        }).catch(e=>{ console.error(e); setLoading(false); });
      },[]);

      const TODAY = todayStr();
      const attIdx = useMemo(()=>buildAttIndex(atts),[atts]);

      // คำนวณ % ของแต่ละคนในหน่วยงาน
      const calcPct = (m, locId) => {
        const ov = overrides[locId]||{};
        const dates = (safeDates[locId]||[]).filter(d=>d<=TODAY);
        if(dates.length===0) return null;
        let p=0, total=0;
        dates.forEach(d=>{
          const key = (m.empId?m.empId:m.id)+"_"+d;
          let s;
          if(ov[key]==="P") s="P";
          else if(ov[key]==="O") s="O";
          else if(ov[key]==="E") s="E";
          else s = attHit(attIdx,locId,d,m)?"P":"O";
          if(s!=="E") { total++; if(s==="P") p++; }
        });
        return total>0 ? Math.round(p/total*100) : null;
      };

      // % รวมของแต่ละหน่วยงาน
      const locStats = useMemo(()=>{
        return Object.keys(locs).map(locId=>{
          const mems = members[locId]||[];
          const pcts = mems.map(m=>calcPct(m,locId)).filter(p=>p!==null);
          const avg = pcts.length>0 ? Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length) : null;
          return { locId, name:locs[locId]?.name||locId, avg, count:mems.length, pcts };
        });
      },[members,safeDates,overrides,atts]);

      // หน่วยงานที่มีหลายแผนก — แสดงกราฟแยกแผนก
      const MULTI_DEPT_LOCS = [
        {locId:"lampun",  label:"กฟจ.ลำพูน"},
        {locId:"pasang",  label:"กฟส.ป่าซาง"},
        {locId:"banhong", label:"กฟส.บ้านโฮ่ง"},
        {locId:"li",      label:"กฟส.ลี้"},
        {locId:"banthi",  label:"กฟส.บ้านธิ"},
      ];
      // helper: คำนวณ % แยกแผนก สำหรับ locId ที่กำหนด
      const calcDeptStats = (locId) => {
        const mems = members[locId]||[];
        if(mems.length===0) return [];
        const deptMap = {};
        mems.forEach(m=>{
          const dept = m.department||"ไม่ระบุ";
          if(!deptMap[dept]) deptMap[dept]=[];
          deptMap[dept].push(m);
        });
        // แสดงเฉพาะแผนกที่มี >= 2 คน หรือถ้ามีแผนกเดียวก็ไม่ต้องแสดง
        const result = Object.entries(deptMap).map(([dept, list])=>{
          const pcts = list.map(m=>calcPct(m,locId)).filter(p=>p!==null);
          const avg = pcts.length>0 ? Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length) : null;
          return {dept, avg, count:list.length};
        }).filter(d=>d.avg!==null).sort((a,b)=>(b.avg||0)-(a.avg||0));
        return result.length >= 2 ? result : []; // ถ้ามีแผนกเดียวไม่ต้องแสดง
      };
      const deptStatsAll = useMemo(()=>{
        const map = {};
        MULTI_DEPT_LOCS.forEach(({locId})=>{ map[locId]=calcDeptStats(locId); });
        return map;
      },[members,safeDates,overrides,atts]);

      const barColor = pct => pct===null?"#475569":pct>=80?"#22c55e":pct>=50?"#f59e0b":"#ef4444";
      const barLabel = pct => pct===null?"—":pct+"%";

      // Bar chart
      const HBarChart = ({data, labelKey, valueKey}) => (
        <div className="space-y-2">
          {data.map((d,i)=>{
            const pct = d[valueKey]; const col = barColor(pct);
            return (
              <div key={i} className="flex items-center gap-2">
                <div className="text-slate-300 text-xs font-semibold truncate" style={{width:"110px",minWidth:"110px",textAlign:"right"}}>{d[labelKey]}</div>
                <div className="flex-1 flex items-center gap-2" style={{height:"24px"}}>
                  <div className="relative flex-1 h-full">
                    <div className="absolute inset-0 bg-slate-800/40 rounded-r-md"></div>
                    <div className="absolute inset-y-0 left-0 rounded-r-md transition-all duration-700" style={{width:pct!==null?(pct===100?"calc(100% - 2px)":pct+"%"):"0%",background:col,maxWidth:"100%"}}></div>
                  </div>
                  <div className="text-xs font-black whitespace-nowrap" style={{minWidth:"60px",color:col}}>
                    {d.count&&<span className="text-slate-500 font-normal mr-1">{d.count} คน</span>}
                    {barLabel(pct)}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      );

      if(loading) return <div className="flex justify-center py-24"><ISpin sz={40} cl="text-emerald-400"/></div>;

      const sorted = [...locStats].sort((a,b)=>(b.avg||0)-(a.avg||0));
      const overall = (()=>{
        const all = locStats.map(l=>l.avg).filter(p=>p!==null);
        return all.length>0 ? Math.round(all.reduce((a,b)=>a+b,0)/all.length) : null;
      })();

      return (
        <div className="space-y-6">
          {/* header */}
          <div className="bg-slate-800/50 border border-emerald-500/30 rounded-2xl p-5 shadow-xl">
            <h2 className="text-xl font-black text-white flex items-center gap-2 mb-1">📈 วิเคราะห์ข้อมูล Safety Talk</h2>
            <p className="text-slate-400 text-sm">เปรียบเทียบ % การเข้าร่วม สะสมถึงวันนี้</p>
          </div>

          {/* Overall summary cards */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            {[
              {label:"% เข้าร่วมเฉลี่ยรวม", value: overall!==null?overall+"%":"—", color: barColor(overall)},
              {label:"จำนวนหน่วยงาน", value:"10", color:"#38bdf8"},
              {label:"บุคลากรทั้งหมด", value: locStats.reduce((s,l)=>s+l.count,0)+" คน", color:"#a78bfa"},
              {label:"วันกิจกรรมสูงสุด", value: Math.max(0,...Object.values(safeDates).map(d=>Array.isArray(d)?d.filter(x=>x<=TODAY).length:0))+" วัน", color:"#34d399"},
            ].map((c,i)=>(
              <div key={i} className="bg-slate-800/60 border border-slate-700 rounded-xl p-4 text-center">
                <div className="text-2xl font-black mb-1" style={{color:c.color}}>{c.value}</div>
                <div className="text-slate-400 text-xs">{c.label}</div>
              </div>
            ))}
          </div>

          {/* Chart 1: เปรียบเทียบทุกหน่วยงาน */}
          <div className="bg-slate-800/50 border border-slate-700 rounded-2xl p-5 shadow-xl">
            <h3 className="text-white font-black mb-1 flex items-center gap-2">🏢 เปรียบเทียบ % การเข้าร่วม ทั้ง 10 หน่วยงาน</h3>
            <p className="text-slate-500 text-xs mb-4">เรียงจากมากไปน้อย • นับเฉพาะวันที่ผ่านมาแล้ว</p>
            <HBarChart data={sorted} labelKey="name" valueKey="avg" />
            {/* gauge bar */}
            <div className="mt-5 pt-4 border-t border-slate-700">
              <div className="flex justify-between text-xs text-slate-500 mb-1">
                <span>0%</span><span className="text-slate-300 font-bold">ภาพรวมทุกหน่วยงาน {overall!==null?overall+"%":"—"}</span><span>100%</span>
              </div>
              <div className="w-full bg-slate-700 rounded-full h-3 overflow-hidden">
                <div className="h-3 rounded-full transition-all duration-1000" style={{width:overall!==null?overall+"%":"0%", background:`linear-gradient(90deg,${barColor(overall)},${barColor(overall)}aa)`}}></div>
              </div>
            </div>
          </div>

          {/* Chart 2+: แยกแผนก ทุกหน่วยงานที่มีหลายแผนก */}
          {MULTI_DEPT_LOCS.map(({locId,label})=>{
            const data = deptStatsAll[locId]||[];
            if(data.length===0) return null;
            return (
              <div key={locId} className="bg-slate-800/50 border border-slate-700 rounded-2xl p-5 shadow-xl">
                <h3 className="text-white font-black mb-1 flex items-center gap-2">🏛️ {label} — เปรียบเทียบแยกแผนก/สังกัด</h3>
                <p className="text-slate-500 text-xs mb-4">เรียงจาก % มากไปน้อย</p>
                <HBarChart data={data} labelKey="dept" valueKey="avg" />
              </div>
            );
          })}

        </div>
      );
    }

    // ============ DASHBOARD VIEW ============
    // เก็บวันที่กิจกรรม: settings/safetydates → { lampun: ["2025-01-06",...], ... }
    // เก็บ override:     overrides/{locId}   → { "key_date": "P"|"O"|"E" }
    // key = empId ถ้ามี ไม่งั้นใช้ fullName

    function DashboardView({ atts, setAtts, locs }) {
      const [selLoc,setSelLoc]         = useState("lampun");
      const [members,setMembers]       = useState([]);
      const [safeDates,setSafeDates]   = useState({}); // {locId: ["2025-01-06",...]}
      const [overrides,setOverrides]   = useState({}); // {locId: {"key_date":"P"|"O"|"E"}}
      const [loadingD,setLoadingD]     = useState(false);
      const [showAddDate,setShowAddDate] = useState(false);
      const [newDate,setNewDate]       = useState("");
      const [savingDate,setSavingDate] = useState(false);
      const [pinFor,setPinFor]         = useState(null);
      const [editDate,setEditDate]     = useState(null); // {old: "2025-05-05"} เมื่อกดที่วันที่
      const [editNewDate,setEditNewDate] = useState("");
      const [savingEdit,setSavingEdit] = useState(false);
      const [copying,setCopying]       = useState(false);
      const [copyMsg,setCopyMsg]       = useState("");
      const [quickAdd,setQuickAdd]     = useState(null); // {fullName, empId, position, department} | null
      const [quickSaving,setQuickSaving] = useState(false);
      const [quickMsg,setQuickMsg]     = useState("");
      const [delOutsider,setDelOutsider] = useState(null); // outsider ที่จะลบ

      // โหลด personnel + safedates + overrides
      const loadReq = useRef(0); // กันข้อมูลหน่วยงานเก่าทับ ถ้ากดสลับหน่วยงานเร็วๆ
      const loadAll = async (locId) => {
        const my = ++loadReq.current;
        setLoadingD(true);
        try {
          const [snapP, docSD, docOV] = await Promise.all([
            db.collection("personnel").where("locationId","==",locId).get(),
            db.collection("settings").doc("safetydates").get(),
            db.collection("overrides").doc(locId).get(),
          ]);
          if(my!==loadReq.current) return;
          setMembers(sortPersonnel(snapP.docs.map(d=>({id:d.id,...d.data()}))));
          const sd = docSD.exists ? (docSD.data()[locId]||[]) : [];
          setSafeDates(prev=>({...prev,[locId]: sd.sort()}));
          const ov = docOV.exists ? docOV.data() : {};
          setOverrides(prev=>({...prev,[locId]: ov}));
        } catch(e){ if(my===loadReq.current) alert("โหลดข้อมูลไม่ได้: "+e.message); }
        finally { if(my===loadReq.current) setLoadingD(false); }
      };

      useEffect(()=>{ loadAll(selLoc); },[selLoc]);

      const EMPTY_DATES = useMemo(()=>[],[]);
      const dates = safeDates[selLoc]||EMPTY_DATES;
      const ov    = overrides[selLoc]||{};

      // หา key สำหรับ member (ใช้ empId ถ้ามี ไม่งั้นใช้ id)
      const memberKey = m => m.empId ? m.empId : m.id;

      // ตรวจว่า member ลงทะเบียนในวันนั้นไหม (จาก atts — ใช้ index ค้นหาเร็ว)
      const attIdx = useMemo(()=>buildAttIndex(atts),[atts]);
      const attOnDate = (m, date) => attHit(attIdx, selLoc, date, m);

      // สถานะของแต่ละ cell: "P"=เข้าร่วม "O"=ไม่เข้าร่วม "E"=ยกเว้น "F"=อนาคต
      const getCellStatus = (m, date) => {
        const key = memberKey(m)+"_"+date;
        const manualVal = ov[key];
        // override มีสิทธิ์สูงสุด (แม้แต่วันอนาคต)
        if(manualVal === "P") return "P";
        if(manualVal === "O") return "O";
        if(manualVal === "E") return "E";
        // วันในอนาคต — ยังไม่ถึง ไม่นับ
        if(isFuture(date)) return "F";
        return attOnDate(m, date) ? "P" : "O";
      };

      // คำนวณ % (ไม่นับ E และ F)
      const calcPct = (m) => {
        let p=0, total=0;
        dates.forEach(d=>{
          const s = getCellStatus(m,d);
          if(s==="E"||s==="F") return;
          total++;
          if(s==="P") p++;
        });
        if(total===0) return null;
        return Math.round(p/total*100);
      };

      // สรุปรวม (ไม่นับ E และ F)
      const calcDateSummary = (date) => {
        if(isFuture(date)) return null;
        let p=0, total=0;
        members.forEach(m=>{
          const s = getCellStatus(m,date);
          if(s!=="E"&&s!=="F"){ total++; if(s==="P") p++; }
        });
        return total>0 ? Math.round(p/total*100) : null;
      };

      // cycle cell: auto→P, P→O, O→E, E→auto(ลบ override)
      const cycleCell = (m, date) => {
        const cur = getCellStatus(m, date);
        const key = memberKey(m)+"_"+date;
        let next;
        if(!ov[key]) { next = cur==="P"?"O":"P"; }
        else if(ov[key]==="P") next = "O";
        else if(ov[key]==="O") next = "E";
        else next = null; // E → auto
        applyOverride(key, next); // ไม่ต้องใส่ PIN แล้ว
      };

      // บันทึกเฉพาะช่องที่กด (merge) + อัปเดตหน้าจอทันที
      // เดิมเขียนทับทั้งเอกสารจาก state เก่า → กด 2 ช่องติดกันเร็วๆ ช่องแรกหาย
      const applyOverride = async (key, val) => {
        const locId = selLoc;
        const prevVal = (overrides[locId]||{})[key];
        setOverrides(prev=>{ const o={...(prev[locId]||{})}; if(val==null) delete o[key]; else o[key]=val; return {...prev,[locId]:o}; });
        try {
          await db.collection("overrides").doc(locId).set({[key]: val===null ? firebase.firestore.FieldValue.delete() : val}, {merge:true});
        } catch(e){
          // คืนค่าเดิม เฉพาะถ้ายังไม่มีการกดเปลี่ยนช่องนี้ซ้ำในระหว่างนั้น
          setOverrides(prev=>{
            const o={...(prev[locId]||{})};
            if((o[key]===undefined?null:o[key])!==val) return prev;
            if(prevVal===undefined) delete o[key]; else o[key]=prevVal;
            return {...prev,[locId]:o};
          });
          alert("บันทึกไม่ได้: "+e.message);
        }
      };

      // แก้ไขวัน (แทนที่วันเดิมด้วยวันใหม่)
      const saveEditDate = async () => {
        if(!editNewDate){ alert("กรุณาเลือกวันที่ใหม่"); return; }
        if(editNewDate === editDate?.old){ setEditDate(null); return; }
        if(dates.includes(editNewDate)){ alert("วันที่ "+editNewDate+" มีอยู่ในแผนแล้ว"); return; }
        setSavingEdit(true);
        try {
          const docSD = await db.collection("settings").doc("safetydates").get();
          const cur = docSD.exists ? (docSD.data()||{}) : {};
          // แทนที่วันเดิมด้วยวันใหม่
          const updated = {...cur, [selLoc]: (cur[selLoc]||[])
            .filter(d=>d!==editDate.old)
            .concat(editNewDate)
            .sort()};
          await db.collection("settings").doc("safetydates").set(updated);
          // แก้ overrides: ย้าย key จากวันเดิมไปวันใหม่ (เขียนเฉพาะ key ที่เปลี่ยน ไม่ทับทั้งเอกสาร)
          const oldD = editDate.old, newD = editNewDate;
          const locOv = overrides[selLoc]||{};
          const patch = {}, moved = {};
          Object.keys(locOv).forEach(k=>{
            if(k.endsWith("_"+oldD)){
              const nk = k.slice(0, k.length-oldD.length)+newD;
              patch[nk] = locOv[k]; patch[k] = firebase.firestore.FieldValue.delete(); moved[k] = nk;
            }
          });
          if(Object.keys(patch).length) await db.collection("overrides").doc(selLoc).set(patch,{merge:true});
          setSafeDates(prev=>({...prev,[selLoc]:updated[selLoc]}));
          setOverrides(prev=>{
            const o = {...(prev[selLoc]||{})};
            Object.keys(moved).forEach(k=>{ const v=o[k]; delete o[k]; if(v!==undefined) o[moved[k]]=v; });
            return {...prev,[selLoc]:o};
          });
          setEditDate(null); setEditNewDate("");
        } catch(e){ alert("แก้ไขวันไม่สำเร็จ: "+e.message); }
        finally { setSavingEdit(false); }
      };

      // เพิ่มวัน
      const addDate = async () => {
        if(!newDate){ alert("กรุณาเลือกวันที่"); return; }
        if(dates.includes(newDate)){ alert("วันที่นี้มีอยู่แล้ว"); return; }
        setSavingDate(true);
        try {
          const docSD = await db.collection("settings").doc("safetydates").get();
          const cur = docSD.exists ? (docSD.data()||{}) : {};
          const updated = {...cur, [selLoc]: [...(cur[selLoc]||[]), newDate].sort()};
          await db.collection("settings").doc("safetydates").set(updated);
          setSafeDates(prev=>({...prev,[selLoc]:updated[selLoc]}));
          setNewDate(""); setShowAddDate(false);
        } catch(e){ alert("เพิ่มวันไม่ได้: "+e.message); }
        finally { setSavingDate(false); }
      };

      // ลบวัน
      const deleteDate = async (date) => {
        try {
          const docSD = await db.collection("settings").doc("safetydates").get();
          const cur = docSD.exists ? (docSD.data()||{}) : {};
          const updated = {...cur, [selLoc]: (cur[selLoc]||[]).filter(d=>d!==date)};
          await db.collection("settings").doc("safetydates").set(updated);
          setSafeDates(prev=>({...prev,[selLoc]:updated[selLoc]}));
          // ลบ overrides ที่เกี่ยวกับวันนี้ด้วย (ลบเฉพาะ key ของวันนั้น ไม่ทับทั้งเอกสาร)
          const keys = Object.keys(overrides[selLoc]||{}).filter(k=>k.endsWith("_"+date));
          if(keys.length){
            const patch = {}; keys.forEach(k=>{ patch[k]=firebase.firestore.FieldValue.delete(); });
            await db.collection("overrides").doc(selLoc).set(patch,{merge:true});
          }
          setOverrides(prev=>{ const o={...(prev[selLoc]||{})}; Object.keys(o).forEach(k=>{ if(k.endsWith("_"+date)) delete o[k]; }); return {...prev,[selLoc]:o}; });
          setPinFor(null);
        } catch(e){ alert("ลบวันไม่ได้: "+e.message); }
      };

      // export Excel
      const exportExcel = () => {
        // หัวคอลัมน์ MM/DD — ถ้าวันที่ข้ามปีแล้วซ้ำกัน ใช้วันที่เต็ม (กันคอลัมน์ทับกัน)
        const short = dates.map(d=>d.slice(5).replace("-","/"));
        const labels = short.map((l,i)=>short.indexOf(l)!==short.lastIndexOf(l)?dates[i]:l);
        const rows = members.map(m=>{
          const row = { "แผนก": m.department, "ชุดงาน": m.position, "ชื่อ-นามสกุล": m.fullName };
          dates.forEach((d,i)=>{
            const s = getCellStatus(m,d);
            row[labels[i]] = s==="P"?"P":s==="E"?"E":"O";
          });
          const pct = calcPct(m);
          row["%เข้าร่วม"] = pct!==null ? pct/100 : "";
          return row;
        });
        const ws = XLSX.utils.json_to_sheet(rows);
        // แสดงคอลัมน์ % เป็นเปอร์เซ็นต์ (ค่าเดิม 0.85 → แสดง 85%)
        try {
          const pc = 3 + dates.length;
          for(let r=1;r<=rows.length;r++){ const c=ws[XLSX.utils.encode_cell({r,c:pc})]; if(c&&c.t==="n") c.z="0%"; }
        } catch(e){}
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, locs[selLoc]?.name||selLoc);
        XLSX.writeFile(wb, `safety-talk-dashboard-${selLoc}-${new Date().getFullYear()}.xlsx`);
      };


      // buildDashboardPDF is now a global function

            // สร้าง analytics HTML สำหรับใส่ใน PDF
      const buildAnalyticsHtmlForPDF = () => {
        // locStats จาก AnalyticsView ไม่ available — ต้องคำนวณใหม่จากข้อมูลที่มี
        // ใช้ atts + members + dates + overrides จาก DashboardView ที่มีอยู่แล้ว
        // แต่เราอยู่ใน DashboardView จึงต้องใช้ locStats ที่คำนวณมาจาก AnalyticsView ไม่ได้
        // วิธีที่ง่ายที่สุด: สร้าง minimal inline
        return ""; // Admin PDF ไม่มี analytics (ข้อมูล locStats ไม่พร้อม)
      };

      // Export PDF (Admin)
      const exportPDF = () => {
        const html = buildDashboardPDF({
          locName:  locs[selLoc]?.name || selLoc,
          locFull:  locs[selLoc]?.fullName || "",
          memberList: members,
          dateList: dates,
          getStatus: (m,d) => getCellStatus(m,d),
          getPct: (m) => calcPct(m),
          getSummaryPct: (d) => {
            if(isFuture(d)) return null;
            let p=0,total=0;
            members.forEach(m=>{ const s=getCellStatus(m,d); if(s!=="E"&&s!=="F"){total++;if(s==="P")p++;} });
            return total>0?Math.round(p/total*100):null;
          },
          outsiders: outsiderList,
          getOutsiderHit: (a,d) => (getOutsiders[d]||[]).some(x=>{
            if(a.empId&&x.empId&&a.empId.toString().trim()===x.empId.toString().trim()) return true;
            if(a.fullName&&x.fullName&&a.fullName.trim()===x.fullName.trim()) return true;
            return false;
          }),
        });
        const w = window.open("","_blank","width=1000,height=700");
        if(!w){ alert("กรุณาอนุญาต Pop-up สำหรับเว็บนี้ก่อนครับ"); return; }
        try { w.opener = null; } catch(e){} // หน้า PDF ไม่ต้องเข้าถึงหน้าหลัก
        w.document.write(html); w.document.close();
        w.onload = () => { w.focus(); w.print(); };
      };

      // หาคนที่ลงทะเบียนในวันที่กำหนด แต่ไม่อยู่ใน members
      const getOutsiders = useMemo(()=>{
        const isMember = memberMatcher(members);
        const result = {}; // { date: [{att},...] }
        dates.forEach(d=>{
          const dayAtts = attsOn(attIdx,selLoc,d).filter(a=>!isMember(a));
          if(dayAtts.length>0) result[d] = dayAtts;
        });
        return result;
      },[attIdx,members,dates,selLoc]);

      // unique คนนอกฐาน (groupby ชื่อ+empId)
      const outsiderList = useMemo(()=>{
        const seen = new Set();
        const list = [];
        Object.values(getOutsiders).flat().forEach(a=>{
          const key = (a.empId||"")+"__"+(a.fullName||"");
          if(!seen.has(key)){ seen.add(key); list.push(a); }
        });
        return list;
      },[getOutsiders]);

      // วันที่มีคนลงทะเบียนแต่ไม่ได้อยู่ในแผน
      const unplannedDates = useMemo(()=>{
        const dateSet = new Set(dates);
        const found = {}; // {date: count}
        atts.forEach(a=>{
          if(a.locationId!==selLoc||!a.timestamp) return;
          const d = bkkDate(a.timestamp);
          if(!dateSet.has(d)){
            found[d] = (found[d]||0) + 1;
          }
        });
        return Object.entries(found).sort((a,b)=>a[0].localeCompare(b[0])).map(([date,count])=>({date,count}));
      },[atts,dates,selLoc]);

      // สีและไอคอน cell (F = อนาคต)
      const cellBg  = s => s==="P"?"bg-emerald-500":s==="E"?"bg-slate-600":s==="F"?"bg-slate-700/50":"bg-red-500/80";
      const cellTxt = s => s==="P"?"✓":s==="E"?"–":s==="F"?"·":"✗";
      const cellCol = s => s==="P"?"text-white font-black":s==="E"?"text-slate-400":s==="F"?"text-slate-600":"text-white font-black";

      // format วันที่ไทย
      const fmtDate = (iso) => {
        const d = new Date(iso+"T00:00:00");
        const m = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
        return d.getDate()+"\n"+m[d.getMonth()];
      };
      const fmtDateShort = (iso) => {
        const d = new Date(iso+"T00:00:00");
        return d.getDate()+""; // แค่วันที่ตัวเลข
      };

      // ลบการลงทะเบียนของ outsider ออกทั้งหมด
      const doDeleteOutsider = async (a) => {
        try {
          // หา attendance records ที่ตรงกับคนนี้
          const snap = await db.collection("attendances")
            .where("locationId","==",selLoc).get();
          const toDelete = snap.docs.filter(doc=>{
            const d = doc.data();
            if(a.empId && d.empId && a.empId.toString().trim()===d.empId.toString().trim()) return true;
            if(a.fullName && d.fullName && a.fullName.trim()===d.fullName.trim()) return true;
            return false;
          });
          await Promise.all(toDelete.map(doc=>doc.ref.delete()));
          // อัปเดต atts ใน state
          const deletedIds = new Set(toDelete.map(d=>d.id));
          setAtts(prev=>prev.filter(a=>!deletedIds.has(a.id)));
          setDelOutsider(null);
        } catch(e){ alert("ลบไม่สำเร็จ: "+e.message); }
      };

      // บันทึก outsider เข้าฐานข้อมูลทันที
      const saveQuickAdd = async () => {
        if(!quickAdd) return;
        if(!quickAdd.fullName.trim()||!quickAdd.position.trim()||!quickAdd.department.trim()){
          setQuickMsg("⚠️ กรุณากรอกชื่อ ตำแหน่ง และแผนกให้ครบ"); return;
        }
        setQuickSaving(true); setQuickMsg("");
        try {
          const data = { empId:quickAdd.empId.trim()||null, fullName:quickAdd.fullName.trim(), position:quickAdd.position.trim(), department:quickAdd.department.trim(), locationId:selLoc };
          const ref = await db.collection("personnel").add(data);
          setMembers(prev=>sortPersonnel([...prev, {id:ref.id,...data}]));
          setQuickMsg("✅ เพิ่มในทะเบียนรายชื่อแล้ว!");
          setTimeout(()=>{ setQuickAdd(null); setQuickMsg(""); }, 1200);
        } catch(e){ setQuickMsg("❌ "+e.message); }
        finally { setQuickSaving(false); }
      };

      const loc = locs[selLoc]||Object.values(locs)[0];

      return (
        <div className="space-y-5">
          {/* QuickAdd Modal */}
          {quickAdd && (
            <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4" onClick={e=>{if(e.target===e.currentTarget){setQuickAdd(null);setQuickMsg("");}}}>
              <div className="bg-slate-800 border border-amber-500/40 rounded-2xl p-5 w-full max-w-sm shadow-2xl">
                <h3 className="text-white font-black text-base mb-1">➕ เพิ่มในทะเบียนรายชื่อ</h3>
                <p className="text-slate-400 text-xs mb-4">ข้อมูลจากการลงทะเบียน — แก้ไขได้ก่อนบันทึก</p>
                {[["รหัสพนักงาน / เบอร์โทร","empId","ไม่บังคับ"],["ชื่อ-นามสกุล *","fullName",""],["ตำแหน่ง *","position",""],["แผนก/สังกัด *","department",""]].map(([lbl,key,ph])=>(
                  <div key={key} className="mb-3">
                    <label className="block text-slate-400 text-xs font-semibold mb-1">{lbl}</label>
                    <input value={quickAdd[key]||""} onChange={e=>setQuickAdd(prev=>({...prev,[key]:e.target.value}))} placeholder={ph}
                      className="w-full bg-slate-900 border border-slate-600 text-white px-3 py-2 rounded-lg text-sm focus:border-amber-400 focus:outline-none"/>
                  </div>
                ))}
                {quickMsg&&<p className="text-xs font-semibold mb-3" style={{color:quickMsg.startsWith("✅")?"#34d399":quickMsg.startsWith("⚠️")?"#f59e0b":"#ef4444"}}>{quickMsg}</p>}
                <div className="flex gap-2">
                  <button onClick={()=>{setQuickAdd(null);setQuickMsg("");}} className="flex-1 bg-slate-700 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-slate-600">ยกเลิก</button>
                  <button onClick={saveQuickAdd} disabled={quickSaving} className="flex-1 bg-amber-500 text-slate-900 font-black py-2.5 rounded-xl text-sm hover:bg-amber-400 disabled:opacity-60">
                    {quickSaving?"กำลังบันทึก...":"💾 บันทึก"}
                  </button>
                </div>
              </div>
            </div>
          )}
          {/* Confirm ลบ outsider */}
          {delOutsider && (
            <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-red-500/40 rounded-2xl p-5 w-full max-w-sm shadow-2xl text-center">
                <div className="text-3xl mb-3">🗑️</div>
                <h3 className="text-white font-black text-base mb-1">ลบข้อมูลการลงทะเบียน</h3>
                <p className="text-slate-400 text-sm mb-1">{delOutsider.fullName||"—"}</p>
                <p className="text-red-400 text-xs mb-4">การลงทะเบียนทั้งหมดของคนนี้จะถูกลบออกจากระบบ</p>
                <div className="flex gap-2">
                  <button onClick={()=>setDelOutsider(null)} className="flex-1 bg-slate-700 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-slate-600">
                    ยกเลิก
                  </button>
                  <button onClick={()=>doDeleteOutsider(delOutsider)} className="flex-1 bg-red-500 text-white font-black py-2.5 rounded-xl text-sm hover:bg-red-400">
                    🗑️ ยืนยันลบ
                  </button>
                </div>
              </div>
            </div>
          )}
          {/* Admin login ด้วย Google แล้ว — ไม่ต้องใช้ PinDialog */}

          {/* Edit Date Modal */}
          {editDate && (
            <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-emerald-500/30 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
                <h3 className="text-white font-black text-base mb-1">📅 แก้ไขวันกิจกรรม</h3>
                <p className="text-slate-400 text-sm mb-4">
                  วันเดิม: <span className="text-amber-400 font-bold">{new Date(editDate.old+"T00:00:00").toLocaleDateString("th-TH",{day:"numeric",month:"long",year:"numeric"})}</span>
                </p>
                <label className="block text-slate-400 text-xs font-semibold mb-1">วันใหม่</label>
                <input type="date" value={editNewDate} onChange={e=>setEditNewDate(e.target.value)}
                  className="w-full bg-slate-900 border-2 border-slate-700 text-white px-3 py-2.5 rounded-lg focus:border-emerald-500 focus:outline-none text-sm mb-4"/>
                <div className="flex gap-2">
                  <button onClick={()=>{setEditDate(null);setEditNewDate("");}}
                    className="flex-1 bg-slate-700 text-white font-bold py-2.5 rounded-xl hover:bg-slate-600">
                    ยกเลิก
                  </button>
                  <button onClick={saveEditDate} disabled={savingEdit}
                    className="flex-1 bg-emerald-500 text-slate-900 font-black py-2.5 rounded-xl hover:bg-emerald-400 disabled:opacity-60">
                    {savingEdit?"กำลังบันทึก...":"💾 บันทึก"}
                  </button>
                </div>
                <button onClick={()=>{ if(window.confirm("ลบวันที่ "+editDate.old+" ออกจากแผน?")){ deleteDate(editDate.old); setEditDate(null); }}}
                  className="w-full mt-2 bg-red-500/10 text-red-400 text-xs font-bold py-2 rounded-xl hover:bg-red-500/20 border border-red-500/20">
                  🗑️ ลบวันนี้ออกจากแผน
                </button>
              </div>
            </div>
          )}

          {/* Header */}
          <div className="bg-slate-800/50 backdrop-blur-lg border border-emerald-500/30 rounded-2xl p-5 shadow-xl">
            <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
              <h2 className="text-xl font-black text-white flex items-center gap-2">📊 Dashboard สถิติการเข้าร่วม Safety Talk</h2>
              <div className="flex gap-2">
                <button onClick={()=>setShowAddDate(v=>!v)}
                  className="flex items-center gap-1.5 bg-emerald-500/20 text-emerald-400 font-bold px-4 py-2 rounded-xl hover:bg-emerald-500/30 border border-emerald-500/30 text-sm">
                  <IPlus sz={14}/>เพิ่มวันกิจกรรม
                </button>
                <button onClick={exportExcel}
                  className="flex items-center gap-1.5 bg-blue-500/20 text-blue-400 font-bold px-4 py-2 rounded-xl hover:bg-blue-500/30 border border-blue-500/30 text-sm">
                  <IDl sz={14}/>Excel
                </button>
                <button onClick={exportPDF}
                  className="flex items-center gap-1.5 bg-red-500/20 text-red-400 font-bold px-4 py-2 rounded-xl hover:bg-red-500/30 border border-red-500/30 text-sm">
                  📄 PDF
                </button>
              </div>
            </div>

            {/* เพิ่มวัน */}
            {showAddDate && (
              <div className="bg-slate-900/60 rounded-xl p-4 mb-4 space-y-3">
                <div className="flex flex-wrap gap-3 items-end">
                  <div>
                    <label className="block text-slate-400 text-xs font-semibold mb-1">เลือกวันกิจกรรม Safety Talk</label>
                    <input type="date" value={newDate} onChange={e=>setNewDate(e.target.value)}
                      className="bg-slate-800 border border-slate-600 text-white px-3 py-2 rounded-lg focus:border-emerald-500 focus:outline-none text-sm"/>
                  </div>
                  <button onClick={addDate} disabled={savingDate}
                    className="bg-emerald-500 text-slate-900 font-bold px-5 py-2 rounded-lg hover:bg-emerald-400 disabled:opacity-60 text-sm">
                    {savingDate?"กำลังบันทึก...":"เพิ่มวัน"}
                  </button>
                  <button onClick={()=>setShowAddDate(false)} className="bg-slate-700 text-white px-4 py-2 rounded-lg text-sm">ยกเลิก</button>
                </div>

                {/* คัดลอกวันจากหน่วยงานนี้ไปทุกหน่วยงาน */}
                <div className="border-t border-slate-700 pt-3">
                  <p className="text-slate-400 text-xs font-semibold mb-2">📋 คัดลอกวันกิจกรรมจาก <span className="text-emerald-400">{locs[selLoc]?.name}</span> ไปใช้ทุกหน่วยงาน</p>
                  <p className="text-slate-500 text-xs mb-2">วันที่ปัจจุบัน ({dates.length} วัน): {dates.slice(0,5).map(d=>d.slice(5).replace("-","/")).join(", ")}{dates.length>5?"...":""}</p>
                  <div className="flex flex-wrap items-center gap-3">
                    <button
                      disabled={copying||dates.length===0}
                      onClick={async ()=>{
                        if(dates.length===0){ alert("ยังไม่มีวันกิจกรรมสำหรับ "+locs[selLoc]?.name); return; }
                        if(!window.confirm("ยืนยัน: คัดลอก "+dates.length+" วัน จาก "+locs[selLoc]?.name+" ไปใช้กับทุกหน่วยงาน?")){return;}
                        setCopying(true); setCopyMsg("");
                        try {
                          const docSD = await db.collection("settings").doc("safetydates").get();
                          const cur = docSD.exists ? (docSD.data()||{}) : {};
                          const updated = {...cur};
                          Object.keys(locs).forEach(locId=>{
                            if(locId===selLoc) return;
                            const ex = new Set(cur[locId]||[]);
                            dates.forEach(d=>ex.add(d));
                            updated[locId] = [...ex].sort();
                          });
                          await db.collection("settings").doc("safetydates").set(updated);
                          setSafeDates(prev=>{
                            const next={...prev};
                            Object.keys(locs).forEach(locId=>{ if(locId!==selLoc) next[locId]=updated[locId]; });
                            return next;
                          });
                          setCopyMsg("✅ คัดลอกสำเร็จ ทุกหน่วยงานมีวันกิจกรรมครบแล้ว");
                          setTimeout(()=>setCopyMsg(""),4000);
                        } catch(e){ setCopyMsg("❌ เกิดข้อผิดพลาด: "+e.message); }
                        finally { setCopying(false); }
                      }}
                      className="flex items-center gap-2 bg-purple-500/20 text-purple-400 font-bold px-4 py-2 rounded-lg hover:bg-purple-500/30 border border-purple-500/30 text-sm disabled:opacity-50">
                      {copying?<ISpin sz={14}/>:"📋"}
                      {copying?"กำลังคัดลอก...":"คัดลอกวันนี้ไปทุก 10 หน่วยงาน"}
                    </button>
                    {copyMsg&&<p className="text-xs font-semibold" style={{color:copyMsg.startsWith("✅")?"#34d399":"#ef4444"}}>{copyMsg}</p>}
                  </div>
                </div>
              </div>
            )}

            {/* เลือกหน่วยงาน */}
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2 mb-3">
              {Object.values(locs).map(l=>(
                <button key={l.id} onClick={()=>setSelLoc(l.id)}
                  className={`px-3 py-2 rounded-xl font-bold text-xs transition-all text-center ${selLoc===l.id?"bg-emerald-500 text-slate-900 shadow-lg shadow-emerald-500/50":"bg-slate-700 text-slate-300 hover:bg-slate-600"}`}>
                  {l.name}
                </button>
              ))}
            </div>
            <div className="p-3 bg-slate-900/50 rounded-lg">
              <p className="text-emerald-400 font-bold text-sm">{loc.name}</p>
              <p className="text-slate-400 text-xs">{loc.fullName} — {members.length} คน • {dates.length} วันกิจกรรม</p>
            </div>
          </div>

          {/* คำอธิบาย */}
          <div className="bg-slate-800/30 border border-slate-700 rounded-xl p-3 flex flex-wrap gap-4 text-xs text-slate-400">
            <span className="flex items-center gap-1"><span className="bg-emerald-500 text-white font-black w-6 h-6 rounded flex items-center justify-center">✓</span> เข้าร่วม (P)</span>
            <span className="flex items-center gap-1"><span className="bg-red-500/80 text-white font-black w-6 h-6 rounded flex items-center justify-center">✗</span> ไม่เข้าร่วม (O)</span>
            <span className="flex items-center gap-1"><span className="bg-slate-600 text-slate-400 font-black w-6 h-6 rounded flex items-center justify-center">–</span> ยกเว้น/ไม่นับ (E)</span>
            <span className="text-slate-500">• กดที่ช่องเพื่อสลับสถานะ P→O→E • กดวันที่เพื่อลบ</span>
          </div>

          {/* Alert: วันที่มีการลงทะเบียนนอกแผน */}
          {unplannedDates.length>0 && (
            <div className="bg-orange-500/15 border-2 border-orange-500/50 rounded-2xl p-4 shadow-lg">
              <div className="flex items-start gap-3">
                <span className="text-2xl flex-shrink-0">⚠️</span>
                <div className="flex-1 min-w-0">
                  <p className="text-orange-400 font-black text-sm mb-1">
                    มี {unplannedDates.reduce((s,x)=>s+x.count,0)} รายการ ที่ลงทะเบียนในวันที่ไม่ได้กำหนดในแผน
                  </p>
                  <div className="flex flex-wrap gap-2 mt-2">
                    {unplannedDates.map(({date,count})=>{
                      const d=new Date(date+"T00:00:00");
                      const MN=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
                      const label=d.getDate()+" "+MN[d.getMonth()]+" "+(d.getFullYear()+543);
                      return (
                        <div key={date} className="flex items-center gap-1.5 bg-slate-900/60 border border-orange-500/30 rounded-lg px-2 py-1">
                          <span className="text-white text-xs font-bold">{label}</span>
                          <span className="text-orange-400 text-xs">({count} คน)</span>
                          <button
                            onClick={async ()=>{
                              if(dates.includes(date)){ alert("วันที่นี้มีอยู่แล้ว"); return; }
                              try {
                                const docSD=await db.collection("settings").doc("safetydates").get();
                                const cur=docSD.exists?(docSD.data()||{}):{};
                                const updated={...cur,[selLoc]:[...(cur[selLoc]||[]),date].sort()};
                                await db.collection("settings").doc("safetydates").set(updated);
                                setSafeDates(prev=>({...prev,[selLoc]:updated[selLoc]}));
                              } catch(e){ alert("เพิ่มวันไม่ได้: "+e.message); }
                            }}
                            className="bg-emerald-500/20 text-emerald-400 text-xs font-bold px-2 py-0.5 rounded hover:bg-emerald-500/40 transition-colors">
                            + เพิ่มในแผน
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ตาราง */}
          {loadingD
            ? <div className="flex justify-center py-16"><ISpin sz={36} cl="text-emerald-400"/></div>

              : dates.length===0
                ? <div className="text-center py-16 text-slate-500 bg-slate-800/30 rounded-2xl"><p className="text-lg">ยังไม่มีวันกิจกรรม</p><p className="text-sm mt-1">กดปุ่ม "เพิ่มวันกิจกรรม" ด้านบนครับ</p></div>

                              return tt>0?<span className="text-amber-400 font-black">{Math.round(tp/tt)}%</span>:<span className="text-slate-500">—</span>;
